    const both = o.name && o.sub;
    s += `<text class="ft-m ${o.numCls || ''}" x="${n(x + w / 2)}" y="${n(y + h * (both ? 0.6 : o.name || o.sub ? 0.68 : 0.8))}" font-size="${n(h * (both ? 0.4 : o.name || o.sub ? 0.48 : 0.6))}" fill="${C.ink}" text-anchor="middle">${esc(o.num || '00')}</text>`;
    if (o.name) s += Tx(x + w / 2, y + h * (both ? 0.76 : 0.88), o.name, h * (both ? 0.11 : 0.13), C.ink, 'text-anchor="middle" letter-spacing="1"', FONTS.ui);
    if (o.sub) s += Tx(x + w / 2, y + h * (both ? 0.9 : 0.92), o.sub, h * 0.08, '#4A3A00', 'text-anchor="middle"', FONTS.ui);
    if (o.glow !== false) s = glow(x + w / 2, y + h / 2, w * 0.9, h * 0.9, 'gY', 0.35) + s;
  }
  return `<g class="qtv ${o.cls || ''}">${s}</g>`;
}

// Queue kiosk on its pedestal. o: {s, screen(sx,sy,sw,sh), plug:'in'|'out'|null, lit}
function kiosk(x, y, o = {}) {
  const s = o.s || 1;
  let g = R(-34, -150, 68, 150, '#E9E6DE', st(C.ink, 3)) + R(-40, -6, 80, 8, '#2A2B30', st(C.ink, 2));
  g += R(-48, -300, 96, 160, '#1D1F24', `rx="6" ${st(C.ink, 3)}`);
  g += R(-40, -290, 80, 110, o.lit === false ? '#22272E' : '#DDF3FB', `rx="3"${o.lit === false ? '' : ' class="lit"'}`);
  if (o.screen) g += o.screen(-40, -290, 80, 110);
  g += R(-26, -168, 52, 8, '#0A0A0A', st('#555', 1.4)) + R(-48, -300, 96, 14, C.y, st(C.ink, 2));
  if (o.plug === 'out') g += Pa('M30 -10 C60 -10 70 30 40 50 L40 70', 'none', st('#1A1A1A', 4)) + R(30, 66, 22, 16, '#E6E3DA', st(C.ink, 2)) + Ln(36, 82, 36, 92, '#B9B4A8', 3) + Ln(46, 82, 46, 92, '#B9B4A8', 3);
  return `<g class="kiosk ${o.cls || ''}" transform="translate(${n(x)} ${n(y)}) scale(${s})">${g}</g>`;
}

// Perspective floor tiles from a vanishing point.
function floorGrid(box, vx, vy, o = {}) {
  const [x, y, w, h] = box;
  let s = R(x, y, w, h, o.col || '#D9D5CB');
  const lines = o.lines || 14, col = o.lineCol || '#B4AFA2';
  for (let i = -lines; i <= lines * 2; i++) {
    const bx = x + (i / lines) * w;
    s += Ln(vx, vy, bx, y + h, col, 1.4);
  }
  for (let k = 1; k <= (o.rows || 9); k++) {
    const t = Math.pow(k / (o.rows || 9), 1.8);
    const yy = lerp(vy, y + h, t);
    if (yy > y) s += Ln(x, yy, x + w, yy, col, 1.2);
  }
  return s;
}

// The shop floor seen from behind the counter, looking out to the front glass and roller door.
// o: {lights:[...on flags], dark (0..1), door:'down'|'up', rain, glassFn(box), ollie:{...}}
function storeFront(box, o = {}) {
  const [x, y, w, h] = box;
  const r = rng(o.seed || 'storefront');
  let s = '';
  const ceil = y + h * 0.16, floorY = y + h * 0.66;
  s += R(x, y, w, h, '#C9C5BA');
  // ceiling
  s += R(x, y, w, ceil - y, '#9B978D');
  const tubes = o.lights || [true, true, true, true];
  tubes.forEach((on, i) => { s += fluoro(x + w * (0.1 + i * 0.22), ceil - 18, w * 0.14, { on, drop: h * 0.5, flicker: o.flicker === i, coneOp: 0.45 }); });
  // side walls with yellow promo panels
  s += Po([[x, ceil], [x + w * 0.12, ceil + h * 0.05], [x + w * 0.12, floorY - h * 0.02], [x, floorY + h * 0.1]], '#B8B3A7', st(C.ink, 2));
  s += Po([[x + w, ceil], [x + w * 0.88, ceil + h * 0.05], [x + w * 0.88, floorY - h * 0.02], [x + w, floorY + h * 0.1]], '#B8B3A7', st(C.ink, 2));
  s += Po([[x + w * 0.02, ceil + h * 0.1], [x + w * 0.1, ceil + h * 0.12], [x + w * 0.1, ceil + h * 0.34], [x + w * 0.02, ceil + h * 0.36]], C.y, st(C.ink, 2));
  // the front: glass and roller door
  const gx = x + w * 0.12, gw = w * 0.76, gy = ceil + h * 0.05, gh = floorY - gy - h * 0.02;
  s += R(gx, gy, gw, gh, '#25313D');
  if (o.outside) s += `<g clip-path="none">${o.outside([gx, gy, gw, gh])}</g>`;
  if (o.rain !== false) s += rainFx([gx, gy, gw, gh], { op: 0.7, op2: 0.5 });
  s += glassDrops([gx, gy, gw, gh], 'sf', 50);
  if (o.door !== 'up') {
    const dh = o.door === 'half' ? gh * 0.45 : gh;
    let slats = '';
    for (let yy = gy; yy < gy + dh; yy += 14) slats += Ln(gx, yy, gx + gw, yy, '#5D6066', 2);
    s += `<g opacity="${o.doorOp == null ? 0.82 : o.doorOp}">${R(gx, gy, gw, dh, '#7C8087')}${slats}${R(gx, gy + dh - 10, gw, 10, '#3A3D44')}</g>`;
  }
  for (let i = 0; i <= 4; i++) s += Ln(gx + (gw * i) / 4, gy, gx + (gw * i) / 4, gy + gh, '#1C1D21', 5);
  s += R(gx, gy, gw, gh, 'none', st(C.ink, 5));
  // floor
  s += `<g>${floorGrid([x, floorY, w, y + h - floorY], x + w / 2, floorY - h * 0.25, { col: '#CFCBC0', lineCol: '#ADA89B', rows: 7 })}</g>`;
  if (o.dark) s += R(x, y, w, h, C.ink, `opacity="${o.dark}"`);
  return s;
}

  // tables and chairs

    s += E(cx, cy, w * 0.07, h * 0.02, '#5A4632', st(C.ink, 1.6)) + Ln(cx, cy, cx, cy + h * 0.14, '#222', 3);
    if (o.cups) s += R(cx - 5, cy - 12, 10, 11, '#F4F0E6', st(C.ink, 1.2)) + `<g class="fx-steam" style="animation-delay:${i * 0.4}s">${Pa(`M${n(cx)} ${n(cy - 14)}q-5 -8 0 -16q5 -8 0 -16`, 'none', st('#F2F2F2', 2, 'opacity=".6"'))}</g>`;
  });
  // window glass sheen
  s += Pa(`M${n(x)} ${n(y + h * 0.18)}L${n(x + w * 0.2)} ${n(y + h * 0.18)}L${n(x)} ${n(y + h * 0.6)}Z`, '#FFFFFF', 'opacity=".05"');
  if (!lit && !o.full) s += R(x, y, w, h, C.ink, 'opacity=".35"');
  return s;
}

/* ---------- back of house ---------- */

// Sealed handset box with a label. o: {label, sub, glow, warm, cls}
function handsetBox(x, y, w, h, o = {}) {
  let s = R(x, y, w, h, o.col || '#F1EEE6', st(C.ink, Math.max(1.4, w * 0.03)));
  s += R(x, y + h * 0.42, w, h * 0.12, o.tape || '#C9B98E', 'opacity=".75"');
  if (o.glow) s += R(x + 2, y + 2, w - 4, h - 4, C.screen, `opacity="${o.glow}" class="lit"`);
  if (o.label) {
    s += R(x + w * 0.08, y + h * 0.6, w * 0.84, h * 0.3, '#FFFFFF', st(C.ink, 1.2));
    s += Tx(x + w / 2, y + h * 0.73, o.label, Math.min(h * 0.11, (w * 1.5) / Math.max(6, o.label.length)), C.ink, 'text-anchor="middle"', FONTS.mono);
    if (o.sub) s += Tx(x + w / 2, y + h * 0.86, o.sub, Math.min(h * 0.08, (w * 1.4) / Math.max(6, o.sub.length)), '#333', 'text-anchor="middle"', FONTS.mono);
  }
  return `<g class="hbox ${o.cls || ''}">${s}</g>`;
}

// Steel shelving unit stacked with boxes. o: {rows, glow, labels(i,j) -> [label, sub], seed}
function shelfUnit(x, y, w, h, o = {}) {
  const rows = o.rows || 4, r = rng(o.seed || 'shelf');
  let s = '';
  const rh = h / rows;
  for (let j = 0; j < rows; j++) {
    const yy = y + j * rh;
    let bx = x + 6;
    while (bx < x + w - 30) {
      const bw = Math.min(x + w - 6 - bx, rh * (0.55 + r() * 0.3)), bh = rh * (0.6 + r() * 0.25);
      const lab = o.labels ? o.labels(j, Math.round((bx - x) / 40)) : null;
      s += handsetBox(bx, yy + rh - 8 - bh, bw - 4, bh, { glow: o.glow ? o.glow * (0.4 + r() * 0.6) : 0, label: lab && lab[0], sub: lab && lab[1], col: o.boxCol });
      bx += bw;
    }
    s += R(x, yy + rh - 8, w, 8, '#7D828A', st(C.ink, 2));
  }
  s += R(x - 4, y, 8, h, '#6A6F77', st(C.ink, 2)) + R(x + w - 4, y, 8, h, '#6A6F77', st(C.ink, 2));
  return s;
}

// Laptop. o: {screen (fill), content(sx,sy,sw,sh), open, rot}
function laptopObj(x, y, w, h, o = {}) {
  let s = Po([[x - w * 0.06, y + h], [x + w * 1.06, y + h], [x + w, y + h * 0.82], [x, y + h * 0.82]], '#9AA0A8', st(C.ink, 2.5));
  s += R(x, y, w, h * 0.82, '#2A2D33', `rx="5" ${st(C.ink, 2.5)}`);
  const sx = x + w * 0.05, sy = y + h * 0.06, sw = w * 0.9, sh = h * 0.7;
  s += R(sx, sy, sw, sh, o.screen || '#121820', 'class="lit"');
  if (o.content) s += o.content(sx, sy, sw, sh);
  return `<g class="laptop ${o.cls || ''}"${o.rot ? ` transform="rotate(${o.rot} ${n(x + w / 2)} ${n(y + h / 2)})"` : ''}>${s}</g>`;
}

// JARVIS-style enterprise window. o: {title, lines:[...], size, tabs}
function jarvisWindow(x, y, w, h, o = {}) {
  let s = R(x, y, w, h, '#C9D0D6', st(C.ink, 3));
  s += R(x, y, w, h * 0.08, '#56606B') + Tx(x + 10, y + h * 0.058, o.title || 'JARVIS — Customer Interaction', h * 0.04, '#EEF2F5', '', FONTS.mono);
  const tabs = o.tabs || ['Account', 'Services', 'Interaction Notes', 'Billing'];
  tabs.forEach((t, i) => { s += R(x + 8 + i * w * 0.24, y + h * 0.1, w * 0.23, h * 0.05, i === 2 ? '#EEF1F3' : '#AEB7BF', st('#56606B', 1)) + Tx(x + 14 + i * w * 0.24, y + h * 0.138, t, h * 0.03, '#2C3540', '', FONTS.mono); });
  s += R(x + 8, y + h * 0.15, w - 16, h * 0.82, '#F4F6F7', st('#7C8792', 1));
  return s;
}

/* ---------- the shop floor in one-point perspective ---------- */

// Bilinear point in a quad [p00, p10, p11, p01] (u across, v down).
function quadPt(q, u, v) {
  const t = [lerp(q[0][0], q[1][0], u), lerp(q[0][1], q[1][1], u)];
  const b = [lerp(q[3][0], q[2][0], u), lerp(q[3][1], q[2][1], u)];
  return [lerp(t[0], b[0], v), lerp(t[1], b[1], v)];
}
// Depth fraction (0 near … 1 far) to screen fraction along a receding wall.
const persp = (s, Z = 3.2) => (1 - 1 / (1 + s * (Z - 1))) / (1 - 1 / Z);
const quadAt = (q, u0, u1, v0, v1) => [quadPt(q, u0, v0), quadPt(q, u1, v0), quadPt(q, u1, v1), quadPt(q, u0, v1)];

// o: {vx, vy (0..1 in box), bw, bh (back wall size 0..1), night (0..1 darkness), lights:[6 flags], flicker (index),
//     back: 'front'|'wall'|fn(x,y,w,h), left: 'acc'|'display'|'glass'|null, right: same, rain, door, ollie: markup at back wall,
//     litScreens (phones lit), ring, tint}
function storeInterior(box, o = {}) {
  const [x, y, w, h] = box;
  const vx = x + w * (o.vx == null ? 0.5 : o.vx), vy = y + h * (o.vy == null ? 0.42 : o.vy);
  const bw = w * (o.bw || 0.44), bh = h * (o.bh || 0.5);
  const bl = vx - bw / 2, br = vx + bw / 2, bt = vy - bh * 0.5, bb = vy + bh * 0.5;
  const X0 = x - 4, X1 = x + w + 4, Y0 = y - 4, Y1 = y + h + 4;
  const TL = [X0, Y0], TR = [X1, Y0], BR = [X1, Y1], BL = [X0, Y1];
  const btl = [bl, bt], btr = [br, bt], bbr = [br, bb], bbl = [bl, bb];
  const night = o.night == null ? 0.35 : o.night;
  const cols = o.day ? { ceil: '#C9C6BD', wall: '#DAD6CC', wall2: '#CFCBC0', floor: '#D2CEC3', tile: '#B3AEA1', back: '#E3DFD6' } :
    { ceil: '#252C35', wall: '#3E4854', wall2: '#36404B', floor: '#2C343D', tile: '#3B4550', back: '#46515D' };
  let s = '';
  // ceiling, walls, floor
  s += Po([TL, TR, btr, btl], cols.ceil);
  const leftQ = [TL, btl, bbl, BL], rightQ = [TR, btr, bbr, BR];
  s += Po(leftQ, cols.wall) + Po(rightQ, cols.wall2);
  s += Po([BL, BR, bbr, bbl], cols.floor);
  // floor tiles converging on the vanishing point
  let tiles = '';
  const N = 16;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const top = [lerp(bl, br, t), bb], bot = [lerp(x - w * 1.2, x + w * 2.2, t), Y1];
    tiles += `M${n(top[0])} ${n(top[1])}L${n(bot[0])} ${n(bot[1])}`;
  }
  for (let k = 1; k <= 8; k++) {
    const t = persp(1 - k / 8.5, 3.4), yy = lerp(Y1, bb, t);
    const xl = lerp(X0, bl, (yy - Y1) / (bb - Y1)), xr = lerp(X1, br, (yy - Y1) / (bb - Y1));
    tiles += `M${n(xl)} ${n(yy)}L${n(xr)} ${n(yy)}`;
  }
  s += `<path d="${tiles}" fill="none" stroke="${cols.tile}" stroke-width="1.5"/>`;
  // ceiling tubes in perspective
  const ceilQ = [TL, TR, btr, btl];
  const lights = o.lights || [1, 1, 1, 1, 1, 1];
  [[0.12, 0.3], [0.5, 0.6], [0.78, 0.82]].forEach(([dv], row) => {
    [[0.22, 0.4], [0.6, 0.78]].forEach(([u0, u1], c) => {
      const on = lights[row * 2 + c];
      const v = persp(dv), v2 = persp(dv + 0.06);
      const q = quadAt(ceilQ, u0, u1, v, v2);
      const cx = (q[0][0] + q[2][0]) / 2, cy = (q[0][1] + q[2][1]) / 2;
      const wq = Math.abs(q[1][0] - q[0][0]);
      s += `<g${o.flicker === row * 2 + c ? ' class="fx-flicker"' : o.flicker2 === row * 2 + c ? ' class="fx-flicker2"' : ''}>${on ? glow(cx, cy + wq * 0.25, wq * 0.9, wq * 0.55, 'gW', o.day ? 0.5 : 0.35) : ''}${Po(q, on ? '#F4FAFF' : '#4A525C', st(C.ink, 1.5))}</g>`;
    });
  });
  // the back wall
  s += R(bl, bt, bw, bh, cols.back, st(C.ink, 2.5));
  if (typeof o.back === 'function') s += o.back(bl, bt, bw, bh);
  else if (o.back !== 'wall') {
    // front glass + roller door + the mall beyond
    const gx = bl + bw * 0.06, gy = bt + bh * 0.08, gw = bw * 0.88, gh = bh * 0.92;
    s += R(gx, gy, gw, gh, '#141B24');
    if (o.outside) s += o.outside(gx, gy, gw, gh);
    if (o.rain !== false) s += rainFx([gx, gy, gw, gh], { op: 0.6, op2: 0.45 });
    s += glassDrops([gx, gy, gw, gh], 'si' + (o.seed || ''), 26);
    if (o.door !== 'up') {
      const dh = o.door === 'half' ? gh * 0.45 : gh;
      let sl = '';
      for (let yy = gy + 6; yy < gy + dh; yy += 9) sl += `M${n(gx)} ${n(yy)}h${n(gw)}`;
      s += `<g opacity="${o.doorOp == null ? 0.85 : o.doorOp}">${R(gx, gy, gw, dh, o.day ? '#8C9097' : '#5A5F67')}<path d="${sl}" stroke="${o.day ? '#6A6E75' : '#3E4249'}" stroke-width="2"/>${R(gx, gy + dh - 7, gw, 7, '#2E3137')}</g>`;
    }
    for (let i = 0; i <= 3; i++) s += Ln(gx + (gw * i) / 3, gy, gx + (gw * i) / 3, gy + gh, '#111317', 4);
    s += R(gx, gy, gw, gh, 'none', st(C.ink, 4));
  }
  if (o.ollie) s += o.ollie(bl, bt, bw, bh);
  // side walls: accessories pegboard, display wall, or glass
  const wallItems = (q, kind, side) => {
    let g = '';
    if (kind === 'acc') {
      const rows = 4, cs = 7;
      g += Po(quadAt(q, 0.02, 0.98, 0.18, 0.86), o.day ? '#E8E4DA' : '#4C5662', st(C.ink, 1.6));
      for (let j = 0; j < rows; j++) for (let i = 0; i < cs; i++) {
        const u0 = persp(0.04 + i * 0.13), u1 = persp(0.04 + i * 0.13 + 0.08);
        const v0 = 0.24 + j * 0.15, v1 = v0 + 0.11;
        const col = ['#2B4E7A', '#C8C3B5', '#7A2E3A', C.y, '#2E2E33', '#4E7A5A'][(i * 3 + j * 5) % 6];
        g += Po(quadAt(q, u0, u1, v0, v1), o.day ? col : shade(col, -0.45), st(C.ink, 1.2));
      }
    } else if (kind === 'display') {
      g += Po(quadAt(q, 0.02, 0.98, 0.16, 0.2), C.y, st(C.ink, 1.5));
      g += Po(quadAt(q, 0.02, 0.98, 0.2, 0.84), o.day ? '#EEEBE4' : '#4A5460', st(C.ink, 1.6));
      for (let j = 0; j < 3; j++) {
        g += Po(quadAt(q, 0.02, 0.98, 0.37 + j * 0.2, 0.385 + j * 0.2), '#8A8D93');
        for (let i = 0; i < 8; i++) {
          const u0 = persp(0.04 + i * 0.12), u1 = persp(0.04 + i * 0.12 + 0.05);
          const qq = quadAt(q, u0, u1, 0.24 + j * 0.2, 0.36 + j * 0.2);
          const lit = typeof o.litScreens === 'function' ? o.litScreens(i, j, side) : o.litScreens;
          g += Po(qq, '#16181C', st(C.ink, 1.1)) + Po(quadAt(q, u0 + (u1 - u0) * 0.12, u1 - (u1 - u0) * 0.12, 0.25 + j * 0.2, 0.35 + j * 0.2), lit ? (lit === true ? '#CFF2FF' : lit) : '#232A33', lit ? 'class="lit"' : '');
          if (lit) { const c = quadPt(q, (u0 + u1) / 2, 0.3 + j * 0.2); g += glow(c[0], c[1], Math.abs(qq[1][0] - qq[0][0]) * 2, Math.abs(qq[3][1] - qq[0][1]) * 1.1, 'gS', 0.35); }
          if (o.ring && (i + j) % 2 === 0) { const c = quadPt(q, u1, 0.27 + j * 0.2); g += `<g class="fx-ring" style="--rd:${((i * 3 + j) % 7) * 0.15}s">${Pa(`M${n(c[0] + 3)} ${n(c[1] - 6)}q5 6 0 12M${n(c[0] + 8)} ${n(c[1] - 9)}q7 9 0 18`, 'none', st(C.y, 2))}</g>`; }
        }
      }
    } else if (kind === 'glass') {
      g += Po(quadAt(q, 0.05, 0.95, 0.12, 0.92), '#141B24', st(C.ink, 2));
      if (o.rain !== false) g += `<g opacity=".6">${glassDrops([Math.min(q[0][0], q[1][0]), q[1][1], Math.abs(q[1][0] - q[0][0]), q[2][1] - q[1][1]], 'sg' + side, 18)}</g>`;
    } else if (typeof kind === 'function') g += kind(q);
    return g;
  };
  s += wallItems(leftQ, o.left === undefined ? 'acc' : o.left, 'L') + wallItems(rightQ, o.right === undefined ? 'display' : o.right, 'R');
  // corner lines
  s += Pa(`M${n(X0)} ${n(Y0)}L${n(bl)} ${n(bt)}M${n(X1)} ${n(Y0)}L${n(br)} ${n(bt)}M${n(X0)} ${n(Y1)}L${n(bl)} ${n(bb)}M${n(X1)} ${n(Y1)}L${n(br)} ${n(bb)}`, 'none', st(C.ink, 2.5));
  if (night) s += R(x - 10, y - 10, w + 20, h + 20, o.tint || C.ink, `opacity="${night}"`);
  if (o.vig !== false) s += R(x - 10, y - 10, w + 20, h + 20, 'url(#gVig)', `opacity="${o.vig || 0.8}"`);
  return s;
}

// The counter seen from behind, across the bottom of a panel. o: {y (top edge), tilt, dark}
function counterFore(box, o = {}) {
  const [x, y, w, h] = box;
  const ty = o.y || y + h * 0.82, t2 = ty + (o.tilt || 0);
  let s = Po([[x - 10, ty], [x + w + 10, t2], [x + w + 10, y + h + 10], [x - 10, y + h + 10]], o.dark ? '#16181C' : '#2B2E35', st(C.ink, 4));
  s += Pa(`M${n(x - 10)} ${n(ty + 5)}L${n(x + w + 10)} ${n(t2 + 5)}`, 'none', st(o.dark ? '#2E323A' : '#4A4F58', 3));
  return s;
}

// Flat pegboard wall of accessories (cases, chargers, cables) on hooks. o: {dark, seed, rows, cols}
function pegboard(box, o = {}) {
  const [x, y, w, h] = box, r = rng(o.seed || 'peg');
  let s = R(x, y, w, h, o.dark ? '#3C4550' : '#E6E2D8') + R(x, y, w, h, 'url(#ht1)', 'opacity=".35"');
  const rows = o.rows || 4, cols = o.cols || 6;
  const cw = w / cols, rh = h / rows;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    if (r() < 0.12) continue;
    const cx = x + cw * (i + 0.5), top = y + rh * j + rh * 0.12;
    const pw = cw * (0.5 + r() * 0.2), ph = rh * (0.62 + r() * 0.15);
    const col = r.pick(['#2B4E7A', '#C8C3B5', '#7A2E3A', C.y, '#2E2E33', '#4E7A5A', '#E7E4DC']);
    s += Ln(cx, top - 8, cx, top + 6, '#888', 2) + R(cx - pw / 2, top, pw, ph, o.dark ? shade(col, -0.4) : col, st(C.ink, 1.6));
    s += R(cx - pw * 0.3, top + ph * 0.25, pw * 0.6, ph * 0.55, o.dark ? '#5A6470' : '#F8F8F4', `opacity=".75" ${st(C.ink, 1)}`);
    s += Ci(cx, top + 5, 3, o.dark ? '#222' : '#FFF', st(C.ink, 1));
  }
  return s;
}

// A hand counting on its fingers (hoodie sleeve pulled over the wrist). up = fingers raised.
function handCount(x, y, sc, up, skin = '#EEC7A6', sleeve = '#6B7076') {
  let g = '';
  const fingers = [[-22, -2], [-8, -8], [6, -8], [19, -2]];
  fingers.forEach(([fx, fa], i) => {
    const raised = i < up;
    g += `<g transform="translate(${fx} -46) rotate(${fa + (raised ? 0 : 0)})">${R(-6.5, raised ? -50 : -18, 13, raised ? 54 : 22, skin, `rx="6.5" ${st(C.ink, 2.6)}`)}${raised ? Ln(-3, -36, 3, -36, shade(skin, -0.3), 1.2) : ''}</g>`;
  });
  g += Pa('M-30 -50 C-34 -20 -26 0 0 2 C24 0 32 -20 28 -50 Z', skin, st(C.ink, 2.8));
  g += `<g transform="translate(-30 -26) rotate(-40)">${R(-6, -26, 12, 30, skin, `rx="6" ${st(C.ink, 2.6)}`)}</g>`;
  g += Pa('M-36 -6 C-36 20 36 20 36 -6 L40 40 L-40 40 Z', sleeve, st(C.ink, 3));
  return `<g transform="translate(${n(x)} ${n(y)}) scale(${sc})">${g}</g>`;
}

/* ---------- Page 4 — The Board ---------- */

const crown = (x, y, s = 1, col = C.y) => `<path d="M${n(x - 9 * s)} ${n(y + 6 * s)}L${n(x - 10 * s)} ${n(y - 6 * s)}L${n(x - 4 * s)} ${n(y)}L${n(x)} ${n(y - 9 * s)}L${n(x + 4 * s)} ${n(y)}L${n(x + 10 * s)} ${n(y - 6 * s)}L${n(x + 9 * s)} ${n(y + 6 * s)}Z" fill="${col}" stroke="${C.ink}" stroke-width="${n(1.4 * s)}" stroke-linejoin="round"/>`;

// The BEST OF THE MONTH wall monitor. o: {sales, glow, skew}
function leaderboard(x, y, w, h, o = {}) {
  const d = new Date();
  const when = `3:00 AM · ${d.getDate()} ${d.toLocaleString(undefined, { month: 'short' })}`;
  const k = w / 600;
  let s = R(x - 10 * k, y - 10 * k, w + 20 * k, h + 20 * k, '#141518', `rx="${8 * k}" ${st(C.ink, 3)}`);
  s += R(x, y, w, h, '#F4F2EA', 'class="lit"');
  s += R(x, y, w, h * 0.13, C.y) + Tx(x + w / 2, y + h * 0.095, 'BEST OF THE MONTH', h * 0.07, C.ink, 'text-anchor="middle" letter-spacing="2"', FONTS.ui);
  // rank 1: Jarrad — photo, crowns, the total that keeps climbing
  const px = x + w * 0.04, py = y + h * 0.18, pw = w * 0.24, ph = h * 0.48;
  const cid = uid('lb');
  s += `<clipPath id="${cid}"><rect x="${n(px)}" y="${n(py)}" width="${n(pw)}" height="${n(ph)}"/></clipPath>`;
  s += R(px, py, pw, ph, '#BFD4E6') + `<g clip-path="url(#${cid})">${fig('jarrad', { x: px + pw / 2, y: py + ph * 2.35, s: ph / 150, view: 'front', face: 'grin', light: 'none', props: ['lanyard'] })}</g>` + R(px, py, pw, ph, 'none', st(C.ink, 2.5));
  s += Tx(px + pw + w * 0.04, py + h * 0.1, '#1  JARRAD', h * 0.085, C.ink, '', FONTS.ui);
  s += `<text class="ft-m p4-sales" x="${n(px + pw + w * 0.04)}" y="${n(py + h * 0.26)}" font-size="${n(h * 0.15)}" fill="${C.ink}">${o.sales || 287}</text>`;
  s += Tx(px + pw + w * 0.04 + h * 0.36, py + h * 0.25, 'SALES', h * 0.05, '#555', '', FONTS.ui);
  for (let i = 0; i < 12; i++) s += crown(px + pw + w * 0.07 + i * w * 0.052, py + h * 0.36, k * 1.15);
  s += Tx(px + pw + w * 0.04, py + h * 0.46, `Last sale: ${when}`, h * 0.045, '#444', '', FONTS.mono);
  s += `<g class="sale-toast">${R(px + pw + w * 0.36, py + h * 0.17, w * 0.2, h * 0.08, '#2BB673', `rx="${h * 0.04}"`)}${Tx(px + pw + w * 0.46, py + h * 0.23, 'SALE ✓', h * 0.05, '#FFFFFF', 'text-anchor="middle"', FONTS.ui)}</g>`;
  // the rest of the board
  const rows = [['#2  ZEE', '271'], ['#3  CHASE', '198'], ['#4  LUKA', '164'], ['#5  ZANE', '9']];
  rows.forEach(([nm, v], i) => {
    const ry = y + h * (0.72 + i * 0.065);
    s += R(x + w * 0.04, ry - h * 0.045, w * 0.92, h * 0.058, i % 2 ? '#ECE9E0' : '#E3E0D6');
    s += Tx(x + w * 0.06, ry, nm, h * 0.045, C.ink, '', FONTS.ui) + Tx(x + w * 0.9, ry, v, h * 0.05, C.ink, 'text-anchor="end"', FONTS.mono);
  });
  if (o.glow) s = glow(x + w / 2, y + h / 2, w * 0.8, h * 0.9, 'gW', o.glow) + s;
  return s;
}

// Close-up of a status bar on a device, switching from bars to SOS when its trigger fires.
function statusInsert(x, y, w, from, cls, o = {}) {
  const sc = w / 62;
  const a = signalGlyph(x, y, sc, from, o.col || C.ink);
  const b = signalGlyph(x, y, sc, o.to || 'sos', o.to === '3g' ? o.col || C.ink : o.sosCol || '#B3121F');
  return swap(a, b, cls);
}

/* ---------- local helpers (prefixed pA_: every source file shares one scope) ---------- */

const pA_style = (css) => `<style>${css}</style>`;

// A small balloon that keeps its lettering lower-case (the kit's balloons are all caps).
function pA_tiny(pg, p, x, y, text, o = {}) {
  const size = o.size || 22;
  const tw = textW(text, size, FONTS.speech);
  const rx = tw / 2 + 18, ry = size * 0.9;
  const fill = o.dark ? C.ink : '#FFFFFF', line = o.dark ? '#FFFFFF' : C.ink, tcol = o.dark ? '#FFFFFF' : C.ink;
  const tail = o.tail ? Pa(tailPath(x, y, rx, ry, o.tail, { tw: 0.3 }), fill) : '';
  const el = E(x, y, rx, ry, fill);
  pg.lines.push({ who: o.who || '', text, type: o.type || 'speech' });
  return `<g class="${o.cls || 'bl'}" data-p="${p}" style="--i:${pg.bal++}"><g ${st(line, 5, o.dash ? 'stroke-dasharray="8 6"' : '')}>${el}${tail}</g><g>${el}${tail}</g>` +
    `<text class="ft-s" x="${n(x)}" y="${n(y + size * 0.34)}" font-size="${size}" fill="${tcol}" text-anchor="middle">${esc(text)}</text></g>`;
}

// Stream overlay strip: red LIVE pill, watching count, the title.
function pA_streamBar(x, y, w, o = {}) {
  const h = o.h || 34, k = h / 34;
  let g = R(x, y, w, h, 'rgba(8,8,10,.72)', `rx="${4 * k}"`);
  g += R(x + 6 * k, y + 6 * k, 58 * k, 22 * k, '#E0262F', `rx="${4 * k}"`) + Ci(x + 16 * k, y + 17 * k, 4 * k, '#FFFFFF', 'class="fx-blink"');
  g += Tx(x + 24 * k, y + 23 * k, 'LIVE', 15 * k, '#FFFFFF', '', FONTS.ui);
  if (o.count) g += Tx(x + 72 * k, y + 23 * k, `◉ ${o.count}`, 15 * k, '#FFFFFF', `class="${o.countCls || ''}"`, FONTS.ui);
  if (o.title !== false) g += Tx(x + (o.count ? 150 : 74) * k, y + 23 * k, o.title || 'NIGHTMARE ON 63RD STREET (NOT CLICKBAIT)', 14 * k, '#FFFFFF', 'letter-spacing="0.5"', FONTS.ui);
  return g;
}

// The open-air walkway seen through the shopfront glass, Cafe 63 lit up across it.
// o: {cafe: {...cafe63 opts}, queue: null|'far'|'glass', prints, dark}
function pA_walkway(box, o = {}) {
  const [x, y, w, h] = box;
  const r = rng(o.seed || 'walk');
  let s = R(x, y, w, h, '#0E141B');
  // awning edge, rain beyond it, wet tiles
  const fy = y + h * 0.58;
  s += R(x, y, w, h * 0.12, '#151B23') + Ln(x, y + h * 0.12, x + w, y + h * 0.12, '#2A323C', 4);
  s += Po([[x, fy], [x + w, fy], [x + w, y + h], [x, y + h]], '#1A222B');
  for (let i = 0; i < 12; i++) s += Ln(x + w * 0.5 + (i - 6) * w * 0.04, fy, x + w * 0.5 + (i - 6) * w * 0.22, y + h, '#26303A', 1.5);
  for (let k = 1; k < 6; k++) { const yy = lerp(fy, y + h, Math.pow(k / 6, 1.7)); s += Ln(x, yy, x + w, yy, '#26303A', 1.3); }
  // Cafe 63, across the walkway
  const cb = [x + w * 0.2, y + h * 0.16, w * 0.6, h * 0.46];
  s += cafe63(cb, Object.assign({ lights: 4 }, o.cafe || {}));
  // light spilling out of the cafe onto the wet floor
  if (!o.cafe || o.cafe.lights !== 0) s += E(x + w * 0.5, fy + h * 0.08, w * 0.34, h * 0.06, '#F3D9A6', 'opacity=".12"');
  if (o.prints) {
    // wet footprints leading up to the glass
    for (let i = 0; i < 9; i++) {
      const t = i / 8, px = lerp(x + w * 0.5, x + w * 0.46, t) + (i % 2 ? 10 : -10) * (0.5 + t), py = lerp(fy + 8, y + h - 10, Math.pow(t, 1.3));
      const sc = 0.4 + t * 1.2;
      s += E(px, py, 7 * sc, 3.6 * sc, '#6E8DA6', 'opacity=".9"') + E(px + 1, py - 5.4 * sc, 4.4 * sc, 2.2 * sc, '#6E8DA6', 'opacity=".9"') + E(px - 1, py - 1, 4 * sc, 1.4 * sc, '#B7D0E2', 'opacity=".6"');
    }
  }
  if (o.queue === 'far') s += queueLine({ x0: x + w * 0.5, y0: y + h * 0.98, s0: h / 520, x1: x + w * 0.48, y1: fy + h * 0.02, s1: h / 2400, count: 9, ease: 1.6, seed: 'pAq7', fadeFar: 0.55 });
  s += rainFx([x, y + h * 0.12, w, fy - y - h * 0.12], { op: 0.5, op2: 0.35 });
  if (o.dark) s += R(x, y, w, h, C.ink, `opacity="${o.dark}"`);
  return s;
}

// Customers pressed right up against the glass: hands flat, faces smeared.
function pA_atGlass(box, o = {}) {
  const [x, y, w, h] = box;
  let s = '';
  const N = o.count || 4;
  for (let i = 0; i < N; i++) {
    const cx = x + w * (0.14 + (i / Math.max(1, N - 1)) * 0.72), sc = h / (o.k || 260);
    s += customer({ x: cx, y: y + h * 1.25, s: sc, kind: CUSTOMER_ORDER[(i + 1) % 8], seed: `pAg${i}`, ticket: true, faceOp: 0.95 });
    // palms pressed flat against the glass
    s += `<g opacity=".9">${E(cx - 40 * sc, y + h * 0.42, 15 * sc, 19 * sc, '#C8B4A2', st(C.ink, 2))}${E(cx + 42 * sc, y + h * 0.4, 15 * sc, 19 * sc, '#C8B4A2', st(C.ink, 2))}</g>`;
  }
  // fog on the glass where they breathe
  for (let i = 0; i < N; i++) s += E(x + w * (0.14 + (i / Math.max(1, N - 1)) * 0.72), y + h * 0.3, w * 0.06, h * 0.06, '#DCE6EE', 'opacity=".18"');
  return s;
}

// Shopfront glass frame drawn over a view.
function pA_glassFrame(box, o = {}) {
  const [x, y, w, h] = box;
  let s = glassDrops(box, o.seed || 'pAgl', o.drops || 34);
  s += Pa(`M${n(x)} ${n(y + h * 0.1)}L${n(x + w * 0.25)} ${n(y + h * 0.1)}L${n(x)} ${n(y + h * 0.5)}Z`, '#FFFFFF', 'opacity=".05"');
  (o.mullions || [0.33, 0.66]).forEach((t) => { s += R(x + w * t - 7, y, 14, h, '#16191E', st(C.ink, 2)); });
  return s;
}

// The kiosk's animated Ollie: waves faster each panel while Code Rot eats him. level 0..5
function pA_miniOllie(x, y, s, level) {
  const body = level >= 5 ? C.rot2 : level >= 3 ? '#C9A915' : C.y;
  const dur = [1.3, 0.95, 0.7, 0.5, 0.36, 0.26][level];
  const sx = x + 68 * s, sy = y - 196 * s;
  let g = `<g transform="translate(${n(x)} ${n(y)}) scale(${s})">`;
  g += Pa('M-18 -120 L-24 -6 M18 -120 L24 -6 M-68 -186 L-102 -150', 'none', st(C.ink, 8));
  g += Ci(0, -190, 72, body, st(C.ink, 6));
  if (level < 5) g += Pa('M-74 -214 C-50 -236 50 -236 74 -214 C60 -186 30 -176 0 -186 C-30 -176 -60 -186 -74 -214 Z', '#FFFFFF', st(C.ink, 5)) + E(-26, -206, 10, 13, C.ink) + E(26, -206, 10, 13, C.ink);
  else g += Pa('M-60 -210 C-30 -200 30 -224 64 -206 C40 -190 10 -180 -10 -190 Z', '#D8D2B0', 'opacity=".7"') + E(-20, -200, 12, 6, C.ink) + E(30, -208, 8, 12, C.ink);
  g += '</g>';
  g += `<g class="pA-wave" style="transform-origin:${n(sx)}px ${n(sy)}px;animation-duration:${dur}s"><g transform="translate(${n(x)} ${n(y)}) scale(${s})">${Pa('M68 -196 L100 -246', 'none', st(C.ink, 8))}${Ci(102, -250, 9, C.ink)}</g></g>`;
  if (level) g += rotPatch({ x: x + 40 * s, y: y - 120 * s, box: [x - 110 * s, y - 280 * s, 220 * s, 280 * s], reach: 70 * s * (1 + level), count: 10 + level * 14, size: 10 + level, seed: `pAko${level}`, grow: 0 });
  return g;
}

// The kiosk's screen content for a given rot level.
const pA_kioskScreen = (level) => (sx, sy, sw, sh) => {
  let g = R(sx, sy, sw, sh, level >= 4 ? '#C9D6C4' : '#DDF3FB');
  const msg = level >= 4 ? ['H▒! Pl░ase', 'ta▓e a t▒cket!'] : ['Hi! Please', 'take a ticket!'];
  g += textLines(msg, sx + sw / 2, sy + 17, 8.5, '#0E1A22', { font: FONTS.ui });
  const cid = uid('ks');
  g += `<clipPath id="${cid}"><rect x="${sx}" y="${sy}" width="${sw}" height="${sh}"/></clipPath><g clip-path="url(#${cid})">${pA_miniOllie(sx + sw / 2, sy + sh - 6, sh / 380, level)}</g>`;
  return g;
};

// A hand pressed flat against glass from the other side: pale pressure patches where skin meets glass.
// dir: 1 = right hand (thumb on our left), -1 = left hand
function pA_palm(x, y, s, dir = 1, col = '#BFA796') {
  const fingers = [[-25, -44, 66, -9, 8.5], [-8, -50, 78, -3, 9], [10, -49, 74, 3, 9], [27, -40, 58, 10, 8]];
  let g = '';
  fingers.forEach(([fx, fy, len, ang, w]) => {
    g += `<g transform="translate(${fx} ${fy}) rotate(${ang})">${R(-w, -len, w * 2, len + 8, col, `rx="${w}" ${st(C.ink, 2.4)}`)}` +
      `${E(0, -len + w + 2, w * 0.78, w * 1.05, '#F3E8E0', 'opacity=".9"')}${E(0, -len * 0.45, w * 0.6, w * 0.55, '#E9D9CE', 'opacity=".55"')}` +
      `${Pa(`M${-w * 0.6} ${-len * 0.62}h${w * 1.2}M${-w * 0.6} ${-len * 0.3}h${w * 1.2}`, 'none', st(shade(col, -0.3), 1))}</g>`;
  });
  g += `<g transform="translate(-34 4) rotate(-58)">${R(-9, -44, 18, 50, col, `rx="9" ${st(C.ink, 2.4)}`)}${E(0, -34, 7, 9, '#F3E8E0', 'opacity=".85"')}</g>`;
  g += Pa('M-36 -46 C-42 -6 -34 34 -4 44 C26 46 40 14 38 -42 Z', col, st(C.ink, 2.8));
  // pressure: the heel of the palm and the pads under the fingers flattened white against the glass
  g += E(-2, 26, 24, 14, '#F3E8E0', 'opacity=".9"') + E(-18, -34, 9, 6, '#EFE2D8', 'opacity=".8"') + E(2, -38, 9, 6, '#EFE2D8', 'opacity=".8"') + E(20, -34, 9, 6, '#EFE2D8', 'opacity=".8"');
  g += Pa('M-26 -10 Q-4 6 26 -16', 'none', st(shade(col, -0.35), 1.4)) + Pa('M-30 10 Q-10 0 6 -30', 'none', st(shade(col, -0.35), 1.2));
  return `<g transform="translate(${n(x)} ${n(y)}) scale(${n(s * dir)} ${n(s)})">${g}</g>`;
}

// Smudged trails on the glass below a pressed hand, where it has dragged.
function pA_smear(x, y, s, seed) {
  const r = rng(seed);
  let g = '';
  for (let i = 0; i < 4; i++) {
    const sx = x + (-26 + i * 17) * s + r.jit(4), sy = y - 40 * s, len = (90 + r() * 120) * s;
    g += `<path d="M${n(sx)} ${n(sy)}C${n(sx + r.jit(8))} ${n(sy + len * 0.4)} ${n(sx + r.jit(10))} ${n(sy + len * 0.7)} ${n(sx + r.jit(6))} ${n(sy + len)}" fill="none" stroke="#DCE8EF" stroke-width="${n((10 + r() * 6) * s)}" stroke-linecap="round" opacity=".14"/>`;
  }
  return g;
}

// Panel 4 of page 11, which contains a thumbnail of itself, three levels deep.
function pA_ogScene(box, depth, third) {
  const [x, y, w, h] = box;
  const k = w / 482;
  let g = R(x, y, w, h, '#151B22');
  // the laptop screen running The OG
  const L = [x + w * 0.17, y + h * 0.05, w * 0.66, h * 0.6];
  g += glow(L[0] + L[2] / 2, L[1] + L[3] / 2, L[2] * 0.8, L[3] * 0.8, 'gS', 0.3);
  g += R(L[0] - 6 * k, L[1] - 6 * k, L[2] + 12 * k, L[3] + 12 * k, '#2A2D33', `rx="${5 * k}"`) + R(L[0], L[1], L[2], L[3], '#F2EFE6');
  g += R(L[0], L[1], L[2], L[3] * 0.12, C.y) + (depth >= 2 ? Tx(L[0] + 8 * k, L[1] + L[3] * 0.09, 'The OG', L[3] * 0.08, C.ink, '', FONTS.ui) : '');
  const cols = 4, rows = 3, tw = (L[2] - 10 * k) / cols, th = (L[3] * 0.86) / rows;
  const titles = ['', '', 'GOD OF WARRANTY', 'OLLIE SWING', 'OLLIE KICK', 'QUEUE BUSTER', 'OLLIE GOLF', 'SIM DROP', 'STOCKY', 'OLLIE DASH', 'DATA DASH', 'OLLIE BALL'];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const idx = j * cols + i;
    if (idx === 1) continue;
    const tx = L[0] + 5 * k + i * tw, ty = L[1] + L[3] * 0.14 + j * th;
    const tb = idx === 0 ? [tx + 2 * k, ty + 2 * k, tw * 2 - 4 * k, th - 4 * k] : [tx + 2 * k, ty + 2 * k, tw - 4 * k, th - 4 * k];
    if (idx === 0) {
      // the tile nobody uploaded — the only one without Ollie — and its thumbnail is this panel
      g += R(tb[0] - 2.5 * k, tb[1] - 2.5 * k, tb[2] + 5 * k, tb[3] + 5 * k, C.laser);
      const tbox = [tb[0] + tb[2] * 0.14, tb[1], tb[2] * 0.72, tb[3] * 0.8];
      g += R(tb[0], tb[1], tb[2], tb[3], '#0B0E12');
      if (depth > 1) g += pA_ogScene(tbox, depth - 1, third);
      else g += R(tbox[0], tbox[1], tbox[2], tbox[3], '#151B22');
      if (third && depth === 3) g += readerFig({ x: tbox[0] + tbox[2] * 0.5, y: tbox[1] + tbox[3] * 1.05, s: tbox[3] / 700, device: 'phone' });
      g += R(tb[0], tb[1] + tb[3] * 0.8, tb[2], tb[3] * 0.2, C.ink) + (depth >= 2 ? Tx(tb[0] + tb[2] / 2, tb[1] + tb[3] * 0.96, 'SOS ONLY — NEW', tb[3] * 0.17, C.y, 'text-anchor="middle"', FONTS.ui) : '');
      continue;
    }
    const hue = ['#3D6FB0', '#4E7A5A', '#7A2E3A', '#2B4E7A', '#8A6A2A', '#5B3C88'][idx % 6];
    g += R(tb[0], tb[1], tb[2], tb[3], hue);
    if (depth >= 2) {
      const os = tb[3] / 420, ox = tb[0] + tb[2] / 2 + (idx % 3 - 1) * tb[2] * 0.2, oy = tb[1] + tb[3] * (0.72 - (idx % 2) * 0.12);
      g += `<g transform="translate(${n(ox)} ${n(oy)}) scale(${n(os)}) rotate(${(idx % 5 - 2) * 14})">${Ci(0, -190, 72, C.y, st(C.ink, 8))}${Pa('M-74 -214 C-50 -236 50 -236 74 -214 C60 -186 30 -176 0 -186 C-30 -176 -60 -186 -74 -214 Z', '#FFFFFF', st(C.ink, 6))}${E(-26, -206, 10, 13, C.ink)}${E(26, -206, 10, 13, C.ink)}${Pa('M-68 -186 L-110 -230 M68 -186 L110 -150 M-18 -120 L-40 -10 M18 -120 L40 -30', 'none', st(C.ink, 10))}</g>`;
      g += R(tb[0], tb[1] + tb[3] * 0.8, tb[2], tb[3] * 0.2, 'rgba(0,0,0,.55)') + Tx(tb[0] + tb[2] / 2, tb[1] + tb[3] * 0.95, titles[idx], tb[3] * 0.13, '#FFFFFF', 'text-anchor="middle"', FONTS.ui);
    }
  }
  // Chase and Chloe from behind, sitting on the counter
  const fs = h / 560;
  g += fig('chase', { x: x + w * 0.27, y: y + h * 1.3, s: fs * 1.15, view: 'back', light: 'none' });
  g += fig('chloe', { x: x + w * 0.73, y: y + h * 1.3, s: fs * 1.15, view: 'back', light: 'none' });
  g += R(x, y + h * 0.9, w, h * 0.1, '#2B2E35');
  return g;
}

// Code Rot crawling under the skin: vein lines and tiny letters, clipped to a patch of skin.
function pA_rotSkin(x, y, w, h, seed) {
  const r = rng(seed), cid = uid('rs');
  let veins = '', glyphs = '';
  for (let i = 0; i < 5; i++) {
    let px = x + r() * w, py = y + h, d = `M${n(px)} ${n(py)}`;
    for (let k = 0; k < 4; k++) { px += r.jit(w * 0.25); py -= h * (0.2 + r() * 0.2); d += `L${n(px)} ${n(py)}`; }
    veins += `<path d="${d}" fill="none" stroke="${C.rot2}" stroke-width="${n(Math.max(1, w * 0.02))}" opacity=".75"/>`;
  }
  const fs = Math.max(5, h * 0.2);
  for (let row = 0; row < 8; row++) {
    let line = '';
    for (let k = 0; k < Math.ceil(w / (fs * 0.55)); k++) line += r() < 0.55 ? r.pick(ROT_GLYPHS + 'abcdefghijklmnopqrstuvwxyz') : ' ';
    glyphs += `<text class="ft-m" x="${n(x)}" y="${n(y + row * fs * 0.9)}" font-size="${n(fs)}" fill="${row % 2 ? C.rot2 : C.rot}" opacity=".95">${esc(line)}</text>`;
  }
  return `<clipPath id="${cid}"><rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="${n(w * 0.2)}"/></clipPath><g clip-path="url(#${cid})" pointer-events="none">${veins}<g class="pA-crawl" style="--ch:${n(-fs * 3.6)}px">${glyphs}</g></g>`;
}

// Page-scoped CSS lives in a <style> inside the page's SVG, so it comes and goes with the page.
const pB_style = (css) => `<style>${css}</style>`;

// Code Rot reaching the panel edges and spilling into the gutters (pages 13–18).
function pB_gutRot(x, y, seed, o = {}) {
  const reach = o.reach || 90;
  return rotPatch(Object.assign({ x, y, reach, count: o.count || 34, size: o.size || 16, seed, grow: o.grow == null ? 9 : o.grow, delay: o.delay || 1.5, box: o.box || [x - reach, y - reach, reach * 2, reach * 2] }, o));
}

/* ---------- Page 14 — Call Yourself ---------- */

// A coiled phone cord along a quadratic curve from a to b (control c). k = coils, r = coil radius.
function pB_curly(a, c, b, o = {}) {
  const k = o.k || 22, r = o.r || 7, N = k * 10;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, u = 1 - t;
    const x = u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], y = u * u * a[1] + 2 * u * t * c[1] + t * t * b[1];
    const dx = 2 * u * (c[0] - a[0]) + 2 * t * (b[0] - c[0]), dy = 2 * u * (c[1] - a[1]) + 2 * t * (b[1] - c[1]);
    const L = Math.hypot(dx, dy) || 1, px = -dy / L, py = dx / L, ang = t * k * Math.PI * 2;
    pts.push([x + px * Math.sin(ang) * r + (dx / L) * Math.cos(ang) * r * 0.45, y + py * Math.sin(ang) * r + (dy / L) * Math.cos(ang) * r * 0.45]);
  }
  const d = pathOf(pts, false);
  return `<g${o.cls ? ` class="${o.cls}"` : ''}${o.style ? ` style="${o.style}"` : ''}><path d="${d}" fill="none" ${st(C.ink, (o.w || 3) + 3)}/><path d="${d}" fill="none" ${st(o.col || '#D9C9A3', o.w || 3)}/></g>`;
}

// The old beige backup landline. o: {s, handset:false (off the hook)}
function pB_landline(x, y, o = {}) {
  const s = o.s || 1;
  let g = Pa('M-70 0 L-58 -60 Q0 -74 58 -60 L70 0 Z', '#D9C9A3', st(C.ink, 3.5));
  g += R(-40, -54, 80, 18, '#3B4A3C', `rx="3" ${st(C.ink, 2)}`);
  for (let j = 0; j < 4; j++) for (let i = 0; i < 3; i++) g += R(-30 + i * 22, -32 + j * 8, 16, 6, '#EFE6CF', `rx="2" ${st(C.ink, 1.2)}`);
  if (o.handset !== false) g += Pa('M-80 -62 Q-84 -86 -60 -86 L60 -86 Q84 -86 80 -62 L64 -62 Q60 -74 40 -74 L-40 -74 Q-60 -74 -64 -62 Z', '#D9C9A3', st(C.ink, 3.5));
  else g += Pa('M-62 -62 L-56 -70 L56 -70 L62 -62 Z', '#BFAE88', st(C.ink, 2));
  return `<g transform="translate(${n(x)} ${n(y)}) scale(${s})">${g}</g>`;
}

// The handset on its own. ang in degrees.
function pB_handset(x, y, s = 1, ang = 0) {
  return `<g transform="translate(${n(x)} ${n(y)}) rotate(${ang}) scale(${s})">${Pa('M-14 -60 Q-26 -60 -24 -40 L-18 40 Q-16 58 -4 58 L8 58 Q18 56 16 42 L10 28 Q6 20 4 0 L6 -28 Q8 -44 14 -48 Q18 -60 -14 -60 Z', '#D9C9A3', st(C.ink, 3.5))}${E(-6, -46, 12, 9, '#BFAE88', st(C.ink, 1.6))}${E(-2, 46, 11, 8, '#BFAE88', st(C.ink, 1.6))}</g>`;
}

// A hand with too many knuckles, fingers far too long, gripping an edge.
function pB_wrongHand(x, y, s = 1, flip = false) {
  const skin = '#B8AE92';
  let g = '';
  const fingers = [[-30, 0.9], [-12, 1.0], [6, 1.05], [24, 0.85]];
  fingers.forEach(([fy, L], i) => {
    let px = 0, py = fy, a = -8 + i * 3, seg = '';
    for (let k = 0; k < 6; k++) {
      const len = 27 * L, nx = px + Math.cos(a * D2R) * len, ny = py + Math.sin(a * D2R) * len;
      seg += `<line x1="${n(px)}" y1="${n(py)}" x2="${n(nx)}" y2="${n(ny)}" stroke="${C.ink}" stroke-width="12" stroke-linecap="round"/><line x1="${n(px)}" y1="${n(py)}" x2="${n(nx)}" y2="${n(ny)}" stroke="${skin}" stroke-width="7" stroke-linecap="round"/>`;
      seg += E(nx, ny, 5.5, 4.6, shade(skin, -0.12), st(C.ink, 1.6));
      px = nx; py = ny; a += 7 + k * 5;
    }
    seg += Pa(`M${n(px)} ${n(py)}l${n(Math.cos(a * D2R) * 9)} ${n(Math.sin(a * D2R) * 9)}`, 'none', st('#2B2618', 5));
    g += seg;
  });
  g = Pa('M-40 -46 Q-10 -60 6 -40 L8 40 Q-10 56 -40 44 Z', skin, st(C.ink, 3)) + g;
  return `<g transform="translate(${n(x)} ${n(y)}) scale(${flip ? -s : s} ${s})">${g}</g>`;
}

const pB_NAMES = ['M. PATEL', 'D. HOANG', 'S. NGUYEN', 'J. SMITH', 'A. KOWALSKI', 'R. OKAFOR', 'T. BRENNAN', 'K. WILLIAMS', 'L. ROSSI', 'B. TAUFA', 'H. CHEN', 'P. MURPHY', 'E. SANTOS', 'G. KAUR', 'N. COOPER', 'F. AHMED', 'C. JONES', 'V. IVANOVA', 'O. MAHER', 'W. TAN', 'I. BAKER', 'Y. SATO', 'Q. LE', 'U. NOVAK', 'Z. HALL', 'R. SINGH', 'M. ROBERTS', 'S. KELLY', 'A. NGATA', 'D. PHAM'];

// A boxed handset labelled with a person's name. o: {sub, col, glow, warn}
function pB_nameBox(x, y, w, h, name, o = {}) {
  let g = R(x, y, w, h, o.col || '#E9E4D8', st(C.ink, 2.4));
  g += R(x, y + h * 0.36, w, h * 0.12, '#C9B98E', 'opacity=".7"');
  g += R(x + w * 0.05, y + h * 0.5, w * 0.9, h * 0.44, o.warn ? '#FFF3A8' : '#FFFFFF', st(C.ink, 1.4));
  const fs = Math.min(h * 0.22, (w * 1.75) / Math.max(7, name.length));
  g += Tx(x + w / 2, y + h * 0.7, name, fs, C.ink, 'text-anchor="middle"', FONTS.mono);
  g += Tx(x + w / 2, y + h * 0.88, o.sub || '1 UNIT', Math.min(h * 0.14, (w * 1.75) / Math.max(7, (o.sub || '1 UNIT').length)), o.warn ? '#8A1520' : '#444', 'text-anchor="middle"', FONTS.mono);
  if (o.glow) g += R(x + 4, y + 4, w - 8, h * 0.3, C.screen, `opacity="${o.glow}"`);
  return g;
}

// One-point projection for the impossible stockroom. World: X across, Y down (floor at +1100), z into the page.
const pB_VP = [520, 600], pB_F = 500;
const pB_pj = (X, Y, z) => [pB_VP[0] + (X * pB_F) / z, pB_VP[1] + (Y * pB_F) / z];
const pB_q = (pts) => 'M' + pts.map((p) => `${n(p[0])} ${n(p[1])}`).join('L') + 'Z';

// The endless shelving: thousands of boxes, each glowing faintly from the phone inside.
function pB_aisle(seed, o = {}) {
  const r = rng(seed);
  const FLOOR = 1100, TOP = -700, ROW = 90;
  let faces = '', glows = ['', '', '', '', ''], planks = '', ups = '', far = '';
  for (const side of [-1, 1]) {
    const X = side * 600;
    for (let Y = TOP; Y < FLOOR; Y += ROW) {
      const Yb = Y + ROW - 14;
      for (let z = 330; z < 2700; z += 72) {
        const z2 = z + 62;
        faces += pB_q([pB_pj(X, Y, z), pB_pj(X, Y, z2), pB_pj(X, Yb, z2), pB_pj(X, Yb, z)]);
        if (r() < 0.7) {
          const k = Math.floor(r() * 5);
          const g1 = Y + (Yb - Y) * 0.3, g2 = Y + (Yb - Y) * 0.72;
          glows[k] += pB_q([pB_pj(X, g1, z + 12), pB_pj(X, g1, z2 - 12), pB_pj(X, g2, z2 - 12), pB_pj(X, g2, z + 12)]);
        }
      }
      // plank under each row, all the way to the vanishing point
      const a = pB_pj(X, Y + ROW - 7, 330), b = pB_pj(X, Y + ROW - 7, 60000);
      planks += `M${n(a[0])} ${n(a[1])}L${n(b[0])} ${n(b[1])}`;
    }
    for (let z = 400; z < 9000; z *= 1.22) { const a = pB_pj(X, TOP, z), b = pB_pj(X, FLOOR, z); ups += `M${n(a[0])} ${n(a[1])}L${n(b[0])} ${n(b[1])}`; }
    // beyond the boxes we can draw: a dusting of glows into the dark
    for (let i = 0; i < 260; i++) {
      const z = 2700 * Math.pow(25, r()), Y = TOP + r() * (FLOOR - TOP), p = pB_pj(X, Y, z), sz = Math.max(0.8, 2400 / z);
      far += `M${n(p[0])} ${n(p[1])}h${n(sz)}v${n(sz * 0.8)}h${n(-sz)}Z`;
    }
  }
  let s = '';
  // floor
  const fl = [pB_pj(-600, FLOOR, 300), pB_pj(600, FLOOR, 300), pB_pj(600, FLOOR, 60000), pB_pj(-600, FLOOR, 60000)];
  s += Po(fl, '#0E1013');
  for (const X of [-470, 470]) { const a = pB_pj(X, FLOOR, 300), b = pB_pj(X, FLOOR, 60000); s += Ln(a[0], a[1], b[0], b[1], '#6B5A12', 4, 'stroke-dasharray="40 30" opacity=".6"'); }
  // the walls of shelving
  for (const side of [-1, 1]) {
    const X = side * 600;
    s += Po([pB_pj(X, TOP, 300), pB_pj(X, TOP, 60000), pB_pj(X, FLOOR, 60000), pB_pj(X, FLOOR, 300)], '#121417');
  }
  s += `<path d="${faces}" fill="#2A2A2C" stroke="#08090A" stroke-width="1"/>`;
  const gop = [0.18, 0.3, 0.45, 0.65, 0.85];
  glows.forEach((d, k) => { s += `<path d="${d}" fill="${k > 2 ? '#BFEFFF' : C.screen}" opacity="${gop[k]}"${k === 2 ? ' class="fx-glow" style="animation-duration:3.7s"' : k === 4 ? ' class="fx-glow" style="animation-duration:2.9s;animation-delay:-1.3s"' : ''}/>`; });
  s += `<path d="${planks}" fill="none" stroke="#565B63" stroke-width="2.4"/><path d="${ups}" fill="none" stroke="#3E434B" stroke-width="3"/>`;

// A bottle of Optus Water Solutions, full of black, cloudy bay water. Something small turns over inside.
function pB_bottle(x, y, s = 1, ang = 0) {
  let g = Pa('M-16 -70 L-16 -84 L16 -84 L16 -70 Q30 -60 30 -40 L30 66 Q30 76 20 76 L-20 76 Q-30 76 -30 66 L-30 -40 Q-30 -60 -16 -70 Z', '#DCEBF2', st(C.ink, 3));
  g += Pa('M-26 -30 L26 -30 L26 64 Q26 72 18 72 L-18 72 Q-26 72 -26 64 Z', '#0E1416');
  g += E(0, 10, 22, 30, '#26343A', 'opacity=".7"') + E(-8, 34, 10, 14, '#3A4A44', 'opacity=".5"');
  g += `<g class="pB17-spin">${Pa('M-4 -6 q8 -4 10 4 q2 8 -6 10 q-6 0 -4 -6', 'none', st('#C9C1A8', 2.6))}${Ci(5, -3, 1.6, '#C9C1A8')}</g>`;
  g += R(-30, 0, 60, 26, '#FFFFFF', 'opacity=".9"') + Tx(0, 11, 'OPTUS WATER', 8, C.ink, 'text-anchor="middle"', FONTS.ui) + Tx(0, 21, 'SOLUTIONS', 8, C.ink, 'text-anchor="middle"', FONTS.ui);
  g += R(-17, -96, 34, 14, '#2F6E9C', `rx="3" ${st(C.ink, 2)}`) + Ln(-20, -40, -20, 60, '#FFFFFF', 3, 'opacity=".45"');
  return `<g transform="translate(${n(x)} ${n(y)}) rotate(${ang}) scale(${s})">${g}</g>`;
}

// A charging cable from a to b that pulses yellow in a travelling wave.
function pB_cable(a, b, sag, i, o = {}) {
  const c1 = [lerp(a[0], b[0], 0.3), lerp(a[1], b[1], 0.3) + sag], c2 = [lerp(a[0], b[0], 0.7), lerp(a[1], b[1], 0.7) + sag * 0.6];
  const d = `M${n(a[0])} ${n(a[1])}C${n(c1[0])} ${n(c1[1])} ${n(c2[0])} ${n(c2[1])} ${n(b[0])} ${n(b[1])}`;
  const w = o.w || 6;
  let s = `<path d="${d}" fill="none" ${st(C.ink, w + 4)}/><path d="${d}" fill="none" ${st('#5A4A00', w)}/>`;
  const N = o.beads || 12;
  for (let k = 1; k < N; k++) {
    const t = k / N, u = 1 - t;
    const x = u * u * u * a[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * b[0];
    const y = u * u * u * a[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * b[1];
    s += `<circle class="pB17-p" cx="${n(x)}" cy="${n(y)}" r="${n(w * 0.55)}" fill="${C.y}" style="animation-delay:${n(-(N - k) * 0.11 - i * 0.37)}s"/>`;
  }
  return s;
}

// Jarrad as the Top Seller: a black shape rim-lit by his own cables, the leaderboard grin stretched too wide,
// eyes that don't smile. o.fig: fig() options; sx/sy stretch him (too tall); k: how much closer he is.
function pB_monster(o) {
  const f = Object.assign({ pose: 'stand' }, o.fig), out = {};
  const c = CAST.jarrad, s = (f.s || 1) * c.h, fl = f.flip ? -1 : 1;
  const view = f.view || 'side', HC = view === 'side' ? [2, -318] : [0, -318];
  const lean = f.lean != null ? f.lean : (POSES[f.pose] || {}).lean || 0, tilt = f.tilt || 0;
  const sy = o.sy || 1.15, sx = o.sx || 0.88, fx = f.x, fy = f.y;
  const body = fig('jarrad', Object.assign({ sil: true, rim: 'yellow', rimDx: -5, props: ['lanyard'], out }, f));
  const face = `<g transform="translate(${n(fx)} ${n(fy)}) scale(${n(s * fl * 1000) / 1000} ${n(s * 1000) / 1000}) rotate(${lean} 0 -150) rotate(${tilt} ${HC[0]} -296) translate(${HC[0]} ${HC[1]})">${faceParts(view, 'dead', { look: f.look || [0, 0] }, c)}</g>`;
  const T = (p) => [fx + (p[0] - fx) * sx, fy + (p[1] - fy) * sy];
  const g = `<g class="pB17-j" style="transform-box:fill-box;transform-origin:50% 100%;transform:scale(${o.k || 1})"><g transform="translate(${n(fx)} ${n(fy)}) scale(${sx} ${sy}) translate(${n(-fx)} ${n(-fy)})">${body}${face}</g></g>`;
  return { g, head: T(out.head), nh: T(out.nh), fh: T(out.fh), mouth: T(out.mouth), s: out.scale, back: (dy) => T([fx - fl * 22 * out.scale, out.head[1] + dy * out.scale]) };
}

// Shelving drawn onto a receding wall quad (for storeInterior's left/right walls).
function pB_wallShelves(q, seed) {
  const r = rng(seed);
  let g = '';
  for (let j = 0; j < 4; j++) {
    const v1 = 0.22 + j * 0.19;
    g += Po(quadAt(q, 0.02, 0.98, v1 + 0.15, v1 + 0.165), '#8A8F96', st(C.ink, 1.2));
    for (let i = 0; i < 9; i++) {
      if (r() < 0.15) continue;
      const u0 = persp(0.03 + i * 0.105), u1 = persp(0.03 + i * 0.105 + 0.085);
      g += Po(quadAt(q, u0, u1, v1 + 0.04 + r() * 0.03, v1 + 0.15), r() < 0.5 ? '#EEEAE0' : '#DDD6C6', st(C.ink, 1.2));
    }
  }
  return g;
}

// Waveform lane: one path of bars. amp(t) gives the envelope.
function pB_wave(x, y, w, h, seed, col) {
  const r = rng(seed);
  let d = '';
  for (let i = 0; i < w; i += 4) {
    const a = (0.25 + 0.75 * Math.abs(Math.sin(i * 0.031 + r() * 0.4))) * (0.4 + r() * 0.6) * h * 0.46;
    d += `M${n(x + i)} ${n(y + h / 2 - a)}v${n(a * 2)}`;
  }
  return `<path d="${d}" stroke="${col}" stroke-width="2.4" fill="none"/>`;
}

// Faint counting voices filling a panel.
function pB_counting(box, seed, op = 0.5) {
  const r = rng(seed), [x, y, w, h] = box;
  const words = ['one', 'two', 'three', 'four', '…forty-one', 'forty-two', '4,012', '4,013', 'seven', 'six', 'five', '3,998', 'nine', 'eleven', '…twelve', 'one', 'two', 'three'];
  let s = '';
  for (let i = 0; i < 46; i++) {
    const t = r.pick(words), sz = 12 + r() * 16;
    s += `<text class="ft-s" x="${n(x + r() * w)}" y="${n(y + r() * h)}" font-size="${n(sz)}" fill="#BFC8D0" opacity="${n(op * (0.25 + r() * 0.75))}" transform="rotate(${n(r.jit(12))} ${n(x + w / 2)} ${n(y + h / 2)}) scale(-1 1) translate(${n(-2 * (x + w / 2))} 0)">${esc(t.toUpperCase())}</text>`;
  }
  return s;
}

// The impossible stockroom aisle in one-point perspective: shelving to a vanishing point, every box glowing faintly.
function pC_aisle(box, o = {}) {
  const [x, y, w, h] = box;
  const vx = x + w * (o.vx == null ? 0.5 : o.vx), vy = y + h * (o.vy == null ? 0.42 : o.vy);
  const r = rng(o.seed || 'pCaisle');
  let s = R(x - 6, y - 6, w + 12, h + 12, '#07080A');
  s += Po([[x - 6, y + h + 6], [x + w + 6, y + h + 6], [vx + 5, vy + 3], [vx - 5, vy + 3]], '#0F1115');
  for (let k = 1; k < 12; k++) {
    const t = persp(k / 12, 10), yy = lerp(y + h + 6, vy + 3, t);
    s += Ln(lerp(x - 6, vx - 5, t), yy, lerp(x + w + 6, vx + 5, t), yy, '#1A1E25', 1.2);
  }
  const K = 16, levels = 5;
  for (const side of [-1, 1]) {
    const nearX = side < 0 ? x - 10 : x + w + 10;
    const xs = [], tops = [], bots = [];
    for (let k = 0; k <= K; k++) {
      const t = persp(k / K, 11);
      xs.push(lerp(nearX, vx + side * 6, t));
      tops.push(lerp(y - 40, vy - 4, t));
      bots.push(lerp(y + h * 0.94, vy + 4, t));
    }
    for (let k = 0; k < K; k++) {
      for (let j = 0; j < levels; j++) {
        const v0 = j / levels + 0.02, v1 = (j + 1) / levels - 0.03;
        const q = [[xs[k], lerp(tops[k], bots[k], v0)], [xs[k + 1], lerp(tops[k + 1], bots[k + 1], v0)], [xs[k + 1], lerp(tops[k + 1], bots[k + 1], v1)], [xs[k], lerp(tops[k], bots[k], v1)]];
        const g = r();
        s += Po(q, '#161C24');
        if (g < 0.8) {
          const c = [(q[0][0] + q[2][0]) / 2, (q[0][1] + q[2][1]) / 2];
          const hw = Math.abs(q[1][0] - q[0][0]) * 0.32, hh = Math.abs(q[3][1] - q[0][1]) * 0.28;
          s += R(c[0] - hw, c[1] - hh, hw * 2, hh * 2, o.glowCol || C.screen, `opacity="${n(0.15 + g * 0.5)}"${g < 0.1 && o.still !== true ? ' class="pC-sflick"' : ''}`);
        }
      }
      s += Ln(xs[k], tops[k], xs[k], bots[k], '#2A313B', lerp(7, 0.6, k / K));
    }
  }
  s += R(x - 6, y - 6, w + 12, (vy - y) * 0.8, 'url(#gFadeUp)', 'opacity=".95"');
  s += glow(vx, vy, w * 0.18, h * 0.08, o.vglow || 'gY', 0.35);
  return s;
}

}

// One screen of the promo wall with Rue on it: suit, desk, briefcase, scan lines and compression blocks.
// o: {view, flip, face, look, out, delay, rec, lower, bob, fig (override markup), seed}
function pC_rueFig(x, y, w, h, o = {}) {
  const sc = h / (o.frame || 150);
  return fig('rue', { x: x + w * (o.fx || 0.42), y: y + h * 0.42 + 318 * sc, s: sc, view: o.view || 'front', flip: o.flip, face: o.face || 'smile', light: 'front', so: 0.3, look: o.look, out: o.out, pose: o.pose || 'stand' });
}

function pC_rueScreen(x, y, w, h, o = {}) {
  const cid = uid('pCrs');
  const r = rng(o.seed || `pCrs${x},${y}`);
  const sc = h / 200;
  let inner = R(x, y, w, h, '#14263B') + R(x, y, w, h, 'url(#htN)', 'opacity=".55"');
  inner += glow(x + w * 0.42, y + h * 0.38, w * 0.4, h * 0.5, 'gW', 0.12);
  inner += Pa(`M${n(x + w * 0.72)} ${n(y)}L${n(x + w * 0.9)} ${n(y)}L${n(x + w * 0.62)} ${n(y + h)}L${n(x + w * 0.44)} ${n(y + h)}Z`, C.y, 'opacity=".12"');
  const figs = o.figs || pC_rueFig(x, y, w, h, o);
  inner += `<g class="${o.bob === false ? '' : 'pC-bob'}" style="animation-delay:${n(o.delay || 0)}s">${figs}</g>`;
  // the desk and the briefcase on it
  inner += R(x, y + h * 0.8, w, h * 0.2, '#3A2A1C') + R(x, y + h * 0.8, w, h * 0.025, '#5A4430');
  inner += `<g transform="translate(${n(x + w * 0.78)} ${n(y + h * 0.8)}) scale(${n(sc)})">${R(-34, -40, 68, 40, '#4A2E1A', `rx="4" ${st(C.ink, 2)}`)}${Pa('M-12 -40v-8h24v8', 'none', st(C.ink, 3))}${R(-4, -26, 8, 6, '#C9A44A')}</g>`;
  if (o.lower) inner += R(x, y + h * 0.66, w * 0.5, h * 0.11, C.y) + Tx(x + w * 0.03, y + h * 0.745, 'RUE · CEO', h * 0.07, C.ink, 'letter-spacing="1"', FONTS.ui);
  if (o.rec) inner += Ci(x + w * 0.05, y + h * 0.08, h * 0.028, '#E8322F', 'class="fx-blink"') + Tx(x + w * 0.09, y + h * 0.105, 'RECORDED 14·03·1987', h * 0.07, '#F2F2F2', '', FONTS.mono);
  inner += R(x, y, w, h, 'url(#scan)', 'opacity=".3"');
  for (let i = 0; i < (o.blocks == null ? 3 : o.blocks); i++) inner += R(x + r() * w * 0.85, y + h * (0.25 + r() * 0.6), w * (0.06 + r() * 0.1), h * (0.05 + r() * 0.08), r.pick(['#3A5A7A', '#7A6A2A', '#2A3A4A', '#C9A88A']), `class="pC-blk" style="animation-delay:${n(-r() * 2)}s"`);
  let s = glow(x + w / 2, y + h / 2, w * 0.75, h * 0.85, 'gS', o.halo == null ? 0.18 : o.halo);
  s += R(x - 7, y - 7, w + 14, h + 14, '#111215', `rx="4" ${st(C.ink, 3)}`);
  s += `<clipPath id="${cid}"><rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}"/></clipPath><g clip-path="url(#${cid})">${inner}</g>`;
  return s;
}

/* ---------- Page 24 — Now Serving 06 ---------- */

// Code Rot back in the gutters, worse than before.
function pC_gutterRot(spots, seed, grow = 10) {
  return spots.map(([x, y, reach, count], i) => rotPatch({ x, y, reach, count: count || 40, size: 14, seed: `${seed}${i}`, grow, delay: i * 0.6, box: [x - reach, y - reach, reach * 2, reach * 2] })).join('');
}

// A hand holding a phone up close, the hoodie sleeve pulled over the wrist.
function pC_handPhone(x, y, s, screen) {
  const skin = '#EEC7A6';
  let g = '';
  g += Pa('M-120 300 C-110 210 -96 170 -70 150 L80 150 C104 176 116 230 120 300 Z', '#6B7076', st(C.ink, 5));
  g += Pa('M-92 40 C-112 120 -92 176 -40 186 L60 186 C100 170 112 120 96 40 Z', skin, st(C.ink, 4));
  g += phoneObj(-78, -200, 156, 300, { lit: true, screen: '#F4F6F8', halo: false, content: screen });
  [-20, 30, 78].forEach((fy) => { g += R(-96, fy, 34, 30, skin, `rx="15" ${st(C.ink, 3.2)}`); });
  g += `<g transform="translate(80 40) rotate(-28)">${R(-16, -64, 32, 80, skin, `rx="16" ${st(C.ink, 3.2)}`)}</g>`;
  return `<g transform="translate(${n(x)} ${n(y)}) scale(${s})">${g}</g>`;
}

// A queue TV laid out for a name and a line of small print.
function pC_tvBig(x, y, w, h, num, name, sub) {
  let s = Ln(x + w * 0.3, y - 40, x + w * 0.3, y, '#333', 4) + Ln(x + w * 0.7, y - 40, x + w * 0.7, y, '#333', 4);
  s += glow(x + w / 2, y + h / 2, w * 0.9, h * 0.9, 'gY', 0.35);
  s += R(x - 6, y - 6, w + 12, h + 12, '#16171B', `rx="6" ${st(C.ink, 3)}`) + R(x, y, w, h, 'url(#gTVY)', 'rx="2" class="lit"');
  s += Tx(x + w / 2, y + h * 0.17, 'NOW SERVING', h * 0.11, C.ink, 'text-anchor="middle" letter-spacing="2"', FONTS.ui);
  s += Tx(x + w / 2, y + h * 0.56, num, h * 0.4, C.ink, 'text-anchor="middle"', FONTS.mono);
  if (name) s += Tx(x + w / 2, y + h * 0.75, name, h * 0.13, C.ink, 'text-anchor="middle" letter-spacing="3"', FONTS.ui);
  if (sub) s += Tx(x + w / 2, y + h * 0.9, sub, h * 0.075, '#4A3A00', 'text-anchor="middle" letter-spacing="1"', FONTS.ui);
  return s;
}

// Warm colours from page 23, draining from the edges inward.
function pC_drain() {
  return `<g class="pC-drain" pointer-events="none"><ellipse cx="500" cy="760" rx="600" ry="900" fill="url(#gWarm)" opacity=".85"/><ellipse cx="500" cy="760" rx="420" ry="640" fill="#F6B6A6" opacity=".35"/></g>`;
}

// A demo phone with someone pressed against the glass from the inside.
function pC_faceInPhone(x, y, w, h, who) {
  const cid = uid('pCfp');
  const sc = h / 150;
  let inner = R(x, y, w, h, '#0E1A22');
  inner += fig(who, { x: x + w / 2, y: y + h * 0.46 + 318 * sc * CAST[who].h, s: sc, view: 'front', face: ['wide', 'worried', 'scream'], light: 'none', props: [] });
  inner += E(x + w * 0.12, y + h * 0.66, w * 0.17, h * 0.13, '#E8D2C0', `opacity=".9" ${st(C.ink, 1.2)}`) + E(x + w * 0.88, y + h * 0.64, w * 0.17, h * 0.13, '#E8D2C0', `opacity=".9" ${st(C.ink, 1.2)}`);
  inner += R(x, y, w, h, C.screen, 'opacity=".22"') + E(x + w / 2, y + h * 0.82, w * 0.4, h * 0.08, '#FFFFFF', 'opacity=".25"');
  let s = R(x - w * 0.08, y - h * 0.06, w * 1.16, h * 1.12, '#141518', `rx="${w * 0.14}" ${st(C.ink, 2)}`);
  s += `<clipPath id="${cid}"><rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="${n(w * 0.08)}"/></clipPath><g clip-path="url(#${cid})" class="lit">${inner}</g>`;
  s += glow(x + w / 2, y + h / 2, w * 1.3, h * 0.9, 'gS', 0.3);
  return s;
}

// The queue behind the reader curves away into the dark like the jetty into the bay.
const pC_QPTS = [[640, 1000], [800, 800], [760, 610], [600, 500], [420, 452], [270, 430], [160, 424]];
const pC_QN = 16;
function pC_qPos(t) {
  const segs = [];
  let total = 0;
  for (let i = 1; i < pC_QPTS.length; i++) { const l = Math.hypot(pC_QPTS[i][0] - pC_QPTS[i - 1][0], pC_QPTS[i][1] - pC_QPTS[i - 1][1]); segs.push(l); total += l; }
  let d = clamp(t, 0, 1) * total, i = 0;
  while (i < segs.length - 1 && d > segs[i]) { d -= segs[i]; i++; }
  const k = segs[i] ? d / segs[i] : 0;
  const a = pC_QPTS[i], b = pC_QPTS[i + 1];
  return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(0.9, 0.05, Math.pow(t, 0.55))];
}
const pC_qSlot = (k) => pC_qPos((k + 1) / (pC_QN + 1));
const pC_qTf = (p) => `transform:translate(${n(p[0])}px,${n(p[1])}px) scale(${n(p[2] * 1000) / 1000})`;

// One of the others in the queue: a silhouette lit from below by its own screen.
function pC_qFig(i) {
  const grads = ['gS', 'gW', 'gWarm', 'gS', 'gW'], cols = [C.screen, '#F4F8FF', '#FFD9A0', '#B8F0C8', '#E8E8FF'];
  const g = grads[i % grads.length], col = cols[i % cols.length];
  return glow(0, -200, 90, 110, g, 0.5) + Pa('M-50 -232 C-56 -170 -54 -90 -44 0 L44 0 C54 -90 56 -170 50 -232 C32 -252 -32 -252 -50 -232 Z', C.ink) +

}

/* ---- 70-audio.js ---- */
/* SOS ONLY — sound and haptics. Everything is synthesised with Web Audio: no audio files.
   Off by default; starts only after a tap. */

const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);

const Sound = {
  ac: null, master: null, beds: {}, on: false, spec: {}, noise: null,

  setEnabled(v) {
    this.on = !!v;
    if (!this.on) { Object.keys(this.beds).forEach((k) => this.stopBed(k)); return; }
    this.unlock();
    this.bed(this.spec);
  },

  // Create/resume the context. Must run inside a user gesture the first time.
  unlock() {
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.75;
      this.master.connect(this.ac.destination);
      const len = this.ac.sampleRate * 2;
      this.noise = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ac.state === 'suspended') this.ac.resume();
  },

  suspend(h) {
    if (!this.ac) return;
    if (h) this.ac.suspend(); else if (this.on) this.ac.resume();
  },

  now() { return this.ac.currentTime; },

  gain(v, to) { const g = this.ac.createGain(); g.gain.value = v; if (to) g.connect(to); return g; },

  osc(type, f, to) { const o = this.ac.createOscillator(); o.type = type; o.frequency.value = f; if (to) o.connect(to); return o; },

  noiseSrc(to) { const s = this.ac.createBufferSource(); s.buffer = this.noise; s.loop = true; if (to) s.connect(to); return s; },

  filt(type, f, q, to) { const b = this.ac.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; if (to) b.connect(to); return b; },

  // telephone band: 300–3,400 Hz, so the music always sounds like hold music
  phoneBand(to) { const lo = this.filt('lowpass', 3400, 0.7, to); return this.filt('highpass', 300, 0.7, lo); },

  env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },

  tone(f, t, dur, o = {}) {
    const g = this.gain(0.0001, o.to || this.master);
    const s = this.osc(o.type || 'sine', f, g);
    this.env(g, t, o.a || 0.01, o.v || 0.2, dur);
    s.start(t); s.stop(t + (o.a || 0.01) + dur + 0.05);
    return s;
  },

  /* ---- beds: long-running ambiences, crossfaded on and off ---- */

  bed(spec) {
    this.spec = spec || {};
    if (!this.on || !this.ac) return;
    for (const k of ['hum', 'rain', 'hold', 'store', 'birds', 'waves', 'voice']) {
      if (this.spec[k] && !this.beds[k]) this.startBed(k);
      if (!this.spec[k] && this.beds[k]) this.stopBed(k);
    }
  },

  startBed(k) {
    const out = this.gain(0.0001, this.master), t = this.now();
    const vol = { hum: 0.05, rain: 0.16, hold: 0.22, store: 0.16, birds: 0.12, waves: 0.18, voice: 1 }[k];
    out.gain.exponentialRampToValueAtTime(vol, t + 0.8);
    const bed = { out, nodes: [], timer: 0 };
    if (k === 'hum') {
      [[50, 1], [100, 0.5], [150, 0.18]].forEach(([f, v]) => { const g = this.gain(v, out); const o = this.osc('sine', f, g); o.start(); bed.nodes.push(o); });
    } else if (k === 'rain') {
      const hp = this.filt('highpass', 400, 0.5, out), lp = this.filt('lowpass', 2600, 0.5, hp);
      const s = this.noiseSrc(lp); s.start(); bed.nodes.push(s);
    } else if (k === 'waves') {
      const lp = this.filt('lowpass', 500, 0.6, out);
      const g = this.gain(0.5, lp), s = this.noiseSrc(g);
      const lfo = this.osc('sine', 0.12), lg = this.gain(0.45); lfo.connect(lg); lg.connect(g.gain);
      s.start(); lfo.start(); bed.nodes.push(s, lfo);
    } else if (k === 'birds') {
      const chirp = () => {
        const t0 = this.now() + 0.05, n2 = 2 + Math.floor(Math.random() * 3), base = 2400 + Math.random() * 1600;
        for (let i = 0; i < n2; i++) {
          const g = this.gain(0.0001, out), o = this.osc('sine', base, g), tt = t0 + i * 0.12;
          o.frequency.setValueAtTime(base, tt); o.frequency.exponentialRampToValueAtTime(base * 1.5, tt + 0.07);
          this.env(g, tt, 0.01, 0.5, 0.08); o.start(tt); o.stop(tt + 0.12);
        }
        bed.timer = setTimeout(chirp, 700 + Math.random() * 2200);
      };
      chirp();
    } else if (k === 'hold') this.holdMusic(bed, this.phoneBand(out));
    else if (k === 'store') this.storeRiff(bed, out);
    else if (k === 'voice') this.choppedVoice(bed);
    this.beds[k] = bed;
  },

  stopBed(k, fast) {
    const b = this.beds[k];
    if (!b) return;
    delete this.beds[k];
    clearTimeout(b.timer); clearInterval(b.timer);
    if (b.stop) b.stop();
    const t = this.now();
    b.out.gain.cancelScheduledValues(t);
    b.out.gain.setValueAtTime(b.out.gain.value, t);
    b.out.gain.exponentialRampToValueAtTime(0.0001, t + (fast ? 0.03 : 0.6));
    setTimeout(() => { b.nodes.forEach((x) => { try { x.stop(); } catch (e) { /* already stopped */ } }); b.out.disconnect(); }, fast ? 100 : 800);
  },

  // Chase's track: an original eight-bar minor loop.
  holdMusic(bed, out) {
    const bpm = 86, beat = 60 / bpm;
    const chords = [[57, 60, 64], [57, 60, 64], [53, 57, 60], [53, 57, 60], [52, 55, 60], [55, 59, 62], [50, 53, 57], [52, 56, 59]];
    const mel = [69, 72, 76, 74, 72, 71, 69, 64, 65, 69, 72, 69, 65, 64, 65, 69, 67, 72, 76, 72, 74, 71, 67, 71, 69, 65, 62, 65, 64, 68, 71, 76];
    let step = 0, next = this.now() + 0.1;
    const sched = () => {
      while (next < this.now() + 0.3) {
        const bar = Math.floor(step / 8) % 8, e = step % 8, ch = chords[bar];
        // arpeggio in eighths
        this.tone(midi(ch[e % 3] + 12), next, beat * 0.45, { type: 'square', v: 0.05, to: out });
        // bass on 1 and 3
        if (e === 0 || e === 4) this.tone(midi(ch[0] - 12), next, beat * 1.6, { type: 'triangle', v: 0.22, to: out });
        // melody on the beat
        if (e % 2 === 0) this.tone(midi(mel[(bar * 4 + e / 2) % mel.length]), next, beat * 0.9, { type: 'triangle', v: 0.16, a: 0.02, to: out });
        next += beat / 2;
        step++;
      }
    };
    sched();
    bed.timer = setInterval(sched, 60);
  },

  // A generic synthesised rock riff for the in-store music. Never a real recording.
  storeRiff(bed, out) {
    const bpm = 124, e8 = 60 / bpm / 2;
    const shaper = this.ac.createWaveShaper();
    const curve = new Float32Array(512);
    for (let i = 0; i < 512; i++) { const x = i / 256 - 1; curve[i] = Math.tanh(x * 4); }
    shaper.curve = curve; shaper.connect(out);
    const riff = [40, 40, 43, 40, 45, 40, 43, 38];
    let step = 0, next = this.now() + 0.05;
    const sched = () => {
      while (next < this.now() + 0.3) {
        const r = riff[step % 8];
        [0, 7, 12].forEach((iv) => this.tone(midi(r + iv), next, e8 * 0.8, { type: 'sawtooth', v: 0.08, to: shaper }));
        if (step % 4 === 0) this.kick(next, out);
        if (step % 4 === 2) this.snare(next, out);
        next += e8; step++;
      }
    };
    sched();
    bed.timer = setInterval(sched, 60);
  },

  kick(t, out) {
    const g = this.gain(0.0001, out), o = this.osc('sine', 120, g);
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.15);
    this.env(g, t, 0.005, 0.9, 0.2); o.start(t); o.stop(t + 0.3);
  },

  snare(t, out) {

/* ---------- haptics (Android; silently nothing elsewhere) ---------- */

const HAPTIC = {
  ring: [320, 180, 320], heartbeat: [70, 140, 100], thump: [90, 120, 90], stutter: [30, 40, 30, 40, 30, 40, 30],
  bell: [28], tap: [18],

/* ---- 80-reader.js ---- */
/* SOS ONLY — the reader: layout modes, mounting, guided view, controls, UI chrome, triggers. */

const LAST = 27; // 0 = check-in, 1..26 = story pages, 27 = end screen
const leafKind = (i) => (i === 0 ? 'checkin' : i === LAST ? 'end' : 'page');
const GUTTER = { white: C.paper, grey: C.gutterGrey, black: C.ink, warm: '#FFF4E0', whitegrey: 'url(#gGutWG)', greyblack: 'url(#gGutGB)' };
const OG_URL = '../';

const Bus = {
  h: {},
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); },
  off(e, f) { this.h[e] = (this.h[e] || []).filter((x) => x !== f); },
  emit(e, a) { (this.h[e] || []).slice().forEach((f) => { try { f(a); } catch (err) { console.error(err); } }); },
};

const Reader = {
  idx: 0, stop: 0, mode: null, full: false, leaves: [], vb: null, lockUntil: 0, dragging: false,
  hiddenTitle: null, titleBase: 'SOS ONLY — Optus Redcliffe', revisitMemo: {},
  sess: { start: Date.now(), leftAt: null, awayCount: 0 },
};

/* ---------- layout ---------- */

function pickMode() {
  const m = Save.d.settings.mode;
  if (m && m !== 'auto') return m;
  const a = innerWidth / innerHeight;
  return a < 0.7 ? 'guided' : a <= 1.2 ? 'page' : 'spread';
}

function sizeBook() {
  const app = $('#app'), m = Reader.mode;
  const H = innerHeight, W = innerWidth - (Save.d.settings.transcript && innerWidth >= 820 && m !== 'guided' ? Math.min(380, innerWidth * 0.92) : 0);
  let lw, lh;
  if (m === 'spread') { lh = Math.min(H * 0.95, W * 0.97 * 0.75); lw = (lh * 2) / 3; }
  else if (m === 'page') { lh = Math.min(H * 0.975, W * 0.98 * 1.5); lw = (lh * 2) / 3; }
  else { lw = W; lh = H; }
  app.style.setProperty('--lw', `${lw}px`);
  app.style.setProperty('--lh', `${lh}px`);
  // HTML leaves (check-in, end) keep 2:3 and scale with --u
  const sw = m === 'guided' ? Math.min(W, H / 1.5) : lw;
  app.style.setProperty('--sw', `${sw}px`);
  app.style.setProperty('--u', `${sw / 1000}px`);
  app.dataset.mode = m;
  debugInfo();
}

/* ---------- rendering a story page ---------- */

function renderPage(num, env) {
  const P = PAGES[num];
  _uid = 0;
  _uidPrefix = `${P.id}-`;
  _ollieShift = Math.min(3, Math.max(0, (Save.d.visits || 1) - 1)) * 14;
  const pg = makePG(P, env);
  let body = '';
  try { body = P.render(pg); } catch (e) {
    console.error(`page ${num}`, e);
    body = R(0, 0, 1000, 1500, C.ink) + Tx(500, 750, `PAGE ${num} — PLEASE HOLD`, 40, C.y, 'text-anchor="middle"');
  }
  const bg = GUTTER[P.gutter] || P.gutter || C.ink;
  const folioCol = /black|grey/.test(P.gutter) && P.gutter !== 'whitegrey' ? '#8A8A86' : '#6A665C';
  const label = `Page ${num}: ${P.title}. ${P.alt || ''}`;
  const svg = `<svg class="page pg-${P.id}" viewBox="0 0 1000 1500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(label)}">` +
    `<rect class="pgbg" x="-3000" y="-3000" width="7000" height="7500" fill="${bg.startsWith('url') ? (P.gutter === 'whitegrey' ? C.gutterGrey : C.ink) : bg}"/>` +
    (bg.startsWith('url') ? `<rect width="1000" height="1500" fill="${bg}"/>` : '') +
    body +
    `<rect width="1000" height="1500" fill="url(#grain)" opacity="${P.gutter === 'black' ? 0.35 : 0.6}" pointer-events="none"/>` +
    `<text class="ft-x folio" x="${P.side === 'left' ? 34 : 966}" y="1490" font-size="20" fill="${folioCol}" text-anchor="middle">${num}</text>` +
    `<path class="gmask" fill="${C.ink}" fill-rule="evenodd" d="" pointer-events="none"/>` +
    `</svg>`;
  return { svg, pg };
}

/* ---------- guided view: animating the SVG viewBox between focus rectangles ---------- */

function leafSize() { const r = $('#book').getBoundingClientRect(); return [innerWidth, innerHeight, r]; }

function fitVB(f, pad = 14) {
  const [W, H] = leafSize();
  const A = W / H;
  let [x, y, w, h] = [f[0] - pad, f[1] - pad, f[2] + pad * 2, f[3] + pad * 2];
  if (w / h > A) { const nh = w / A; y -= (nh - h) / 2; h = nh; } else { const nw = h * A; x -= (nw - w) / 2; w = nw; }
  return [x, y, w, h];
}

function maskPath(f) {
  if (!f) return '';
  const [x, y, w, h] = f;
  return `M-5000 -5000H6000V6500H-5000Z M${n(x)} ${n(y)}h${n(w)}v${n(h)}h${n(-w)}Z`;
}

let _vbAnim = 0;
function animateVB(svg, from, to, dur, mask) {
  cancelAnimationFrame(_vbAnim);
  const m = svg.querySelector('.gmask');
  const set = (v, f) => { svg.setAttribute('viewBox', v.map(n).join(' ')); Reader.vb = v; if (m) m.setAttribute('d', maskPath(f)); };
  if (!from || dur <= 0 || reducedMotion()) { set(to, mask); return; }
  const t0 = performance.now();
  const fromMask = Reader.mask || mask;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const step = (now) => {
    const t = clamp((now - t0) / dur, 0, 1), e = ease(t);
    const v = from.map((a, i) => lerp(a, to[i], e));
    const mk = mask && fromMask ? fromMask.map((a, i) => lerp(a, mask[i], e)) : mask;
    set(v, mk);
    if (t < 1) _vbAnim = requestAnimationFrame(step);
  };
  _vbAnim = requestAnimationFrame(step);
  Reader.mask = mask;
}

const MOVE_MS = { cut: 0, glide: 380, creep: 1500, unfold: 1200 };

function buildStops(pg) {
  const out = [];
  const [W, H] = leafSize();
  for (const p of pg.panels) {
    const b = pg.bbox[p.id] || p.box;
    if (p.guided) { p.guided.forEach((g) => out.push(Object.assign({ p: p.id, move: 'glide' }, g, { focus: g.focus || b }))); continue; }
    // split wide panels so lettering stays at least ~13 CSS px
    const [x, y, w, h] = b;
    const sc = Math.min(W / (w + 28), H / (h + 28));
    const k = Math.min(3, Math.max(1, Math.ceil(0.46 / sc - 0.05)));
    if (k === 1 || w < h * 0.9) { out.push({ p: p.id, focus: b, move: 'glide' }); continue; }
    const seg = w / k;
    for (let i = 0; i < k; i++) out.push({ p: p.id, focus: [x + seg * i - (i ? seg * 0.08 : 0), y, seg * (i ? 1.08 : 1.04), h], move: 'glide' });
  }
  return out;
}

function revealBalloons(L, upto) {
  const ids = [];
  for (const s of L.stops.slice(0, upto + 1)) if (!ids.includes(s.p)) ids.push(s.p);
  let j = 0;
  L.svg.querySelectorAll('.bl').forEach((b) => {
    const on = ids.includes(b.dataset.p);
    if (on && !b.classList.contains('on')) { b.style.setProperty('--j', j++); b.classList.add('on'); }
    if (!on) b.classList.remove('on');
  });
}

function goStop(k, o = {}) {
  const L = Reader.leaves[0];
  if (!L || !L.stops || !L.stops.length) return;
  k = clamp(k, 0, L.stops.length - 1);
  Reader.stop = k;
  Reader.full = false;
  const s = L.stops[k];
  const vb = fitVB(s.focus);
  const from = o.from || Reader.vb;
  animateVB(L.svg, from, vb, o.move ? MOVE_MS[o.move] : MOVE_MS[s.move] ?? 380, s.focus.map((v, i) => v + (i < 2 ? -6 : 12)));
  revealBalloons(L, k);
  if (s.lock) Reader.lockUntil = Date.now() + s.lock;
  if (!o.silent) L.ctx && L.ctx._panel(s.p);
  progress();
  debugInfo();
}

function guidedFull(on) {
  const L = Reader.leaves[0];
  if (!L || !L.svg) return;
  Reader.full = on;
  if (on) {
    animateVB(L.svg, Reader.vb, fitVB([0, 0, 1000, 1500], 0), 380, null);
    L.svg.querySelectorAll('.bl').forEach((b) => b.classList.add('on'));
  } else goStop(Reader.stop);
}

/* ---------- per-page context: timers, triggers and effects all clean up on unmount ---------- */

function makeCtx(i, el, svg, pg, o) {
  const timers = [], cleanups = [], panelCbs = {}, firedPanels = new Set();
  const ctx = {
    num: i, el, svg, pg, mode: Reader.mode, dead: false,
    reduced: reducedMotion(), revisit: pg.revisit, visits: Save.d.visits, second: Save.d.finished || Save.d.visits > 1,
    layoutFrom: o.fromMode || null, save: Save.d, name: NAME(), hasName: hasName(),
    sess: Reader.sess, aspect: innerWidth / innerHeight,
    persist: () => Save.write(),
    q: (s) => svg.querySelector(s), qa: (s) => [...svg.querySelectorAll(s)],
    after(ms, fn) { const t = setTimeout(() => !ctx.dead && fn(), ms); timers.push(() => clearTimeout(t)); return t; },
    every(ms, fn) { const t = setInterval(() => !ctx.dead && fn(), ms); timers.push(() => clearInterval(t)); return t; },

      timers.push(() => clearInterval(t));

    raf(fn) {

    on(evt, fn) { Bus.on(evt, fn); cleanups.push(() => Bus.off(evt, fn)); },
    // Run fn when panel p is reached: in guided view when its stop is shown, otherwise `delay` ms after mount.

    _panel(p) { if (firedPanels.has(p)) return; firedPanels.add(p); (panelCbs[p] || []).forEach((f) => f()); },
    onTap(sel, fn) { ctx._taps.push([sel, fn]); },
    _taps: [],
    // press-and-hold on an element
    onHold(sel, down, up) {

        t.setAttribute('data-hot', 'hold');
        const d = (e) => { e.preventDefault(); down(e); const u = () => { up(); removeEventListener('pointerup', u); removeEventListener('pointercancel', u); }; addEventListener('pointerup', u); addEventListener('pointercancel', u); };

        cleanups.push(() => t.removeEventListener('pointerdown', d));

    },
    // drag across an element; fn receives page coordinates
    onDrag(sel, fn, end) {

    bed: (spec) => Sound.bed(spec),

/* ---------- mounting ---------- */

function unmountAll() {
  for (const L of Reader.leaves) {
    try { L.ctx && L.ctx._cleanup(); } catch (e) { console.error(e); }
    try { L.unmount && L.unmount(); } catch (e) { console.error(e); }
    L.el.remove();
  }
  Reader.leaves = [];
}

function mountLeaf(i, side, o) {
  const kind = leafKind(i);
  const el = document.createElement('div');
  el.className = `leaf leaf-${kind} ${side}`;
  const L = { i, el, kind };
  $('#book').append(el);
  if (kind === 'page' && !Save.d.checkedIn) {
    // a closed roller door until the reader has taken a ticket
    el.innerHTML = '<div class="shutter closed"><span>PLEASE TAKE A TICKET</span></div>';
    Reader.leaves.push(L);
    return L;
  }
  if (kind === 'page') {
    const P = PAGES[i];
    if (!P) { el.innerHTML = `<div class="missing">Page ${i}<br>Please hold…</div>`; Reader.leaves.push(L); return L; }
    // a re-render of the same view (late fonts, motion setting) keeps the page's revisit state
    const revisit = o.rerender && i in Reader.revisitMemo ? Reader.revisitMemo[i] : Save.d.pagesSeen.includes(i);
    Reader.revisitMemo[i] = revisit;
    const env = { mode: Reader.mode, revisit };
    const { svg, pg } = renderPage(i, env);
    el.innerHTML = svg;
    L.svg = el.firstElementChild;
    L.pg = pg;
    L.stops = Reader.mode === 'guided' ? buildStops(pg) : null;
    if (!o.noEnter) el.classList.add('enter');
    L.ctx = makeCtx(i, el, L.svg, pg, o);
    Reader.leaves.push(L);
    // page scripts run after the chrome has been set for this view (see show)
    L.start = () => { try { P.mount && P.mount(L.ctx); } catch (e) { console.error(`mount ${i}`, e); } };

    Reader.leaves.push(L);
    try { L.unmount = (kind === 'checkin' ? buildCheckin : buildEnd)(el, o); } catch (e) { console.error(e); }
  }
  return L;
}

  if (Reader.mode === 'spread') Reader.idx = ids[0];
  book.className = `mode-${Reader.mode}${o.turn ? ' turning' : ''}`;
  ids.forEach((i, k) => mountLeaf(i, Reader.mode === 'spread' ? (k ? 'right' : 'left') : 'single', o));

    const L = Reader.leaves[0];
