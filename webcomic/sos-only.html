/* SOS ONLY — environment kit: weather, light, the store and its fittings, the outside world. */

/* ---------- weather and light ---------- */

// Two layers of diagonal rain at different speeds. Seamless: each layer slides one tile height.
function rainFx(box, o = {}) {
  const [x, y, w, h] = box, ang = o.ang == null ? 14 : o.ang;
  const cx = x + w / 2, cy = y + h / 2, big = Math.hypot(w, h) + 60;
  const layer = (pat, cls, op, tile) =>
    `<g transform="rotate(${ang} ${n(cx)} ${n(cy)})"><g class="${cls}"><rect x="${n(cx - big / 2)}" y="${n(cy - big / 2 - tile)}" width="${n(big)}" height="${n(big + tile * 2)}" fill="url(#${pat})" opacity="${op}"/></g></g>`;
  const cid = uid('rc');
  return `<g class="rain" pointer-events="none"${o.noClip ? '' : ` clip-path="url(#${cid})"`}>${o.noClip ? '' : `<clipPath id="${cid}"><rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}"/></clipPath>`}${o.only !== 'A' ? layer(o.dark ? 'rainD' : 'rainB', 'fx-rainB', o.op2 == null ? 0.85 : o.op2, 300) : ''}${o.only !== 'B' ? layer(o.dark ? 'rainD' : 'rainA', 'fx-rainA', o.op == null ? 1 : o.op, 180) : ''}</g>`;
}

// Droplets and runs on glass.
function glassDrops(box, seed, count = 40, col = '#CFE3F0') {
  const r = rng(seed), [x, y, w, h] = box;
  let s = '';
  for (let i = 0; i < count; i++) {
    const px = x + r() * w, py = y + r() * h, l = 6 + r() * 40;
    s += `<path d="M${n(px)} ${n(py)}q-1.5 ${n(l * 0.6)} 0 ${n(l)}" fill="none" stroke="${col}" stroke-width="${n(1 + r() * 1.6)}" stroke-linecap="round" opacity="${n(0.25 + r() * 0.4)}"/>`;
    if (r() < 0.5) s += Ci(px, py + l, 1.6 + r() * 1.6, col, `opacity="${n(0.35 + r() * 0.3)}"`);
  }
  return `<g pointer-events="none">${s}</g>`;
}

// Lightning: a soft flash plus a bolt, at most once per ~5.6 s, capped brightness. Never in reduced motion.
function lightningFx(box, o = {}) {
  const [x, y, w, h] = box, r = rng(o.seed || 'bolt');
  let px = o.bx == null ? x + w * 0.6 : o.bx, py = y;
  const pts = [[px, py]];
  while (py < (o.by || y + h * 0.55)) { py += 22 + r() * 30; px += r.jit(26); pts.push([px, py]); }
  const bolt = Pa(pathOf(pts, false), 'none', st('#F4F8FF', 3.2)) + Pa(pathOf(pts, false), 'none', st('#BFD9FF', 9, 'opacity=".35"'));
  return `<g class="fx-light" pointer-events="none" style="animation-delay:${o.delay || 0}s">${R(x, y, w, h, '#DDE8FF', 'opacity=".5"')}${bolt}</g>`;
}

// A ceiling fluorescent tube and the cone of light under it.
function fluoro(x, y, w, o = {}) {
  const on = o.on !== false;
  const tube = R(x, y, w, 9, on ? '#F7FBFF' : '#55585E', `rx="4" ${st(C.ink, 2)}`);
  const cone = on && o.cone !== false ? `<path d="M${n(x)} ${n(y + 8)}L${n(x + w)} ${n(y + 8)}L${n(x + w + (o.spread || 60))} ${n(y + (o.drop || 260))}L${n(x - (o.spread || 60))} ${n(y + (o.drop || 260))}Z" fill="url(#gCone)" opacity="${o.coneOp || 0.7}"/>` : '';
  const g = on ? glow(x + w / 2, y + 4, w * 0.7, 22, 'gW', 0.6) : '';
  return `<g${o.flicker ? ' class="fx-flicker"' : ''}>${cone}${g}${tube}</g>`;
}

/* ---------- phones, screens, devices ---------- */

// A handset. o: {screen (fill), lit, content(sx,sy,sw,sh), stand, ring, rot, cls, body}
function phoneObj(x, y, w, h, o = {}) {
  const rr = Math.min(w, h) * 0.14;
  let s = '';
  if (o.stand) s += R(x + w * 0.3, y + h - 4, w * 0.4, h * 0.22, '#2B2D33', st(C.ink, 2)) + R(x + w * 0.12, y + h + h * 0.18, w * 0.76, h * 0.07, '#1A1B1F', st(C.ink, 2));
  if (o.lit && o.halo !== false) s += glow(x + w / 2, y + h / 2, w * 1.4, h * 0.95, o.haloGrad || 'gS', o.haloOp || 0.45);
  s += R(x, y, w, h, o.body || '#141518', `rx="${n(rr)}" ${st(C.ink, Math.max(1.5, w * 0.05))}`);
  const sx = x + w * 0.08, sy = y + h * 0.06, sw = w * 0.84, sh = h * 0.88;
  s += R(sx, sy, sw, sh, o.screen || (o.lit ? '#CFEFFB' : '#1D232B'), `rx="${n(rr * 0.6)}"${o.lit ? ' class="lit"' : ''}`);
  if (!o.lit && o.glare !== false) s += Pa(`M${n(sx + sw * 0.15)} ${n(sy)}L${n(sx + sw * 0.55)} ${n(sy)}L${n(sx)} ${n(sy + sh * 0.45)}L${n(sx)} ${n(sy + sh * 0.2)}Z`, '#FFFFFF', 'opacity=".06"');
  if (o.content) s += o.content(sx, sy, sw, sh);
  if (o.ring) s += `<g class="fx-ring" style="--rd:${o.ringDelay || 0}s" pointer-events="none">${Pa(`M${n(x - w * 0.25)} ${n(y + h * 0.2)}q-${n(w * 0.18)} ${n(h * 0.3)} 0 ${n(h * 0.6)}M${n(x + w * 1.25)} ${n(y + h * 0.2)}q${n(w * 0.18)} ${n(h * 0.3)} 0 ${n(h * 0.6)}`, 'none', st(o.ringCol || C.y, Math.max(2, w * 0.07)))}</g>`;
  const tf = o.rot ? ` transform="rotate(${o.rot} ${n(x + w / 2)} ${n(y + h / 2)})"` : '';
  return `<g class="phone ${o.cls || ''}"${tf}>${s}</g>`;
}

// Status-bar style signal readout used inside screens. kind: 'bars4' | 'bars3' | '3g' | 'sos' | '5g'
function signalGlyph(x, y, s, kind, col = C.ink) {
  const bars = { bars4: 4, bars3: 3, '3g': 2, sos: 0, '5g': 4, none: 0 }[kind] ?? 4;
  let g = '';
  for (let i = 0; i < 4; i++) g += R(x + i * 7 * s, y + (12 - (i + 1) * 3) * s, 5 * s, (i + 1) * 3 * s, i < bars ? col : 'none', i < bars ? '' : st(col, 1 * s, 'opacity=".5"'));
  const lab = kind === 'sos' ? 'SOS only' : kind === '3g' ? '3G' : kind === '5g' ? '5G' : '4G';
  g += Tx(x + 31 * s, y + 12 * s, lab, 13 * s, col, '', FONTS.ui);
  return g;
}

/* ---------- the store ---------- */

// Display wall: rows of demo phones on security stands. o: {cols, rows, lit, ring, dim, screens(i, j, sx, sy, sw, sh), header}
function displayWall(box, o = {}) {
  const [x, y, w, h] = box;
  const cols = o.cols || 8, rows = o.rows || 3;
  let s = R(x, y, w, h, o.wall || '#E9E6DE', st(C.ink, 3));
  if (o.header !== false) s += R(x, y, w, h * 0.12, C.y, st(C.ink, 3)) + Tx(x + w / 2, y + h * 0.09, 'optus', h * 0.085, C.ink, 'text-anchor="middle" font-weight="700" letter-spacing="2"', FONTS.ui);
  const top = y + h * 0.17, rowH = (h * 0.8) / rows, colW = w / cols;
  for (let j = 0; j < rows; j++) {
    const sy0 = top + j * rowH;
    s += R(x + 6, sy0 + rowH * 0.86, w - 12, 6, '#B9B4A8', st(C.ink, 1.6));
    for (let i = 0; i < cols; i++) {
      const pw = colW * 0.42, ph = rowH * 0.6, px = x + i * colW + (colW - pw) / 2, py = sy0 + rowH * 0.12;
      const content = o.screens ? (sx, sy2, sw, sh) => o.screens(i, j, sx, sy2, sw, sh) : null;
      s += Ln(px + pw / 2, py + ph, px + pw / 2 + 4, sy0 + rowH * 0.86, '#3A3A3A', 1.2) +
        phoneObj(px, py, pw, ph, { lit: typeof o.lit === 'function' ? o.lit(i, j) : o.lit, ring: typeof o.ring === 'function' ? o.ring(i, j) : o.ring, ringDelay: ((i + j * cols) % 7) * 0.13, content, screen: o.screenCol, haloOp: 0.3 });
    }
  }
  if (o.dim) s += R(x, y, w, h, C.ink, `opacity="${o.dim}"`);
  return s;
}

// Counter: a white front with a yellow kick strip and a pale top. o: {top, dark}
function counterObj(x, y, w, h, o = {}) {
  const th = o.top || h * 0.12;

// The queue TV above the counter. o: {num, label, sub, name, dark, cls}
function queueTV(x, y, w, h, o = {}) {

  return `<g class="qtv ${o.cls || ''}">${s}</g>`;
}

// Queue kiosk on its pedestal. o: {s, screen(sx,sy,sw,sh), plug:'in'|'out'|null, lit}
function kiosk(x, y, o = {}) {
  const s = o.s || 1;
  let g = R(-34, -150, 68, 150, '#E9E6DE', st(C.ink, 3)) + R(-40, -6, 80, 8, '#2A2B30', st(C.ink, 2));
  g += R(-48, -300, 96, 160, '#1D1F24', `rx="6" ${st(C.ink, 3)}`);
  g += R(-40, -290, 80, 110, o.lit === false ? '#22272E' : '#DDF3FB', `rx="3"${o.lit === false ? '' : ' class="lit"'}`);
  if (o.screen) g += o.screen(-40, -290, 80, 110);
  g += R(-26, -168, 52, 8, '#0A0A0A', st('#555', 1.4)) + R(-48, -300, 96, 14, C.y, st(C.ink, 2));
  if (o.plug === 'out') g += Pa('M30 -10 C60 -10 70 30 40 50 L40 70', 'none', st('#1A1A1A', 4)) + R(30, 66, 22, 16, '#E6E3DA', st(C.ink, 2)) + Ln(36, 82, 36, 92, '#B9B4A8', 3) + Ln(46, 82, 46, 92, '#B9B4A8', 3);
  return `<g class="kiosk ${o.cls || ''}" transform="translate(${n(x)} ${n(y)}) scale(${s})">${g}</g>`;
}

// Perspective floor tiles from a vanishing point.
function floorGrid(box, vx, vy, o = {}) {
  const [x, y, w, h] = box;
  let s = R(x, y, w, h, o.col || '#D9D5CB');
  const lines = o.lines || 14, col = o.lineCol || '#B4AFA2';
  for (let i = -lines; i <= lines * 2; i++) {
    const bx = x + (i / lines) * w;
    s += Ln(vx, vy, bx, y + h, col, 1.4);
  }
  for (let k = 1; k <= (o.rows || 9); k++) {
    const t = Math.pow(k / (o.rows || 9), 1.8);
    const yy = lerp(vy, y + h, t);
    if (yy > y) s += Ln(x, yy, x + w, yy, col, 1.2);
  }
  return s;
}

// The shop floor seen from behind the counter, looking out to the front glass and roller door.
// o: {lights:[...on flags], dark (0..1), door:'down'|'up', rain, glassFn(box), ollie:{...}}
function storeFront(box, o = {}) {
  const [x, y, w, h] = box;
  const r = rng(o.seed || 'storefront');
  let s = '';
  const ceil = y + h * 0.16, floorY = y + h * 0.66;
  s += R(x, y, w, h, '#C9C5BA');
  // ceiling
  s += R(x, y, w, ceil - y, '#9B978D');
  const tubes = o.lights || [true, true, true, true];
  tubes.forEach((on, i) => { s += fluoro(x + w * (0.1 + i * 0.22), ceil - 18, w * 0.14, { on, drop: h * 0.5, flicker: o.flicker === i, coneOp: 0.45 }); });
  // side walls with yellow promo panels
  s += Po([[x, ceil], [x + w * 0.12, ceil + h * 0.05], [x + w * 0.12, floorY - h * 0.02], [x, floorY + h * 0.1]], '#B8B3A7', st(C.ink, 2));
  s += Po([[x + w, ceil], [x + w * 0.88, ceil + h * 0.05], [x + w * 0.88, floorY - h * 0.02], [x + w, floorY + h * 0.1]], '#B8B3A7', st(C.ink, 2));
  s += Po([[x + w * 0.02, ceil + h * 0.1], [x + w * 0.1, ceil + h * 0.12], [x + w * 0.1, ceil + h * 0.34], [x + w * 0.02, ceil + h * 0.36]], C.y, st(C.ink, 2));
  // the front: glass and roller door
  const gx = x + w * 0.12, gw = w * 0.76, gy = ceil + h * 0.05, gh = floorY - gy - h * 0.02;
  s += R(gx, gy, gw, gh, '#25313D');
  if (o.outside) s += `<g clip-path="none">${o.outside([gx, gy, gw, gh])}</g>`;
  if (o.rain !== false) s += rainFx([gx, gy, gw, gh], { op: 0.7, op2: 0.5 });
  s += glassDrops([gx, gy, gw, gh], 'sf', 50);
  if (o.door !== 'up') {
    const dh = o.door === 'half' ? gh * 0.45 : gh;
    let slats = '';
    for (let yy = gy; yy < gy + dh; yy += 14) slats += Ln(gx, yy, gx + gw, yy, '#5D6066', 2);
    s += `<g opacity="${o.doorOp == null ? 0.82 : o.doorOp}">${R(gx, gy, gw, dh, '#7C8087')}${slats}${R(gx, gy + dh - 10, gw, 10, '#3A3D44')}</g>`;
  }
  for (let i = 0; i <= 4; i++) s += Ln(gx + (gw * i) / 4, gy, gx + (gw * i) / 4, gy + gh, '#1C1D21', 5);
  s += R(gx, gy, gw, gh, 'none', st(C.ink, 5));
  // floor
  s += `<g>${floorGrid([x, floorY, w, y + h - floorY], x + w / 2, floorY - h * 0.25, { col: '#CFCBC0', lineCol: '#ADA89B', rows: 7 })}</g>`;
  if (o.dark) s += R(x, y, w, h, C.ink, `opacity="${o.dark}"`);
  return s;
}

  if (o.order) s += R(x + w * 0.64, y + h * 0.2, w * 0.3, h * 0.1, '#0B0B0B', st('#444', 1.2)) + Tx(x + w * 0.79, y + h * 0.275, 'ORDER READY', h * 0.055, '#7CFF9A', 'text-anchor="middle" class="lit"', FONTS.mono);
  // tables and chairs

    s += E(cx, cy, w * 0.07, h * 0.02, '#5A4632', st(C.ink, 1.6)) + Ln(cx, cy, cx, cy + h * 0.14, '#222', 3);
    if (o.cups) s += R(cx - 5, cy - 12, 10, 11, '#F4F0E6', st(C.ink, 1.2)) + `<g class="fx-steam" style="animation-delay:${i * 0.4}s">${Pa(`M${n(cx)} ${n(cy - 14)}q-5 -8 0 -16q5 -8 0 -16`, 'none', st('#F2F2F2', 2, 'opacity=".6"'))}</g>`;
  });
  // window glass sheen
  s += Pa(`M${n(x)} ${n(y + h * 0.18)}L${n(x + w * 0.2)} ${n(y + h * 0.18)}L${n(x)} ${n(y + h * 0.6)}Z`, '#FFFFFF', 'opacity=".05"');
  if (!lit && !o.full) s += R(x, y, w, h, C.ink, 'opacity=".35"');
  return s;
}

/* ---------- back of house ---------- */

// Sealed handset box with a label. o: {label, sub, glow, warm, cls}
function handsetBox(x, y, w, h, o = {}) {
  let s = R(x, y, w, h, o.col || '#F1EEE6', st(C.ink, Math.max(1.4, w * 0.03)));
  s += R(x, y + h * 0.42, w, h * 0.12, o.tape || '#C9B98E', 'opacity=".75"');
  if (o.glow) s += R(x + 2, y + 2, w - 4, h - 4, C.screen, `opacity="${o.glow}" class="lit"`);
  if (o.label) {
    s += R(x + w * 0.08, y + h * 0.6, w * 0.84, h * 0.3, '#FFFFFF', st(C.ink, 1.2));
    s += Tx(x + w / 2, y + h * 0.73, o.label, Math.min(h * 0.11, (w * 1.5) / Math.max(6, o.label.length)), C.ink, 'text-anchor="middle"', FONTS.mono);
    if (o.sub) s += Tx(x + w / 2, y + h * 0.86, o.sub, Math.min(h * 0.08, (w * 1.4) / Math.max(6, o.sub.length)), '#333', 'text-anchor="middle"', FONTS.mono);
  }
  return `<g class="hbox ${o.cls || ''}">${s}</g>`;
}

// Steel shelving unit stacked with boxes. o: {rows, glow, labels(i,j) -> [label, sub], seed}
function shelfUnit(x, y, w, h, o = {}) {
  const rows = o.rows || 4, r = rng(o.seed || 'shelf');
  let s = '';
  const rh = h / rows;
  for (let j = 0; j < rows; j++) {
    const yy = y + j * rh;
    let bx = x + 6;
    while (bx < x + w - 30) {
      const bw = Math.min(x + w - 6 - bx, rh * (0.55 + r() * 0.3)), bh = rh * (0.6 + r() * 0.25);
      const lab = o.labels ? o.labels(j, Math.round((bx - x) / 40)) : null;
      s += handsetBox(bx, yy + rh - 8 - bh, bw - 4, bh, { glow: o.glow ? o.glow * (0.4 + r() * 0.6) : 0, label: lab && lab[0], sub: lab && lab[1], col: o.boxCol });
      bx += bw;
    }
    s += R(x, yy + rh - 8, w, 8, '#7D828A', st(C.ink, 2));
  }
  s += R(x - 4, y, 8, h, '#6A6F77', st(C.ink, 2)) + R(x + w - 4, y, 8, h, '#6A6F77', st(C.ink, 2));
  return s;
}

// Laptop. o: {screen (fill), content(sx,sy,sw,sh), open, rot}
function laptopObj(x, y, w, h, o = {}) {
  let s = Po([[x - w * 0.06, y + h], [x + w * 1.06, y + h], [x + w, y + h * 0.82], [x, y + h * 0.82]], '#9AA0A8', st(C.ink, 2.5));
  s += R(x, y, w, h * 0.82, '#2A2D33', `rx="5" ${st(C.ink, 2.5)}`);
  const sx = x + w * 0.05, sy = y + h * 0.06, sw = w * 0.9, sh = h * 0.7;
  s += R(sx, sy, sw, sh, o.screen || '#121820', 'class="lit"');
  if (o.content) s += o.content(sx, sy, sw, sh);
  return `<g class="laptop ${o.cls || ''}"${o.rot ? ` transform="rotate(${o.rot} ${n(x + w / 2)} ${n(y + h / 2)})"` : ''}>${s}</g>`;
}

// JARVIS-style enterprise window. o: {title, lines:[...], size, tabs}
function jarvisWindow(x, y, w, h, o = {}) {
  let s = R(x, y, w, h, '#C9D0D6', st(C.ink, 3));
  s += R(x, y, w, h * 0.08, '#56606B') + Tx(x + 10, y + h * 0.058, o.title || 'JARVIS — Customer Interaction', h * 0.04, '#EEF2F5', '', FONTS.mono);
  const tabs = o.tabs || ['Account', 'Services', 'Interaction Notes', 'Billing'];
  tabs.forEach((t, i) => { s += R(x + 8 + i * w * 0.24, y + h * 0.1, w * 0.23, h * 0.05, i === 2 ? '#EEF1F3' : '#AEB7BF', st('#56606B', 1)) + Tx(x + 14 + i * w * 0.24, y + h * 0.138, t, h * 0.03, '#2C3540', '', FONTS.mono); });
  s += R(x + 8, y + h * 0.15, w - 16, h * 0.82, '#F4F6F7', st('#7C8792', 1));
  return s;
}

/* ---------- the shop floor in one-point perspective ---------- */

// Bilinear point in a quad [p00, p10, p11, p01] (u across, v down).
function quadPt(q, u, v) {
  const t = [lerp(q[0][0], q[1][0], u), lerp(q[0][1], q[1][1], u)];
  const b = [lerp(q[3][0], q[2][0], u), lerp(q[3][1], q[2][1], u)];
  return [lerp(t[0], b[0], v), lerp(t[1], b[1], v)];
}
// Depth fraction (0 near … 1 far) to screen fraction along a receding wall.
const persp = (s, Z = 3.2) => (1 - 1 / (1 + s * (Z - 1))) / (1 - 1 / Z);
const quadAt = (q, u0, u1, v0, v1) => [quadPt(q, u0, v0), quadPt(q, u1, v0), quadPt(q, u1, v1), quadPt(q, u0, v1)];

// o: {vx, vy (0..1 in box), bw, bh (back wall size 0..1), night (0..1 darkness), lights:[6 flags], flicker (index),
//     back: 'front'|'wall'|fn(x,y,w,h), left: 'acc'|'display'|'glass'|null, right: same, rain, door, ollie: markup at back wall,
//     litScreens (phones lit), ring, tint}
function storeInterior(box, o = {}) {
  const [x, y, w, h] = box;
  const vx = x + w * (o.vx == null ? 0.5 : o.vx), vy = y + h * (o.vy == null ? 0.42 : o.vy);
  const bw = w * (o.bw || 0.44), bh = h * (o.bh || 0.5);
  const bl = vx - bw / 2, br = vx + bw / 2, bt = vy - bh * 0.5, bb = vy + bh * 0.5;
  const X0 = x - 4, X1 = x + w + 4, Y0 = y - 4, Y1 = y + h + 4;
  const TL = [X0, Y0], TR = [X1, Y0], BR = [X1, Y1], BL = [X0, Y1];
  const btl = [bl, bt], btr = [br, bt], bbr = [br, bb], bbl = [bl, bb];
  const night = o.night == null ? 0.35 : o.night;
  const cols = o.day ? { ceil: '#C9C6BD', wall: '#DAD6CC', wall2: '#CFCBC0', floor: '#D2CEC3', tile: '#B3AEA1', back: '#E3DFD6' } :
    { ceil: '#252C35', wall: '#3E4854', wall2: '#36404B', floor: '#2C343D', tile: '#3B4550', back: '#46515D' };
  let s = '';
  // ceiling, walls, floor
  s += Po([TL, TR, btr, btl], cols.ceil);
  const leftQ = [TL, btl, bbl, BL], rightQ = [TR, btr, bbr, BR];
  s += Po(leftQ, cols.wall) + Po(rightQ, cols.wall2);
  s += Po([BL, BR, bbr, bbl], cols.floor);
  // floor tiles converging on the vanishing point
  let tiles = '';
  const N = 16;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const top = [lerp(bl, br, t), bb], bot = [lerp(x - w * 1.2, x + w * 2.2, t), Y1];
    tiles += `M${n(top[0])} ${n(top[1])}L${n(bot[0])} ${n(bot[1])}`;
  }
  for (let k = 1; k <= 8; k++) {
    const t = persp(1 - k / 8.5, 3.4), yy = lerp(Y1, bb, t);
    const xl = lerp(X0, bl, (yy - Y1) / (bb - Y1)), xr = lerp(X1, br, (yy - Y1) / (bb - Y1));
    tiles += `M${n(xl)} ${n(yy)}L${n(xr)} ${n(yy)}`;
  }
  s += `<path d="${tiles}" fill="none" stroke="${cols.tile}" stroke-width="1.5"/>`;
  // ceiling tubes in perspective
  const ceilQ = [TL, TR, btr, btl];
  const lights = o.lights || [1, 1, 1, 1, 1, 1];
  [[0.12, 0.3], [0.5, 0.6], [0.78, 0.82]].forEach(([dv], row) => {
    [[0.22, 0.4], [0.6, 0.78]].forEach(([u0, u1], c) => {
      const on = lights[row * 2 + c];
      const v = persp(dv), v2 = persp(dv + 0.06);
      const q = quadAt(ceilQ, u0, u1, v, v2);
      const cx = (q[0][0] + q[2][0]) / 2, cy = (q[0][1] + q[2][1]) / 2;
      const wq = Math.abs(q[1][0] - q[0][0]);
      s += `<g${o.flicker === row * 2 + c ? ' class="fx-flicker"' : o.flicker2 === row * 2 + c ? ' class="fx-flicker2"' : ''}>${on ? glow(cx, cy + wq * 0.25, wq * 0.9, wq * 0.55, 'gW', o.day ? 0.5 : 0.35) : ''}${Po(q, on ? '#F4FAFF' : '#4A525C', st(C.ink, 1.5))}</g>`;
    });
  });
  // the back wall
  s += R(bl, bt, bw, bh, cols.back, st(C.ink, 2.5));
  if (typeof o.back === 'function') s += o.back(bl, bt, bw, bh);
  else if (o.back !== 'wall') {
    // front glass + roller door + the mall beyond
    const gx = bl + bw * 0.06, gy = bt + bh * 0.08, gw = bw * 0.88, gh = bh * 0.92;
    s += R(gx, gy, gw, gh, '#141B24');
    if (o.outside) s += o.outside(gx, gy, gw, gh);
    if (o.rain !== false) s += rainFx([gx, gy, gw, gh], { op: 0.6, op2: 0.45 });
    s += glassDrops([gx, gy, gw, gh], 'si' + (o.seed || ''), 26);
    if (o.door !== 'up') {
      const dh = o.door === 'half' ? gh * 0.45 : gh;
      let sl = '';
      for (let yy = gy + 6; yy < gy + dh; yy += 9) sl += `M${n(gx)} ${n(yy)}h${n(gw)}`;
      s += `<g opacity="${o.doorOp == null ? 0.85 : o.doorOp}">${R(gx, gy, gw, dh, o.day ? '#8C9097' : '#5A5F67')}<path d="${sl}" stroke="${o.day ? '#6A6E75' : '#3E4249'}" stroke-width="2"/>${R(gx, gy + dh - 7, gw, 7, '#2E3137')}</g>`;
    }
    for (let i = 0; i <= 3; i++) s += Ln(gx + (gw * i) / 3, gy, gx + (gw * i) / 3, gy + gh, '#111317', 4);
    s += R(gx, gy, gw, gh, 'none', st(C.ink, 4));
  }
  if (o.ollie) s += o.ollie(bl, bt, bw, bh);
  // side walls: accessories pegboard, display wall, or glass
  const wallItems = (q, kind, side) => {
    let g = '';
    if (kind === 'acc') {
      const rows = 4, cs = 7;
      g += Po(quadAt(q, 0.02, 0.98, 0.18, 0.86), o.day ? '#E8E4DA' : '#4C5662', st(C.ink, 1.6));
      for (let j = 0; j < rows; j++) for (let i = 0; i < cs; i++) {
        const u0 = persp(0.04 + i * 0.13), u1 = persp(0.04 + i * 0.13 + 0.08);
        const v0 = 0.24 + j * 0.15, v1 = v0 + 0.11;
        const col = ['#2B4E7A', '#C8C3B5', '#7A2E3A', C.y, '#2E2E33', '#4E7A5A'][(i * 3 + j * 5) % 6];
        g += Po(quadAt(q, u0, u1, v0, v1), o.day ? col : shade(col, -0.45), st(C.ink, 1.2));
      }
    } else if (kind === 'display') {
      g += Po(quadAt(q, 0.02, 0.98, 0.16, 0.2), C.y, st(C.ink, 1.5));
      g += Po(quadAt(q, 0.02, 0.98, 0.2, 0.84), o.day ? '#EEEBE4' : '#4A5460', st(C.ink, 1.6));
      for (let j = 0; j < 3; j++) {
        g += Po(quadAt(q, 0.02, 0.98, 0.37 + j * 0.2, 0.385 + j * 0.2), '#8A8D93');
        for (let i = 0; i < 8; i++) {
          const u0 = persp(0.04 + i * 0.12), u1 = persp(0.04 + i * 0.12 + 0.05);
          const qq = quadAt(q, u0, u1, 0.24 + j * 0.2, 0.36 + j * 0.2);
          const lit = typeof o.litScreens === 'function' ? o.litScreens(i, j, side) : o.litScreens;
          g += Po(qq, '#16181C', st(C.ink, 1.1)) + Po(quadAt(q, u0 + (u1 - u0) * 0.12, u1 - (u1 - u0) * 0.12, 0.25 + j * 0.2, 0.35 + j * 0.2), lit ? (lit === true ? '#CFF2FF' : lit) : '#232A33', lit ? 'class="lit"' : '');
          if (lit) { const c = quadPt(q, (u0 + u1) / 2, 0.3 + j * 0.2); g += glow(c[0], c[1], Math.abs(qq[1][0] - qq[0][0]) * 2, Math.abs(qq[3][1] - qq[0][1]) * 1.1, 'gS', 0.35); }
          if (o.ring && (i + j) % 2 === 0) { const c = quadPt(q, u1, 0.27 + j * 0.2); g += `<g class="fx-ring" style="--rd:${((i * 3 + j) % 7) * 0.15}s">${Pa(`M${n(c[0] + 3)} ${n(c[1] - 6)}q5 6 0 12M${n(c[0] + 8)} ${n(c[1] - 9)}q7 9 0 18`, 'none', st(C.y, 2))}</g>`; }
        }
      }
    } else if (kind === 'glass') {
      g += Po(quadAt(q, 0.05, 0.95, 0.12, 0.92), '#141B24', st(C.ink, 2));
      if (o.rain !== false) g += `<g opacity=".6">${glassDrops([Math.min(q[0][0], q[1][0]), q[1][1], Math.abs(q[1][0] - q[0][0]), q[2][1] - q[1][1]], 'sg' + side, 18)}</g>`;
    } else if (typeof kind === 'function') g += kind(q);
    return g;
  };
  s += wallItems(leftQ, o.left === undefined ? 'acc' : o.left, 'L') + wallItems(rightQ, o.right === undefined ? 'display' : o.right, 'R');
  // corner lines
  s += Pa(`M${n(X0)} ${n(Y0)}L${n(bl)} ${n(bt)}M${n(X1)} ${n(Y0)}L${n(br)} ${n(bt)}M${n(X0)} ${n(Y1)}L${n(bl)} ${n(bb)}M${n(X1)} ${n(Y1)}L${n(br)} ${n(bb)}`, 'none', st(C.ink, 2.5));
  if (night) s += R(x - 10, y - 10, w + 20, h + 20, o.tint || C.ink, `opacity="${night}"`);
  if (o.vig !== false) s += R(x - 10, y - 10, w + 20, h + 20, 'url(#gVig)', `opacity="${o.vig || 0.8}"`);
  return s;
}

// The counter seen from behind, across the bottom of a panel. o: {y (top edge), tilt, dark}
function counterFore(box, o = {}) {
  const [x, y, w, h] = box;
  const ty = o.y || y + h * 0.82, t2 = ty + (o.tilt || 0);
  let s = Po([[x - 10, ty], [x + w + 10, t2], [x + w + 10, y + h + 10], [x - 10, y + h + 10]], o.dark ? '#16181C' : '#2B2E35', st(C.ink, 4));
  s += Pa(`M${n(x - 10)} ${n(ty + 5)}L${n(x + w + 10)} ${n(t2 + 5)}`, 'none', st(o.dark ? '#2E323A' : '#4A4F58', 3));
  return s;
}

// Flat pegboard wall of accessories (cases, chargers, cables) on hooks. o: {dark, seed, rows, cols}
function pegboard(box, o = {}) {
  const [x, y, w, h] = box, r = rng(o.seed || 'peg');
  let s = R(x, y, w, h, o.dark ? '#3C4550' : '#E6E2D8') + R(x, y, w, h, 'url(#ht1)', 'opacity=".35"');
  const rows = o.rows || 4, cols = o.cols || 6;
  const cw = w / cols, rh = h / rows;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    if (r() < 0.12) continue;
    const cx = x + cw * (i + 0.5), top = y + rh * j + rh * 0.12;
    const pw = cw * (0.5 + r() * 0.2), ph = rh * (0.62 + r() * 0.15);
    const col = r.pick(['#2B4E7A', '#C8C3B5', '#7A2E3A', C.y, '#2E2E33', '#4E7A5A', '#E7E4DC']);
    s += Ln(cx, top - 8, cx, top + 6, '#888', 2) + R(cx - pw / 2, top, pw, ph, o.dark ? shade(col, -0.4) : col, st(C.ink, 1.6));
    s += R(cx - pw * 0.3, top + ph * 0.25, pw * 0.6, ph * 0.55, o.dark ? '#5A6470' : '#F8F8F4', `opacity=".75" ${st(C.ink, 1)}`);
    s += Ci(cx, top + 5, 3, o.dark ? '#222' : '#FFF', st(C.ink, 1));
  }
  return s;
}

function p1Wide(pg, box, gone) {
  const [x, y, w, h] = box;

  });
  // a pool of light where Jarrad works
  s += glow(x + w * 0.2, y + h * 0.78, w * 0.2, h * 0.16, 'gW', 0.18);
  const jx = x + w * 0.19, jy = y + h * 0.83;

    s += `<g transform="translate(${n(sx)} ${n(sy)}) rotate(14) scale(.8)">${Pa('M-6 -6 L26 -10 L30 0 L4 6 L2 22 L-8 22 Z', '#3A3C42', st(C.ink, 3))}${R(26, -9, 4, 8, C.laser)}</g>`;

  }
  // foreground: the counter, from behind
  s += counterFore(box, { y: y + h * 0.84, tilt: -6, dark: true });

  if (gone) {

  }
  return s;
}

// A hand counting on its fingers (hoodie sleeve pulled over the wrist). up = fingers raised.
function handCount(x, y, sc, up, skin = '#EEC7A6', sleeve = '#6B7076') {
  let g = '';
  const fingers = [[-22, -2], [-8, -8], [6, -8], [19, -2]];
  fingers.forEach(([fx, fa], i) => {
    const raised = i < up;
    g += `<g transform="translate(${fx} -46) rotate(${fa + (raised ? 0 : 0)})">${R(-6.5, raised ? -50 : -18, 13, raised ? 54 : 22, skin, `rx="6.5" ${st(C.ink, 2.6)}`)}${raised ? Ln(-3, -36, 3, -36, shade(skin, -0.3), 1.2) : ''}</g>`;
  });
  g += Pa('M-30 -50 C-34 -20 -26 0 0 2 C24 0 32 -20 28 -50 Z', skin, st(C.ink, 2.8));
  g += `<g transform="translate(-30 -26) rotate(-40)">${R(-6, -26, 12, 30, skin, `rx="6" ${st(C.ink, 2.6)}`)}</g>`;
  g += Pa('M-36 -6 C-36 20 36 20 36 -6 L40 40 L-40 40 Z', sleeve, st(C.ink, 3));
  return `<g transform="translate(${n(x)} ${n(y)}) scale(${sc})">${g}</g>`;
}

/* ---------- Page 4 — The Board ---------- */

const crown = (x, y, s = 1, col = C.y) => `<path d="M${n(x - 9 * s)} ${n(y + 6 * s)}L${n(x - 10 * s)} ${n(y - 6 * s)}L${n(x - 4 * s)} ${n(y)}L${n(x)} ${n(y - 9 * s)}L${n(x + 4 * s)} ${n(y)}L${n(x + 10 * s)} ${n(y - 6 * s)}L${n(x + 9 * s)} ${n(y + 6 * s)}Z" fill="${col}" stroke="${C.ink}" stroke-width="${n(1.4 * s)}" stroke-linejoin="round"/>`;

// The BEST OF THE MONTH wall monitor. o: {sales, glow, skew}
function leaderboard(x, y, w, h, o = {}) {
  const d = new Date();
  const when = `3:00 AM · ${d.getDate()} ${d.toLocaleString(undefined, { month: 'short' })}`;
  const k = w / 600;
  let s = R(x - 10 * k, y - 10 * k, w + 20 * k, h + 20 * k, '#141518', `rx="${8 * k}" ${st(C.ink, 3)}`);
  s += R(x, y, w, h, '#F4F2EA', 'class="lit"');
  s += R(x, y, w, h * 0.13, C.y) + Tx(x + w / 2, y + h * 0.095, 'BEST OF THE MONTH', h * 0.07, C.ink, 'text-anchor="middle" letter-spacing="2"', FONTS.ui);
  // rank 1: Jarrad — photo, crowns, the total that keeps climbing
  const px = x + w * 0.04, py = y + h * 0.18, pw = w * 0.24, ph = h * 0.48;
  const cid = uid('lb');
  s += `<clipPath id="${cid}"><rect x="${n(px)}" y="${n(py)}" width="${n(pw)}" height="${n(ph)}"/></clipPath>`;
  s += R(px, py, pw, ph, '#BFD4E6') + `<g clip-path="url(#${cid})">${fig('jarrad', { x: px + pw / 2, y: py + ph * 2.35, s: ph / 150, view: 'front', face: 'grin', light: 'none', props: ['lanyard'] })}</g>` + R(px, py, pw, ph, 'none', st(C.ink, 2.5));
  s += Tx(px + pw + w * 0.04, py + h * 0.1, '#1  JARRAD', h * 0.085, C.ink, '', FONTS.ui);
  s += `<text class="ft-m p4-sales" x="${n(px + pw + w * 0.04)}" y="${n(py + h * 0.26)}" font-size="${n(h * 0.15)}" fill="${C.ink}">${o.sales || 287}</text>`;
  s += Tx(px + pw + w * 0.04 + h * 0.36, py + h * 0.25, 'SALES', h * 0.05, '#555', '', FONTS.ui);
  for (let i = 0; i < 12; i++) s += crown(px + pw + w * 0.07 + i * w * 0.052, py + h * 0.36, k * 1.15);
  s += Tx(px + pw + w * 0.04, py + h * 0.46, `Last sale: ${when}`, h * 0.045, '#444', '', FONTS.mono);
  s += `<g class="sale-toast">${R(px + pw + w * 0.36, py + h * 0.17, w * 0.2, h * 0.08, '#2BB673', `rx="${h * 0.04}"`)}${Tx(px + pw + w * 0.46, py + h * 0.23, 'SALE ✓', h * 0.05, '#FFFFFF', 'text-anchor="middle"', FONTS.ui)}</g>`;
  // the rest of the board
  const rows = [['#2  ZEE', '271'], ['#3  CHASE', '198'], ['#4  LUKA', '164'], ['#5  ZANE', '9']];
  rows.forEach(([nm, v], i) => {
    const ry = y + h * (0.72 + i * 0.065);
    s += R(x + w * 0.04, ry - h * 0.045, w * 0.92, h * 0.058, i % 2 ? '#ECE9E0' : '#E3E0D6');
    s += Tx(x + w * 0.06, ry, nm, h * 0.045, C.ink, '', FONTS.ui) + Tx(x + w * 0.9, ry, v, h * 0.05, C.ink, 'text-anchor="end"', FONTS.mono);
  });
  if (o.glow) s = glow(x + w / 2, y + h / 2, w * 0.8, h * 0.9, 'gW', o.glow) + s;
  return s;
}

// Close-up of a status bar on a device, switching from bars to SOS when its trigger fires.
function statusInsert(x, y, w, from, cls, o = {}) {
  const sc = w / 62;
  const a = signalGlyph(x, y, sc, from, o.col || C.ink);
  const b = signalGlyph(x, y, sc, o.to || 'sos', o.to === '3g' ? o.col || C.ink : o.sosCol || '#B3121F');
  return swap(a, b, cls);
}

/* ---- 70-audio.js ---- */
/* SOS ONLY — sound and haptics. Everything is synthesised with Web Audio: no audio files.
   Off by default; starts only after a tap. */

const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);

const Sound = {
  ac: null, master: null, beds: {}, on: false, spec: {}, noise: null,

  setEnabled(v) {
    this.on = !!v;
    if (!this.on) { Object.keys(this.beds).forEach((k) => this.stopBed(k)); return; }
    this.unlock();
    this.bed(this.spec);
  },

  // Create/resume the context. Must run inside a user gesture the first time.
  unlock() {
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.75;
      this.master.connect(this.ac.destination);
      const len = this.ac.sampleRate * 2;
      this.noise = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ac.state === 'suspended') this.ac.resume();
  },

  suspend(h) {
    if (!this.ac) return;
    if (h) this.ac.suspend(); else if (this.on) this.ac.resume();
  },

  now() { return this.ac.currentTime; },

  gain(v, to) { const g = this.ac.createGain(); g.gain.value = v; if (to) g.connect(to); return g; },

  osc(type, f, to) { const o = this.ac.createOscillator(); o.type = type; o.frequency.value = f; if (to) o.connect(to); return o; },

  noiseSrc(to) { const s = this.ac.createBufferSource(); s.buffer = this.noise; s.loop = true; if (to) s.connect(to); return s; },

  filt(type, f, q, to) { const b = this.ac.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; if (to) b.connect(to); return b; },

  // telephone band: 300–3,400 Hz, so the music always sounds like hold music
  phoneBand(to) { const lo = this.filt('lowpass', 3400, 0.7, to); return this.filt('highpass', 300, 0.7, lo); },

  env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },

  tone(f, t, dur, o = {}) {
    const g = this.gain(0.0001, o.to || this.master);
    const s = this.osc(o.type || 'sine', f, g);
    this.env(g, t, o.a || 0.01, o.v || 0.2, dur);
    s.start(t); s.stop(t + (o.a || 0.01) + dur + 0.05);
    return s;
  },

  /* ---- beds: long-running ambiences, crossfaded on and off ---- */

  bed(spec) {
    this.spec = spec || {};
    if (!this.on || !this.ac) return;
    for (const k of ['hum', 'rain', 'hold', 'store', 'birds', 'waves', 'voice']) {
      if (this.spec[k] && !this.beds[k]) this.startBed(k);
      if (!this.spec[k] && this.beds[k]) this.stopBed(k);
    }
  },

  startBed(k) {
    const out = this.gain(0.0001, this.master), t = this.now();
    const vol = { hum: 0.05, rain: 0.16, hold: 0.22, store: 0.16, birds: 0.12, waves: 0.18, voice: 1 }[k];
    out.gain.exponentialRampToValueAtTime(vol, t + 0.8);
    const bed = { out, nodes: [], timer: 0 };
    if (k === 'hum') {
      [[50, 1], [100, 0.5], [150, 0.18]].forEach(([f, v]) => { const g = this.gain(v, out); const o = this.osc('sine', f, g); o.start(); bed.nodes.push(o); });
    } else if (k === 'rain') {
      const hp = this.filt('highpass', 400, 0.5, out), lp = this.filt('lowpass', 2600, 0.5, hp);
      const s = this.noiseSrc(lp); s.start(); bed.nodes.push(s);
    } else if (k === 'waves') {
      const lp = this.filt('lowpass', 500, 0.6, out);
      const g = this.gain(0.5, lp), s = this.noiseSrc(g);
      const lfo = this.osc('sine', 0.12), lg = this.gain(0.45); lfo.connect(lg); lg.connect(g.gain);
      s.start(); lfo.start(); bed.nodes.push(s, lfo);
    } else if (k === 'birds') {
      const chirp = () => {
        const t0 = this.now() + 0.05, n2 = 2 + Math.floor(Math.random() * 3), base = 2400 + Math.random() * 1600;
        for (let i = 0; i < n2; i++) {
          const g = this.gain(0.0001, out), o = this.osc('sine', base, g), tt = t0 + i * 0.12;
          o.frequency.setValueAtTime(base, tt); o.frequency.exponentialRampToValueAtTime(base * 1.5, tt + 0.07);
          this.env(g, tt, 0.01, 0.5, 0.08); o.start(tt); o.stop(tt + 0.12);
        }
        bed.timer = setTimeout(chirp, 700 + Math.random() * 2200);
      };
      chirp();
    } else if (k === 'hold') this.holdMusic(bed, this.phoneBand(out));
    else if (k === 'store') this.storeRiff(bed, out);
    else if (k === 'voice') this.choppedVoice(bed);
    this.beds[k] = bed;
  },

  stopBed(k, fast) {
    const b = this.beds[k];
    if (!b) return;
    delete this.beds[k];
    clearTimeout(b.timer); clearInterval(b.timer);
    if (b.stop) b.stop();
    const t = this.now();
    b.out.gain.cancelScheduledValues(t);
    b.out.gain.setValueAtTime(b.out.gain.value, t);
    b.out.gain.exponentialRampToValueAtTime(0.0001, t + (fast ? 0.03 : 0.6));
    setTimeout(() => { b.nodes.forEach((x) => { try { x.stop(); } catch (e) { /* already stopped */ } }); b.out.disconnect(); }, fast ? 100 : 800);
  },

  // Chase's track: an original eight-bar minor loop.
  holdMusic(bed, out) {
    const bpm = 86, beat = 60 / bpm;
    const chords = [[57, 60, 64], [57, 60, 64], [53, 57, 60], [53, 57, 60], [52, 55, 60], [55, 59, 62], [50, 53, 57], [52, 56, 59]];
    const mel = [69, 72, 76, 74, 72, 71, 69, 64, 65, 69, 72, 69, 65, 64, 65, 69, 67, 72, 76, 72, 74, 71, 67, 71, 69, 65, 62, 65, 64, 68, 71, 76];
    let step = 0, next = this.now() + 0.1;
    const sched = () => {
      while (next < this.now() + 0.3) {
        const bar = Math.floor(step / 8) % 8, e = step % 8, ch = chords[bar];
        // arpeggio in eighths
        this.tone(midi(ch[e % 3] + 12), next, beat * 0.45, { type: 'square', v: 0.05, to: out });
        // bass on 1 and 3
        if (e === 0 || e === 4) this.tone(midi(ch[0] - 12), next, beat * 1.6, { type: 'triangle', v: 0.22, to: out });
        // melody on the beat
        if (e % 2 === 0) this.tone(midi(mel[(bar * 4 + e / 2) % mel.length]), next, beat * 0.9, { type: 'triangle', v: 0.16, a: 0.02, to: out });
        next += beat / 2;
        step++;
      }
    };
    sched();
    bed.timer = setInterval(sched, 60);
  },

  // A generic synthesised rock riff for the in-store music. Never a real recording.
  storeRiff(bed, out) {
    const bpm = 124, e8 = 60 / bpm / 2;
    const shaper = this.ac.createWaveShaper();
    const curve = new Float32Array(512);
    for (let i = 0; i < 512; i++) { const x = i / 256 - 1; curve[i] = Math.tanh(x * 4); }
    shaper.curve = curve; shaper.connect(out);
    const riff = [40, 40, 43, 40, 45, 40, 43, 38];
    let step = 0, next = this.now() + 0.05;
    const sched = () => {
      while (next < this.now() + 0.3) {
        const r = riff[step % 8];
        [0, 7, 12].forEach((iv) => this.tone(midi(r + iv), next, e8 * 0.8, { type: 'sawtooth', v: 0.08, to: shaper }));
        if (step % 4 === 0) this.kick(next, out);
        if (step % 4 === 2) this.snare(next, out);
        next += e8; step++;
      }
    };
    sched();
    bed.timer = setInterval(sched, 60);
  },

  kick(t, out) {
    const g = this.gain(0.0001, out), o = this.osc('sine', 120, g);
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.15);
    this.env(g, t, 0.005, 0.9, 0.2); o.start(t); o.stop(t + 0.3);
  },

  snare(t, out) {
    const g = this.gain(0.0001, out), f = this.filt('bandpass', 1800, 0.8, g), s = this.noiseSrc(f);
    this.env(g, t, 0.003, 0.5, 0.14); s.start(t); s.stop(t + 0.2);
  },

  // Chase's voice, chopped like a sample. Speech synthesis where it exists; silently skipped otherwise.
  choppedVoice(bed) {
    if (!('speechSynthesis' in window)) return;
    const parts = ['Thank', 'thank you for', 'for hol', 'holding.'];
    let i = 0;
    const say = () => {
      const u = new SpeechSynthesisUtterance(parts[i++ % parts.length]);
      u.rate = 0.85; u.pitch = 0.6; u.volume = 0.5;
      speechSynthesis.speak(u);
      bed.timer = setTimeout(say, i % parts.length === 0 ? 5200 : 700);
    };
    bed.timer = setTimeout(say, 1200);
    bed.stop = () => { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } };
  },

  /* ---- one-shot effects ---- */

  sfx(name, o = {}) {
    if (!this.on || !this.ac) return;
    const t = this.now() + (o.delay || 0);
    let out = this.master;
    if (o.pan && this.ac.createStereoPanner) { const p = this.ac.createStereoPanner(); p.pan.value = o.pan; p.connect(this.master); out = p; }
    const v = o.v || 1;
    switch (name) {
      case 'beep': this.tone(2600, t, 0.07, { type: 'square', v: 0.08 * v, to: out }); break;
      case 'bigbeep': this.tone(2400, t, 0.5, { type: 'square', v: 0.07 * v, to: out }); this.tone(1200, t, 0.6, { type: 'sine', v: 0.08 * v, to: out }); break;
      case 'chime': // the queue chime: two descending tones — the Hold's motif
        [[659.3, 0], [523.3, 0.55]].forEach(([f, dt]) => { this.tone(f, t + dt, 1.1, { v: 0.22 * v, to: out }); this.tone(f * 2, t + dt, 0.6, { v: 0.05 * v, to: out }); });
        break;
      case 'ring': {
        const g = this.gain(0.0001, out);
        const a = this.osc('sine', 400, g), b = this.osc('sine', 450, g);
        const am = this.gain(0.5); const lfo = this.osc('square', 25); lfo.connect(am); am.connect(g.gain);
        [[0, 0.4], [0.6, 1.0]].forEach(([s0, s1]) => { g.gain.setValueAtTime(0.0001, t + s0); g.gain.linearRampToValueAtTime(0.09 * v, t + s0 + 0.02); g.gain.setValueAtTime(0.09 * v, t + s1 - 0.02); g.gain.linearRampToValueAtTime(0.0001, t + s1); });
        [a, b, lfo].forEach((x) => { x.start(t); x.stop(t + 1.1); });
        break;
      }
      case 'chorus': // every demo phone at once
        for (let i = 0; i < 6; i++) this.sfx('ring', { delay: (o.delay || 0) + i * 0.13, pan: (i / 5) * 2 - 1, v: 0.6 });
        break;
      case 'dial': {
        const g = this.gain(0.0001, out), a = this.osc('sine', 425, g);
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.08 * v, t + 0.05); g.gain.setValueAtTime(0.08 * v, t + (o.dur || 2)); g.gain.linearRampToValueAtTime(0.0001, t + (o.dur || 2) + 0.1);
        a.start(t); a.stop(t + (o.dur || 2) + 0.2);
        break;
      }
      case 'thump': {
        const g = this.gain(0.0001, out), s = this.osc('sine', 90, g);
        s.frequency.setValueAtTime(90, t); s.frequency.exponentialRampToValueAtTime(38, t + 0.2);
        this.env(g, t, 0.005, 0.8 * v, 0.28); s.start(t); s.stop(t + 0.4);
        break;
      }
      case 'heartbeat': this.sfx('thump', { delay: o.delay, v: 0.7 }); this.sfx('thump', { delay: (o.delay || 0) + 0.22, v: 0.5 }); break;
      case 'shred': case 'door': case 'static': case 'print': {
        const dur = { shred: 0.9, door: 1.6, static: 0.35, print: 0.8 }[name];
        const g = this.gain(0.0001, out), f = this.filt('bandpass', name === 'door' ? 500 : name === 'print' ? 3000 : 1400, 0.9, g), s = this.noiseSrc(f);
        const am = this.gain(0.5), lfo = this.osc('square', name === 'door' ? 14 : name === 'print' ? 30 : 60); lfo.connect(am); am.connect(g.gain);
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.18 * v, t + 0.03); g.gain.setValueAtTime(0.18 * v, t + dur - 0.1); g.gain.linearRampToValueAtTime(0.0001, t + dur);
        s.start(t); lfo.start(t); s.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
        break;
      }
      case 'bell': [[2093, 0.22], [4186, 0.06], [5588, 0.03]].forEach(([f, vv]) => this.tone(f, t, 1.4, { v: vv * v, to: out })); break;
      case 'stutter': for (let i = 0; i < 6; i++) this.tone(300 + Math.random() * 600, t + i * 0.07, 0.04, { type: 'square', v: 0.06 * v, to: out }); break;
      case 'note': this.tone(midi(o.m || 69), t, 0.5, { type: 'triangle', v: 0.12 * v, to: this.phoneBand(out) }); break;
    }
  },

  // Sudden total silence: the silence is the scare.
  silence(ms) {
    if (!this.ac) return;
    const t = this.now(), g = this.master.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(0.0001, t);
    g.setValueAtTime(0.0001, t + ms / 1000); g.linearRampToValueAtTime(0.75, t + ms / 1000 + 0.05);
  },

  cut(k) { this.stopBed(k, true); if (this.spec) this.spec = Object.assign({}, this.spec, { [k]: false }); },
};

/* ---------- haptics (Android; silently nothing elsewhere) ---------- */

const HAPTIC = {
  ring: [320, 180, 320], heartbeat: [70, 140, 100], thump: [90, 120, 90], stutter: [30, 40, 30, 40, 30, 40, 30],
  bell: [28], tap: [18],
};
function haptic(name) {
  if (!navigator.vibrate || (navigator.userActivation && !navigator.userActivation.hasBeenActive)) return;
  if (!Save.d.settings.sound && reducedMotion()) return;
  try { navigator.vibrate(HAPTIC[name] || 20); } catch (e) { /* ignore */ }
}

/* SOS ONLY — the reader: layout modes, mounting, guided view, controls, UI chrome, triggers. */

const LAST = 27; // 0 = check-in, 1..26 = story pages, 27 = end screen

const GUTTER = { white: C.paper, grey: C.gutterGrey, black: C.ink, warm: '#FFF4E0', whitegrey: 'url(#gGutWG)', greyblack: 'url(#gGutGB)' };
const OG_URL = '../';

const Bus = {
  h: {},
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); },
  off(e, f) { this.h[e] = (this.h[e] || []).filter((x) => x !== f); },
  emit(e, a) { (this.h[e] || []).slice().forEach((f) => { try { f(a); } catch (err) { console.error(err); } }); },

const Reader = {
  idx: 0, stop: 0, mode: null, full: false, leaves: [], vb: null, lockUntil: 0, dragging: false,
  hiddenTitle: null, titleBase: 'SOS ONLY — Optus Redcliffe',
  sess: { start: Date.now(), leftAt: null, awayCount: 0 },

/* ---------- layout ---------- */

function pickMode() {
  const m = Save.d.settings.mode;
  if (m && m !== 'auto') return m;
  const a = innerWidth / innerHeight;
  return a < 0.7 ? 'guided' : a <= 1.2 ? 'page' : 'spread';
}

function sizeBook() {
  const app = $('#app'), m = Reader.mode;
  const H = innerHeight, W = innerWidth - (Save.d.settings.transcript && innerWidth >= 820 && m !== 'guided' ? Math.min(380, innerWidth * 0.92) : 0);
  let lw, lh;
  if (m === 'spread') { lh = Math.min(H * 0.95, W * 0.97 * 0.75); lw = (lh * 2) / 3; }
  else if (m === 'page') { lh = Math.min(H * 0.975, W * 0.98 * 1.5); lw = (lh * 2) / 3; }
  else { lw = W; lh = H; }
  app.style.setProperty('--lw', `${lw}px`);
  app.style.setProperty('--lh', `${lh}px`);
  // HTML leaves (check-in, end) keep 2:3 and scale with --u
  const sw = m === 'guided' ? Math.min(W, H / 1.5) : lw;
  app.style.setProperty('--sw', `${sw}px`);
  app.style.setProperty('--u', `${sw / 1000}px`);
  app.dataset.mode = m;
  debugInfo();
}

/* ---------- rendering a story page ---------- */

function renderPage(num, env) {
  const P = PAGES[num];
  _uid = 0;
  _uidPrefix = `${P.id}-`;
  _ollieShift = Math.min(3, Math.max(0, (Save.d.visits || 1) - 1)) * 14;
  const pg = makePG(P, env);
  let body = '';
  try { body = P.render(pg); } catch (e) {
    console.error(`page ${num}`, e);
    body = R(0, 0, 1000, 1500, C.ink) + Tx(500, 750, `PAGE ${num} — PLEASE HOLD`, 40, C.y, 'text-anchor="middle"');
  }
  const bg = GUTTER[P.gutter] || P.gutter || C.ink;
  const folioCol = /black|grey/.test(P.gutter) && P.gutter !== 'whitegrey' ? '#8A8A86' : '#6A665C';
  const label = `Page ${num}: ${P.title}. ${P.alt || ''}`;
  const svg = `<svg class="page pg-${P.id}" viewBox="0 0 1000 1500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(label)}">` +
    `<rect class="pgbg" x="-3000" y="-3000" width="7000" height="7500" fill="${bg.startsWith('url') ? (P.gutter === 'whitegrey' ? C.gutterGrey : C.ink) : bg}"/>` +
    (bg.startsWith('url') ? `<rect width="1000" height="1500" fill="${bg}"/>` : '') +
    body +
    `<rect width="1000" height="1500" fill="url(#grain)" opacity="${P.gutter === 'black' ? 0.35 : 0.6}" pointer-events="none"/>` +
    `<text class="ft-x folio" x="${P.side === 'left' ? 34 : 966}" y="1490" font-size="20" fill="${folioCol}" text-anchor="middle">${num}</text>` +
    `<path class="gmask" fill="${C.ink}" fill-rule="evenodd" d="" pointer-events="none"/>` +
    `</svg>`;
  return { svg, pg };
}

/* ---------- guided view: animating the SVG viewBox between focus rectangles ---------- */

function leafSize() { const r = $('#book').getBoundingClientRect(); return [innerWidth, innerHeight, r]; }

function fitVB(f, pad = 14) {
  const [W, H] = leafSize();
  const A = W / H;
  let [x, y, w, h] = [f[0] - pad, f[1] - pad, f[2] + pad * 2, f[3] + pad * 2];
  if (w / h > A) { const nh = w / A; y -= (nh - h) / 2; h = nh; } else { const nw = h * A; x -= (nw - w) / 2; w = nw; }
  return [x, y, w, h];
}

function maskPath(f) {
  if (!f) return '';
  const [x, y, w, h] = f;
  return `M-5000 -5000H6000V6500H-5000Z M${n(x)} ${n(y)}h${n(w)}v${n(h)}h${n(-w)}Z`;
}

let _vbAnim = 0;
function animateVB(svg, from, to, dur, mask) {
  cancelAnimationFrame(_vbAnim);
  const m = svg.querySelector('.gmask');
  const set = (v, f) => { svg.setAttribute('viewBox', v.map(n).join(' ')); Reader.vb = v; if (m) m.setAttribute('d', maskPath(f)); };
  if (!from || dur <= 0 || reducedMotion()) { set(to, mask); return; }
  const t0 = performance.now();
  const fromMask = Reader.mask || mask;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const step = (now) => {
    const t = clamp((now - t0) / dur, 0, 1), e = ease(t);
    const v = from.map((a, i) => lerp(a, to[i], e));
    const mk = mask && fromMask ? fromMask.map((a, i) => lerp(a, mask[i], e)) : mask;
    set(v, mk);
    if (t < 1) _vbAnim = requestAnimationFrame(step);
  };
  _vbAnim = requestAnimationFrame(step);
  Reader.mask = mask;
}

const MOVE_MS = { cut: 0, glide: 380, creep: 1500, unfold: 1200 };

function buildStops(pg) {
  const out = [];
  const [W, H] = leafSize();
  for (const p of pg.panels) {
    const b = pg.bbox[p.id] || p.box;
    if (p.guided) { p.guided.forEach((g) => out.push(Object.assign({ p: p.id, move: 'glide' }, g, { focus: g.focus || b }))); continue; }
    // split wide panels so lettering stays at least ~13 CSS px
    const [x, y, w, h] = b;
    const sc = Math.min(W / (w + 28), H / (h + 28));
    const k = Math.min(3, Math.max(1, Math.ceil(0.46 / sc - 0.05)));
    if (k === 1 || w < h * 0.9) { out.push({ p: p.id, focus: b, move: 'glide' }); continue; }
    const seg = w / k;
    for (let i = 0; i < k; i++) out.push({ p: p.id, focus: [x + seg * i - (i ? seg * 0.08 : 0), y, seg * (i ? 1.08 : 1.04), h], move: 'glide' });
  }
  return out;
}

function revealBalloons(L, upto) {
  const ids = [];
  for (const s of L.stops.slice(0, upto + 1)) if (!ids.includes(s.p)) ids.push(s.p);
  let j = 0;
  L.svg.querySelectorAll('.bl').forEach((b) => {
    const on = ids.includes(b.dataset.p);
    if (on && !b.classList.contains('on')) { b.style.setProperty('--j', j++); b.classList.add('on'); }
    if (!on) b.classList.remove('on');
  });
}

function goStop(k, o = {}) {
  const L = Reader.leaves[0];
  if (!L || !L.stops || !L.stops.length) return;
  k = clamp(k, 0, L.stops.length - 1);
  Reader.stop = k;
  Reader.full = false;
  const s = L.stops[k];
  const vb = fitVB(s.focus);
  const from = o.from || Reader.vb;
  animateVB(L.svg, from, vb, o.move ? MOVE_MS[o.move] : MOVE_MS[s.move] ?? 380, s.focus.map((v, i) => v + (i < 2 ? -6 : 12)));
  revealBalloons(L, k);
  if (s.lock) Reader.lockUntil = Date.now() + s.lock;
  if (!o.silent) L.ctx && L.ctx._panel(s.p);
  progress();
  debugInfo();
}

function guidedFull(on) {
  const L = Reader.leaves[0];
  if (!L || !L.svg) return;
  Reader.full = on;
  if (on) {
    animateVB(L.svg, Reader.vb, fitVB([0, 0, 1000, 1500], 0), 380, null);
    L.svg.querySelectorAll('.bl').forEach((b) => b.classList.add('on'));
  } else goStop(Reader.stop);
}

/* ---------- per-page context: timers, triggers and effects all clean up on unmount ---------- */

function makeCtx(i, el, svg, pg, o) {
  const timers = [], cleanups = [], panelCbs = {}, firedPanels = new Set();
  const ctx = {
    num: i, el, svg, pg, mode: Reader.mode, dead: false,
    reduced: reducedMotion(), revisit: pg.revisit, visits: Save.d.visits, second: Save.d.finished || Save.d.visits > 1,
    layoutFrom: o.fromMode || null, save: Save.d, name: NAME(), hasName: hasName(),
    sess: Reader.sess, aspect: innerWidth / innerHeight,
    persist: () => Save.write(),
    q: (s) => svg.querySelector(s), qa: (s) => [...svg.querySelectorAll(s)],
    after(ms, fn) { const t = setTimeout(() => !ctx.dead && fn(), ms); timers.push(() => clearTimeout(t)); return t; },
    every(ms, fn) { const t = setInterval(() => !ctx.dead && fn(), ms); timers.push(() => clearInterval(t)); return t; },
    // fires after the reader has spent `ms` on the page with it visible (pauses when the tab is hidden)
    dwell(ms, fn) {
      let acc = 0, last = performance.now();
      const t = setInterval(() => {
        const now = performance.now();
        if (!document.hidden) acc += now - last;
        last = now;
        if (acc >= ms) { clearInterval(t); if (!ctx.dead) fn(); }
      }, 200);
      timers.push(() => clearInterval(t));
    },
    raf(fn) {
      let id = 0;
      const loop = (t) => { if (ctx.dead || fn(t) === false) return; id = requestAnimationFrame(loop); };
      id = requestAnimationFrame(loop);
      timers.push(() => cancelAnimationFrame(id));
    },
    on(evt, fn) { Bus.on(evt, fn); cleanups.push(() => Bus.off(evt, fn)); },
    // Run fn when panel p is reached: in guided view when its stop is shown, otherwise `delay` ms after mount.
    onPanel(p, fn, delay = 0) {
      if (Reader.mode === 'guided') (panelCbs[p] = panelCbs[p] || []).push(fn);
      else ctx.after(delay, fn);
    },
    _panel(p) { if (firedPanels.has(p)) return; firedPanels.add(p); (panelCbs[p] || []).forEach((f) => f()); },
    onTap(sel, fn) { ctx._taps.push([sel, fn]); },
    _taps: [],
    // press-and-hold on an element
    onHold(sel, down, up) {
      svg.querySelectorAll(sel).forEach((t) => {
        t.setAttribute('data-hot', 'hold');
        const d = (e) => { e.preventDefault(); down(e); const u = () => { up(); removeEventListener('pointerup', u); removeEventListener('pointercancel', u); }; addEventListener('pointerup', u); addEventListener('pointercancel', u); };
        t.addEventListener('pointerdown', d);
        cleanups.push(() => t.removeEventListener('pointerdown', d));
      });
    },
    // drag across an element; fn receives page coordinates
    onDrag(sel, fn, end) {
      svg.querySelectorAll(sel).forEach((t) => {
        t.setAttribute('data-hot', 'drag');
        const d = (e) => {
          e.preventDefault();
          Reader.dragging = true;
          try { t.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
          fn(ctx.toPage(e.clientX, e.clientY), e);
          const mv = (ev) => fn(ctx.toPage(ev.clientX, ev.clientY), ev);
          const up = () => { t.removeEventListener('pointermove', mv); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up); setTimeout(() => (Reader.dragging = false), 0); end && end(); };
          t.addEventListener('pointermove', mv); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
        };
        t.addEventListener('pointerdown', d);
        cleanups.push(() => t.removeEventListener('pointerdown', d));
      });
    },
    // continuous pointer / tilt input, normalised -1..1 around the page centre
    onPointer(fn) { ctx.on('pointer', (p) => { if (p.leaf === undefined || p.leaf === el || Reader.mode !== 'spread') fn(p.nx, p.ny, p); }); },
    toPage(cx, cy) {
      const m = svg.getScreenCTM();
      if (!m) return [500, 750];
      const p = new DOMPoint(cx, cy).matrixTransform(m.inverse());
      return [p.x, p.y];
    },
    sfx: (name, o2) => Sound.sfx(name, o2),
    bed: (spec) => Sound.bed(spec),
    haptic: (name) => haptic(name),
    status: (k) => setStatus(k),
    ticket: (k) => ticketState(k),
    setHiddenTitle: (t) => { Reader.hiddenTitle = t; cleanups.push(() => (Reader.hiddenTitle = null)); },
    next: () => next(),
    stopIndex: () => Reader.stop,
    isLastStop: () => Reader.mode !== 'guided' || !Reader.leaves[0] || Reader.stop >= (Reader.leaves[0].stops || []).length - 1,
    _cleanup() { ctx.dead = true; timers.forEach((f) => f()); cleanups.forEach((f) => f()); },
  };
  return ctx;
}

/* ---------- mounting ---------- */

function unmountAll() {
  for (const L of Reader.leaves) {
    try { L.ctx && L.ctx._cleanup(); } catch (e) { console.error(e); }
    try { L.unmount && L.unmount(); } catch (e) { console.error(e); }
    L.el.remove();
  }
  Reader.leaves = [];
}

function mountLeaf(i, side, o) {
  const kind = leafKind(i);
  const el = document.createElement('div');
  el.className = `leaf leaf-${kind} ${side}`;
  const L = { i, el, kind };
  $('#book').append(el);
  if (kind === 'page' && !Save.d.checkedIn) {
    // a closed roller door until the reader has taken a ticket
    el.innerHTML = '<div class="shutter closed"><span>PLEASE TAKE A TICKET</span></div>';
    Reader.leaves.push(L);
    return L;
  }
  if (kind === 'page') {
    const P = PAGES[i];
    if (!P) { el.innerHTML = `<div class="missing">Page ${i}<br>Please hold…</div>`; Reader.leaves.push(L); return L; }
    const env = { mode: Reader.mode, revisit: Save.d.pagesSeen.includes(i) };
    const { svg, pg } = renderPage(i, env);
    el.innerHTML = svg;
    L.svg = el.firstElementChild;
    L.pg = pg;
    L.stops = Reader.mode === 'guided' ? buildStops(pg) : null;
    if (!o.noEnter) el.classList.add('enter');
    L.ctx = makeCtx(i, el, L.svg, pg, o);
    Reader.leaves.push(L);
    // page scripts run after the chrome has been set for this view (see show)
    L.start = () => { try { P.mount && P.mount(L.ctx); } catch (e) { console.error(`mount ${i}`, e); } };
  } else {
    Reader.leaves.push(L);
    try { L.unmount = (kind === 'checkin' ? buildCheckin : buildEnd)(el, o); } catch (e) { console.error(e); }
  }
  return L;
}

function show(o = {}) {
  unmountAll();
  const book = $('#book');
  const ids = Reader.mode === 'spread' ? [Reader.idx - (Reader.idx % 2), Reader.idx - (Reader.idx % 2) + 1] : [Reader.idx];
  if (Reader.mode === 'spread') Reader.idx = ids[0];
  book.className = `mode-${Reader.mode}${o.turn ? ' turning' : ''}`;
  ids.forEach((i, k) => mountLeaf(i, Reader.mode === 'spread' ? (k ? 'right' : 'left') : 'single', o));
  if (o.turn) setTimeout(() => book.classList.remove('turning'), 400);

  if (Reader.mode === 'guided') {
    const L = Reader.leaves[0];
    Reader.mask = null;
    if (L.svg && L.stops && L.stops.length) {
      const start = o.fromEnd ? L.stops.length - 1 : 0;
      goStop(start, { from: o.fromVB || null, move: o.fromVB ? 'glide' : 'cut', silent: true });
      Reader._firstStop = L.stops[start].p;
    }
  } else if (o.fromVB && Reader.leaves.length) {
    // Unfold: start zoomed on the panel the reader was on, then open out to the whole page.
    const L = Reader.leaves.find((x) => x.i === o.fromLeaf) || Reader.leaves[0];
    if (L.svg) {
      const full = [0, 0, 1000, 1500];
      const r = L.el.getBoundingClientRect(), A = r.width / r.height;
      let [x, y, w, h] = o.fromFocus || o.fromVB;
      if (w / h > A) { const nh = w / A; y -= (nh - h) / 2; h = nh; } else { const nw = h * A; x -= (nw - w) / 2; w = nw; }
      animateVB(L.svg, [x, y, w, h], full, MOVE_MS.unfold, null);
    }
  }
  chrome();
  for (const L of Reader.leaves) if (L.start) L.start();
  // in guided view, the opening stop's panel triggers once the page script is listening
  if (Reader.mode === 'guided' && Reader._firstStop && Reader.leaves[0] && Reader.leaves[0].ctx) {
    const L = Reader.leaves[0], p = Reader._firstStop;
    Reader._firstStop = null;
    L.stops.slice(0, Reader.stop + 1).forEach((st) => L.ctx._panel(st.p));
    void p;
  }
  Bus.emit('show', ids);
}

/* ---------- navigation ---------- */

function canLeaveCheckin() { return Save.d.checkedIn; }

function goLeaf(i, o = {}) {
  i = clamp(i, 0, LAST);
  if (i > 0 && !canLeaveCheckin()) { nudgeCheckin(); return; }
  Reader.idx = i;
  Reader.stop = 0;
  show(Object.assign({ turn: true }, o));
}

function next() {
  if (Date.now() < Reader.lockUntil) return;
  if (Reader.mode === 'guided') {
    const L = Reader.leaves[0];
    if (Reader.full) { guidedFull(false); return; }
    if (L && L.stops && Reader.stop < L.stops.length - 1) { goStop(Reader.stop + 1); return; }
  }
  if (Reader.mode === 'spread') goLeaf(Reader.idx - (Reader.idx % 2) + 2);
  else goLeaf(Reader.idx + 1);
}

function prev() {
  if (Reader.mode === 'guided') {
    if (Reader.full) { guidedFull(false); return; }
    if (Reader.stop > 0) { goStop(Reader.stop - 1); return; }
    if (Reader.idx > 0) goLeaf(Reader.idx - 1, { fromEnd: true });
    return;
  }
  if (Reader.mode === 'spread') goLeaf(Reader.idx - (Reader.idx % 2) - 2);
  else goLeaf(Reader.idx - 1);
}

function setMode(m, o = {}) {
  if (m === Reader.mode && !o.force) { sizeBook(); return; }
  const from = Reader.mode;
  const fromVB = Reader.vb && from === 'guided' ? Reader.vb.slice() : null;
  const L = Reader.leaves[0];
  const fromFocus = from === 'guided' && L && L.stops && L.stops[Reader.stop] ? L.stops[Reader.stop].focus : null;
  Reader.mode = m;
  Reader.vb = null;
  sizeBook();
  show({ fromMode: from, fromVB, fromFocus, fromLeaf: Reader.idx, noEnter: !!fromVB });
  Bus.emit('layoutChange', { from, to: m });
}

/* ---------- chrome: status icon, favicon, ticket, progress, title, transcript ---------- */

const STATUS_LABEL = { bars: '4G', '3g': '3G', sos: 'SOS only', full: '5G' };
function setStatus(k) {
  const el = $('#status');
  if (el.dataset.k === k) return;
  el.dataset.k = k;
  const bars = { bars: 4, '3g': 2, sos: 0, full: 4 }[k] ?? 4;
  el.innerHTML = `<span class="sb">${[1, 2, 3, 4].map((b) => `<i class="${b <= bars ? 'on' : ''}" style="height:${b * 25}%"></i>`).join('')}</span><span class="sl">${STATUS_LABEL[k] || ''}</span>`;
  setFavicon(k === 'sos' ? 'sos' : 'bars');
}

function setFavicon(k) {
  const svg = k === 'sos'
    ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#0E0E10"/><text x="32" y="42" font-family="Arial Black,Arial" font-weight="900" font-size="24" fill="#FFCD00" text-anchor="middle">SOS</text></svg>`
    : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#FFCD00"/>${[0, 1, 2, 3].map((i) => `<rect x="${10 + i * 12}" y="${46 - (i + 1) * 9}" width="8" height="${(i + 1) * 9}" rx="1.5" fill="#0E0E10"/>`).join('')}</svg>`;
  $('#favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
}

function setTitle(t) { document.title = t; }

function ticketState(k) {
  const t = $('#ticket');
  t.classList.remove('gone', 'back', 'pulse', 'rot1', 'rot2');
  if (k === 'hide') t.classList.add('gone');
  else if (k === 'back') t.classList.add('back');
  else if (k === 'pulse') {
    t.classList.add('pulse');
    t.style.setProperty('--pd', `${-(Date.now() % 1600) / 1000}s`);
  } else if (k) t.classList.add(k);
}

function progress() {
  let f = Reader.idx / LAST;
  const L = Reader.leaves[0];
  if (Reader.mode === 'guided' && L && L.stops && L.stops.length) f += (Reader.stop / L.stops.length) / LAST;
  $('#pfill').style.width = `${(f * 100).toFixed(2)}%`;
}

function chrome() {
  const ids = Reader.leaves.map((L) => L.i);
  const last = ids[ids.length - 1];
  const P = PAGES[last];
  const app = $('#app');
  // status & favicon
  setStatus(last === 0 ? 'bars' : last === LAST ? 'sos' : (P && P.status) || 'sos');
  // title
  Reader.titleBase = last === LAST ? 'Please hold…' : 'SOS ONLY — Optus Redcliffe';
  if (!document.hidden) setTitle(Reader.titleBase);
  // ticket
  $('#ticket').hidden = !Save.d.checkedIn;
  ticketState(null);
  // UI rot staging (§10): 19–22 the UI decays, 23 is clean, 24–26 it's back worse.
  const rotLevel = last >= 19 && last <= 22 ? 1 : last >= 24 && last <= 26 ? 2 : 0;
  app.dataset.rot = rotLevel;
  if (rotLevel) ticketState(rotLevel === 1 ? 'rot1' : 'rot2');
  // bleed margins in page mode
  const bleedSrc = PAGES[Reader.idx] || P;
  app.dataset.bleed = Reader.idx === 0 ? 'checkin' : Reader.idx === LAST ? 'end' : (bleedSrc && (bleedSrc.bleed || bleedSrc.gutter)) || 'black';
  // gutter colour of the whole viewport in guided mode
  const gk = (PAGES[Reader.idx] || {}).gutter;
  app.style.setProperty('--gut', gk === 'whitegrey' ? C.gutterGrey : gk === 'greyblack' ? '#202022' : GUTTER[gk] || C.ink);
  progress();
  // saved progress
  let changed = false;
  for (const i of ids) if (i > 0 && i < LAST && !Save.d.pagesSeen.includes(i)) { Save.d.pagesSeen.push(i); changed = true; }
  if (last >= 1 && last < LAST) { Save.d.lastPage = Reader.idx; changed = true; }
  if (last === LAST && !Save.d.finished) { Save.d.finished = true; changed = true; }
  Save.d.lastActive = Date.now();
  changed = true;
  if (changed) Save.write();
  // sound beds follow the right-hand page
  const snd = (P && P.sound) || (last === 0 ? {} : last === LAST ? { hold: true } : {});
  Sound.bed(snd);
  renderTranscript();
  debugInfo();
}

function renderTranscript() {
  const box = $('#transcript');
  const on = !!Save.d.settings.transcript;
  box.hidden = !on;
  const app = $('#app');
  if (app.classList.contains('with-transcript') !== on) { app.classList.toggle('with-transcript', on); sizeBook(); }
  if (!on) return;
  let h = '<button class="tx-close" type="button" aria-label="Close transcript">×</button>';
  for (const L of Reader.leaves) {
    if (L.kind === 'checkin') { h += '<section><h2>Check-in</h2><p class="d">The store’s check-in tablet. Pop your name in, choose a reason for your visit, and take a ticket.</p></section>'; continue; }
    if (L.kind === 'end') { h += '<section><h2>End screen</h2><p class="d">A black call screen. Call 2, on hold: your reading time. Call 1, on hold: a year and counting. Your call is important to us. Please continue to hold.</p></section>'; continue; }
    const P = PAGES[L.i];
    if (!P || !L.pg) continue;
    h += `<section><h2>Page ${L.i} — ${esc(P.title)}</h2>${P.alt ? `<p class="d">${esc(P.alt)}</p>` : ''}`;
    for (const ln of L.pg.lines) {
      if (ln.desc) h += `<p class="d">${esc(ln.text)}</p>`;
      else h += `<p><b>${esc(ln.who || '…')}${ln.type === 'whisper' ? ' (whispering)' : ln.type === 'elec' ? ' (from a device)' : ''}:</b> ${esc(ln.text)}</p>`;
    }
    h += '</section>';
  }
  box.innerHTML = h;
  $('.tx-close', box).onclick = () => { Save.d.settings.transcript = false; Save.write(); renderTranscript(); };
}

/* ---------- menu (opens from the 07 ticket) ---------- */

function openMenu(open = true) {
  const m = $('#menu'), t = $('#ticket');
  m.hidden = !open;
  t.setAttribute('aria-expanded', String(open));
  if (!open) { t.focus({ preventScroll: true }); return; }
  const s = Save.d.settings;
  const seg = (key, opts) => `<div class="seg" role="group" aria-label="${key}">${opts.map(([v, l]) => `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${String(s[key]) === String(v)}">${l}</button>`).join('')}</div>`;
  m.innerHTML = `<div class="m-in">
    <div class="m-head"><span class="m-num">07</span><span>${esc(NAME())}<br><small>Reason: SOS ONLY</small></span><button type="button" class="m-x" aria-label="Close menu">×</button></div>
    <div class="m-row"><span>Sound</span>${seg('sound', [[true, 'On'], [false, 'Off']])}</div>
    <div class="m-row"><span>Motion</span>${seg('motion', [['auto', 'Auto'], ['on', 'Full'], ['off', 'Reduced']])}</div>
    <div class="m-row"><span>Tilt</span>${seg('tilt', [[true, 'On'], [false, 'Off']])}</div>
    <div class="m-row"><span>Transcript</span>${seg('transcript', [[true, 'On'], [false, 'Off']])}</div>
    <div class="m-row"><span>Layout</span>${seg('mode', [['auto', 'Auto'], ['guided', 'Guided'], ['page', 'Page'], ['spread', 'Spread']])}</div>
    <div class="m-row m-acts"><button type="button" class="m-restart">Back to page 1</button><button type="button" class="m-leave">Leave the queue</button></div>
    <div class="m-confirm" hidden><p>Nobody leaves the queue.</p><button type="button" class="m-yes">Reset everything</button><button type="button" class="m-no">Stay</button></div>
  </div>`;
  m.querySelectorAll('.seg button').forEach((b) => {
    b.onclick = async () => {
      const k = b.dataset.k;
      let v = b.dataset.v;
      if (v === 'true') v = true; else if (v === 'false') v = false;
      if (k === 'tilt' && v) v = await enableTilt();
      s[k] = v;
      Save.write();
      if (k === 'sound') { if (v) Sound.unlock(); Sound.setEnabled(v); chrome(); }
      if (k === 'motion') applyMotion();
      if (k === 'transcript') renderTranscript();
      if (k === 'mode') setMode(pickMode(), { force: true });
      if (k === 'motion') show({ noEnter: true });
      openMenu(true);
    };
  });
  $('.m-x', m).onclick = () => openMenu(false);
  $('.m-restart', m).onclick = () => { openMenu(false); goLeaf(1); };
  $('.m-leave', m).onclick = () => { $('.m-confirm', m).hidden = false; $('.m-yes', m).focus(); };
  $('.m-no', m).onclick = () => { $('.m-confirm', m).hidden = true; };
  $('.m-yes', m).onclick = () => { Save.reset(); openMenu(false); Reader.idx = 0; applyMotion(); show(); };
  $('.m-x', m).focus({ preventScroll: true });
}

/* ---------- input ---------- */

let _tilt = null;
async function enableTilt() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') return false;
    }
  } catch (e) { return false; }
  if (!_tilt) {
    _tilt = (e) => {
      if (!Save.d.settings.tilt || e.gamma == null) return;
      Bus.emit('pointer', { nx: clamp(e.gamma / 30, -1, 1), ny: clamp((e.beta - 40) / 30, -1, 1), tilt: true });
    };
    addEventListener('deviceorientation', _tilt);
  }
  return true;
}

function foundOllie(el) {
  el.classList.remove('blink');
  void el.getBBox;
  requestAnimationFrame(() => el.classList.add('blink'));
  setTimeout(() => el.classList.remove('blink'), 700);
  const L = Reader.leaves.find((x) => x.el.contains(el));
  if (L && !Save.d.olliesFound.includes(L.i)) { Save.d.olliesFound.push(L.i); Save.write(); }
}

function healBalloon(el) {
  el.classList.add('healed');
  clearTimeout(el._heal);
  el._heal = setTimeout(() => el.classList.remove('healed'), 2600);
}

function hotspot(target, e) {
  const hot = target.closest && target.closest('[data-hot]');
  for (const L of Reader.leaves) {
    if (!L.ctx || !L.el.contains(target)) continue;
    for (const [sel, fn] of L.ctx._taps) {
      const t = target.closest(sel);
      if (t && L.el.contains(t)) { fn(t, e); return true; }
    }
  }
  if (!hot) return false;
  const k = hot.dataset.hot;
  if (k === 'ollie') { foundOllie(hot); return true; }
  if (k === 'heal') { healBalloon(hot); return true; }
  return true; // holds and drags handle themselves
}

let _down = null, _lastTap = 0, _tapTimer = 0, _idle = 0;
function wakeUI() {
  const app = $('#app');
  app.classList.remove('idle');
  clearTimeout(_idle);
  _idle = setTimeout(() => { if ($('#menu').hidden) app.classList.add('idle'); }, 2000);
}

function bindInput() {
  const stage = $('#stage');
  stage.addEventListener('pointerdown', (e) => {
    _down = { x: e.clientX, y: e.clientY, t: Date.now(), target: e.target };
  });
  stage.addEventListener('pointerup', (e) => {
    wakeUI();
    const d = _down;
    _down = null;
    if (!d || Reader.dragging) return;
    if (e.target.closest && e.target.closest('.leaf-checkin, .leaf-end, input, button, a, label')) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y, dt = Date.now() - d.t;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 800) { dx < 0 ? next() : prev(); return; }
    if (Math.hypot(dx, dy) > 12 || dt > 650) return;
    if (hotspot(d.target, e)) return;
    const zone = e.clientX / innerWidth;
    const act = () => {
      if (zone < 1 / 3) prev();
      else if (zone > 2 / 3 || Reader.mode === 'guided') next();
    };
    if (Reader.mode === 'guided') {
      // double-tap toggles the full page; single taps wait a beat to tell the difference
      if (Date.now() - _lastTap < 300) { clearTimeout(_tapTimer); _lastTap = 0; guidedFull(!Reader.full); return; }
      _lastTap = Date.now();
      _tapTimer = setTimeout(act, 260);
    } else act();
  });
  addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse') wakeUI();
    const leaf = e.target.closest ? e.target.closest('.leaf') : null;
    const r = (leaf || $('#book')).getBoundingClientRect();
    Bus.emit('pointer', { nx: clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1.5, 1.5), ny: clamp(((e.clientY - r.top) / r.height) * 2 - 1, -1.5, 1.5), x: e.clientX, y: e.clientY, leaf: leaf || undefined });
  }, { passive: true });
  addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    wakeUI();
    const menuOpen = !$('#menu').hidden;
    if (e.key === 'Escape') { if (menuOpen) openMenu(false); else if (Reader.full) guidedFull(false); return; }
    if (menuOpen) return;
    if (e.target.closest && e.target.closest('button, a') && (e.key === ' ' || e.key === 'Enter')) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') goLeaf(Save.d.checkedIn ? 1 : 0);
    else if (e.key === 'm') openMenu(true);
    else if (e.key === 't') { Save.d.settings.transcript = !Save.d.settings.transcript; Save.write(); renderTranscript(); }
    else if (e.key === 'f' && Reader.mode === 'guided') guidedFull(!Reader.full);
  });
  $('#ticket').addEventListener('click', () => openMenu($('#menu').hidden));
  let rz = 0;
  addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      const m = pickMode();
      if (m !== Reader.mode) setMode(m);
      else { sizeBook(); if (Reader.mode === 'guided') { if (Reader.full) guidedFull(true); else goStop(Reader.stop, { move: 'cut' }); } }
    }, 140);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      const now = Date.now();
      if (!Reader.sess.leftAt) Reader.sess.leftAt = now;
      Reader.sess.awayCount++;
      Reader.sess.hiddenAt = now;
      Save.d.lastLeftAt = now;
      Save.write();
      setTitle(Reader.hiddenTitle || 'Are you still there?');
      clearTimeout(Reader._tt);
      Reader._tt = setTimeout(() => setTitle('You’re number 07'), 30000);
      Sound.suspend(true);
      Bus.emit('tabLeave');
    } else {
      clearTimeout(Reader._tt);
      setTitle(Reader.titleBase);
      Sound.suspend(false);
      Bus.emit('tabReturn', { away: Date.now() - (Reader.sess.hiddenAt || Date.now()) });
    }
  });
}

function applyMotion() {
  document.documentElement.classList.toggle('rm', reducedMotion());
}

/* ---------- debug overlay (?debug) ---------- */

const DEBUG = /[?&]debug/.test(location.search);
function debugInfo() {
  if (!DEBUG) return;
  const d = $('#debug');
  d.hidden = false;
  d.textContent = `${innerWidth}×${innerHeight} @${devicePixelRatio.toFixed(2)}x · aspect ${(innerWidth / innerHeight).toFixed(3)} · mode ${Reader.mode}${Save.d.settings.mode !== 'auto' ? ' (override)' : ''} · leaf ${Reader.idx}${Reader.mode === 'guided' ? ` stop ${Reader.stop}` : ''}`;
}

/* ---------- boot ---------- */

function fontsReady(ms) {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  const loads = ['700 30px "Comic Neue"', '30px Bangers', '30px VT323'].map((f) => document.fonts.load(f).catch(() => null));
  return Promise.race([Promise.all(loads), new Promise((r) => setTimeout(r, ms))]);
}

async function boot() {
  $('#lib').innerHTML = libDefs();
  // a new visit is coming back after a break, not a reload mid-read
  if (Save.d.checkedIn && Date.now() - (Save.d.lastActive || 0) > 30 * 60 * 1000) { Save.d.visits = (Save.d.visits || 1) + 1; Save.write(); }
  applyMotion();
  await fontsReady(1800);
  _mcache.clear();
  Reader.mode = pickMode();
  sizeBook();
  bindInput();
  if (Save.d.settings.tilt) enableTilt();
  Sound.setEnabled(!!Save.d.settings.sound);
  Reader.idx = 0;
  show();
  wakeUI();
  // the progress line doubles as a call-duration readout
  setInterval(() => { if (Save.d.readStart) $('#ptime').textContent = fmtDur(Date.now() - Save.d.readStart).replace(/^00:/, ''); }, 1000);
  // fonts that arrive late change text widths; re-measure and redraw once
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { _mcache.clear(); if (Reader.idx > 0) show({ noEnter: true }); }, { once: true });
  if (matchMedia) matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change', applyMotion);
}

/* ---- 85-screens.js ---- */
/* SOS ONLY — the inside covers: the check-in tablet and the end call screen (HTML, not SVG). */

function ticketHTML(name, when) {
  return `<div class="tk"><div class="tk-h">OPTUS REDCLIFFE</div><div class="tk-s">YOUR NUMBER</div><div class="tk-n">07</div>
    <div class="tk-name">${esc(name)}</div><div class="tk-r">Reason: SOS ONLY</div><div class="tk-t">${esc(when)}</div>
    <div class="tk-f">Please wait to be served</div></div>`;
}

function buildCheckin(el) {
  const back = Save.d.checkedIn;
  const s = Save.d.settings;
  const sw = (k, label, on) => `<button type="button" class="tg" data-k="${k}" role="switch" aria-checked="${on}"><span class="tg-k" aria-hidden="true"></span>${label}</button>`;
  const toggles = `<div class="f-toggles">${sw('sound', 'Sound', !!s.sound)}${sw('motion', 'Motion', !reducedMotion())}${sw('tilt', 'Tilt', !!s.tilt)}</div>`;
  const note = '<p class="cn"><b>Content note:</b> horror, disappearance, body horror, flickering light.</p>';
  const justNow = back && Reader.sess.checkedInNow;
  const body = back
    ? `<h1>${justNow ? `Thanks${hasName() ? `, ${esc(NAME())}` : ''}.` : `Welcome back${hasName() ? `, ${esc(NAME())}` : ''}.`}</h1>
       <p class="sub">${justNow ? 'You’re number 07. Please wait to be served.' : 'You’re still number 07 in the queue.'}</p>
       <div class="printed">${ticketHTML(NAME(), new Date(Save.d.readStart || Date.now()).toLocaleString())}</div>
       ${toggles}${note}
       <div class="f-acts"><button type="button" class="take cont">${Save.d.lastPage > 1 ? `Continue — page ${Save.d.lastPage}` : 'Continue'}</button>${Save.d.lastPage > 1 ? '<button type="button" class="ghost restart">Start from page 1</button>' : ''}</div>`
    : `<h1>Welcome to Optus Redcliffe!</h1>
       <p class="sub">Pop your name in and we’ll be with you shortly.</p>
       <label class="f-name"><span>Your name <i>(optional)</i></span><input type="text" maxlength="16" autocomplete="off" spellcheck="false" placeholder="YOU" value="${esc(Save.d.name || '')}"></label>
       <div class="f-reason" role="radiogroup" aria-label="Reason for visit"><span class="lab">Reason for visit</span>
         ${REASONS.map((r, i) => `<button type="button" role="radio" aria-checked="${i === 0}" data-i="${i}">${r}</button>`).join('')}</div>
       ${toggles}${note}
       <button type="button" class="take">Take a ticket</button>
       <div class="tb-printer" aria-hidden="true"><div class="tb-slot"></div><div class="tb-paper"></div></div>`;
  el.innerHTML = `<div class="sheet checkin"><div class="tablet">
      <div class="tb-bar"><span class="tb-logo">optus</span><span class="tb-store">Redcliffe</span><span class="tb-clock"></span></div>
      <div class="tb-body">${body}</div>
      ${miniOllie()}
      <footer>An OG original.</footer>
    </div></div>`;
  const clock = $('.tb-clock', el);
  const tick = () => { clock.textContent = fmtClock(); };
  tick();
  const t = setInterval(tick, 1000);

  // reason chips: whatever you pick, the ticket prints SOS ONLY
  el.querySelectorAll('.f-reason button').forEach((b) => {
    b.onclick = () => { el.querySelectorAll('.f-reason button').forEach((x) => x.setAttribute('aria-checked', String(x === b))); };
  });
  el.querySelectorAll('.tg').forEach((b) => {
    b.onclick = async () => {
      const k = b.dataset.k, on = b.getAttribute('aria-checked') !== 'true';
      if (k === 'sound') { s.sound = on; if (on) Sound.unlock(); Sound.setEnabled(on); }
      if (k === 'motion') { s.motion = on ? 'on' : 'off'; applyMotion(); }
      if (k === 'tilt') { s.tilt = on ? await enableTilt() : false; }
      b.setAttribute('aria-checked', String(k === 'tilt' ? !!s.tilt : on));
      Save.write();
    };
  });
  const input = $('.f-name input', el);
  if (input) {
    input.addEventListener('input', () => { input.value = input.value.replace(/[<>]/g, '').slice(0, 16); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('.take', el).click(); } });
  }

  const take = $('.take', el);
  take.onclick = () => {
    if (back) { goLeaf(Math.max(1, Save.d.lastPage || 1)); return; }
    take.disabled = true;
    Save.d.name = input ? input.value.trim().slice(0, 16) : '';
    Save.d.checkedIn = true;
    Save.d.visits = 1;
    Save.d.readStart = Date.now();
    Save.d.firstOpened = Save.d.firstOpened || Date.now();
    Save.write();
    Reader.sess.checkedInNow = true;
    if (Save.d.settings.sound) Sound.unlock();
    Sound.sfx('print');
    const paper = $('.tb-paper', el);
    paper.innerHTML = ticketHTML(NAME(), fmtClock());
    paper.classList.add('printing');
    setTimeout(() => flyTicket(paper), reducedMotion() ? 300 : 1900);
  };
  const rs = $('.restart', el);
  if (rs) rs.onclick = () => goLeaf(1);
  return () => clearInterval(t);
}

// The printed ticket slides into the top-left corner and becomes the menu button.
function flyTicket(paper) {
  const tk = $('#ticket');
  tk.hidden = false;
  const a = paper.getBoundingClientRect(), b = tk.getBoundingClientRect();
  tk.hidden = true;
  const ghost = paper.cloneNode(true);
  ghost.className = 'tk-ghost';
  Object.assign(ghost.style, { left: `${a.left}px`, top: `${a.top}px`, width: `${a.width}px`, height: `${a.height}px` });
  document.body.append(ghost);
  paper.style.visibility = 'hidden';
  requestAnimationFrame(() => {
    ghost.style.transform = `translate(${b.left - a.left}px, ${b.top - a.top}px) scale(${b.width / a.width}, ${b.height / a.height}) rotate(-4deg)`;
    ghost.style.opacity = '0.2';
  });
  const done = () => {
    ghost.remove();
    tk.hidden = false;
    tk.classList.add('landed');
    setTimeout(() => tk.classList.remove('landed'), 900);
    if (Reader.mode === 'spread') {
      show();
      const r = Reader.leaves[1];
      if (r) {
        const sh = document.createElement('div');
        sh.className = 'shutter';
        r.el.append(sh);
        Sound.sfx('door');
        requestAnimationFrame(() => requestAnimationFrame(() => sh.classList.add('up')));
        setTimeout(() => sh.remove(), 1800);
      }
    } else goLeaf(1);
  };
  setTimeout(done, reducedMotion() ? 50 : 800);
}

function nudgeCheckin() {
  const b = $('.leaf-checkin .take');
  if (!b) { goLeaf(0); return; }
  b.classList.remove('nudge');
  void b.offsetWidth;
  b.classList.add('nudge');
  b.focus({ preventScroll: true });
}

  const c1 = $('[data-t=c1]', el), c2 = $('[data-t=c2]', el);

  tick();

  const ob = $('.cs-ollies b', el);

  const hang = $('.cs-hang', el);
  let presses = 0;
  hang.onclick = () => {
    presses++;
    if (presses === 1) { hang.textContent = 'Jarrad tried that.'; hang.classList.add('clean'); }
    else goLeaf(0);
  };
  $('.cs-again', el).onclick = () => goLeaf(1);
  return () => { clearInterval(t); clearTimeout(t2); };
}
