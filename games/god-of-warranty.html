<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>God of Warranty</title>
<meta name="description" content="God of Warranty — Part One: The Ward Falls. A 2IC, a casual, and a satchel of ashes. One unbroken take. (Demo)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one full-bleed WebGL take; every piece of UI is a carved-slate overlay that fades with the cinematography. */
:root {
  color-scheme: dark;
  --ink: #0b1115;          /* night slate, the ground everything sits on */
  --slate: #141d22;        /* panel stone */
  --slate-hi: #22313a;     /* carved edge highlight */
  --frost: #e4edf1;        /* snow-white text */
  --frost-dim: #9fb2bb;    /* secondary text */
  --teal: #1fc8c1;         /* rune light, axe window, Luka */
  --teal-deep: #0b6f72;
  --yellow: #ffcf1f;       /* lantern, handprint, Rage, selection */
  --head-office: #8dff5a;  /* only for things from above */
  --danger: #ff4b3e;
  --c-luka: #46d6cf; --c-chase: #ffd447; --c-rue: #fff0d8; --c-luke: #64aeff;
  --c-zane: #96f2c8; --c-zee: #b2c99f; --c-jarrad: #ff8069; --c-hamarr: #ff6a55;
  --c-churned: #8bbab6; --c-faye: #ffe08a; --c-sys: #c9d6dc;
  --f-display: "Cinzel", "Trajan Pro", "Times New Roman", Georgia, serif;
  --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --sub-scale: 1;
  --hud-a: 1;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--frost); }
body { font-family: var(--f-body); font-size: 15px; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#gl, #fx2d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gl { image-rendering: auto; }
#fx2d { pointer-events: none; }
.layer { position: absolute; inset: 0; pointer-events: none; }
button { font-family: inherit; color: inherit; }
button:focus-visible, .opt:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

/* ---------- carved slate material ---------- */
.slate {
  background:
    radial-gradient(120% 140% at 30% 0%, rgba(255,255,255,.05), transparent 60%),
    linear-gradient(180deg, #1a252b, #10181c);
  border: 1px solid #2a3a43;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), inset 0 -2px 6px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  border-radius: 3px;
}
.carve { font-family: var(--f-display); letter-spacing: .08em; text-transform: uppercase;
  text-shadow: 0 -1px 0 rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.12); }

/* ---------- boot ---------- */
#boot { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink); z-index: 60; transition: opacity .8s; }
#boot .b { text-align: center; }
#boot .t { font-family: var(--f-display); font-weight: 700; letter-spacing: .3em; font-size: 14px; color: var(--frost-dim); }
#boot .bar { width: 220px; height: 2px; background: #1d2a31; margin: 14px auto 0; overflow: hidden; }
#boot .bar i { display: block; height: 100%; width: 0; background: var(--teal); box-shadow: 0 0 8px var(--teal); transition: width .2s; }
#boot .err { color: var(--danger); max-width: 520px; margin-top: 16px; font-size: 13px; line-height: 1.5; padding: 0 16px; }

/* ---------- title ---------- */
#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; pointer-events: none; transition: opacity 1.2s; }
#title .logo { text-align: center; transform: translateY(-6vh); }
#logoText { font-family: var(--f-display); font-weight: 900; font-size: clamp(38px, 8.2vw, 118px); letter-spacing: .06em; line-height: 1.1; white-space: nowrap; color: #c9d3d6;
  filter: drop-shadow(0 0 1px rgba(31,200,193,.9)) drop-shadow(0 0 14px rgba(31,200,193,.35)) drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
#logoText span { display: inline-block;
  background: linear-gradient(180deg, #f4fbfd 0%, #c3cfd3 24%, #8e9ca2 50%, #b9c5c9 66%, #6f7d83 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
#logoText .gap { width: .32em; }
#title .sub { font-family: var(--f-display); font-style: normal; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; font-size: clamp(11px, 1.35vw, 16px); color: var(--frost-dim); margin-top: 1.1em; }
#title .sub em { font-style: normal; color: var(--teal); }
#menu { margin-top: 7vh; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: auto; }
.opt { background: none; border: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(14px, 1.6vw, 19px); letter-spacing: .22em; text-transform: uppercase; color: var(--frost-dim); padding: 8px 22px; cursor: pointer; position: relative; transition: color .2s, text-shadow .2s; }
.opt::before, .opt::after { content: ""; position: absolute; top: 50%; width: 0; height: 1px; background: var(--yellow); transition: width .25s; }
.opt::before { right: 100%; } .opt::after { left: 100%; }
.opt.sel, .opt:hover { color: #fff6d6; text-shadow: 0 0 12px rgba(255,207,31,.65); }
.opt.sel::before, .opt.sel::after, .opt:hover::before, .opt:hover::after { width: 28px; }
.opt[disabled] { opacity: .35; cursor: default; }
#soundHint { position: absolute; bottom: calc(22px + var(--safe-b)); left: 0; right: 0; text-align: center; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--frost-dim); opacity: .75; }
#titleFoot { position: absolute; bottom: calc(22px + var(--safe-b)); right: calc(22px + var(--safe-r)); font-size: 11px; color: #6f8189; letter-spacing: .08em; }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(5,9,11,.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); pointer-events: auto;
  padding: calc(16px + var(--safe-t)) max(16px, var(--safe-r)) calc(16px + var(--safe-b)) max(16px, var(--safe-l)); }
.screen[hidden] { display: none !important; }
#settings { z-index: 41; } /* Settings can open over the death screen (Change Plan) */
.panel { width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 26px 28px; }
.panel h2 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 900; letter-spacing: .2em; font-size: 26px; text-transform: uppercase; text-align: center; }
.panel .lede { text-align: center; color: var(--frost-dim); margin: 0 0 18px; font-size: 13px; letter-spacing: .06em; }
.stack { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.stack .opt { text-align: center; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid #1f2c33; font-size: 14px; }
.row label { color: var(--frost); }
.row .ctl { display: flex; align-items: center; gap: 8px; }
.row input[type=range] { width: 140px; accent-color: var(--teal); }
.row select { background: #0f171b; color: var(--frost); border: 1px solid #2a3a43; padding: 4px 6px; font-family: inherit; font-size: 13px; }
.row .val { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; color: var(--frost-dim); font-size: 12px; }
.tabs { display: flex; gap: 4px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
.tab { background: #0f171b; border: 1px solid #263640; color: var(--frost-dim); font-family: var(--f-display); letter-spacing: .14em; font-size: 12px; padding: 6px 10px; cursor: pointer; text-transform: uppercase; }
.tab.on { color: #fff6d6; border-color: var(--yellow); box-shadow: 0 0 10px rgba(255,207,31,.25); }
.btnrow { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.btn { background: #0f171b; border: 1px solid #2c3c45; padding: 10px 18px; font-family: var(--f-display); font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 13px; cursor: pointer; color: var(--frost); }
.btn:hover, .btn.sel { border-color: var(--yellow); color: #fff6d6; box-shadow: 0 0 14px rgba(255,207,31,.25); }
.small { font-size: 12px; color: var(--frost-dim); line-height: 1.55; }
.keys { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 6px 14px; font-size: 13px; align-items: center; }
.keys b { font-weight: 600; color: var(--frost); }
.keys span { color: var(--frost-dim); font-size: 12px; text-align: right; }
.codex h3 { font-family: var(--f-display); letter-spacing: .14em; font-size: 14px; margin: 14px 0 4px; color: var(--teal); text-transform: uppercase; }
.codex p { margin: 0 0 6px; font-size: 13px; color: var(--frost-dim); line-height: 1.5; }
.codex .locked { opacity: .4; }

/* ---------- death ---------- */
#death { background: radial-gradient(ellipse at center, rgba(0,0,0,.3), rgba(0,0,0,.8)); backdrop-filter: none; -webkit-backdrop-filter: none; }
#death .big { font-family: var(--f-display); font-weight: 900; font-size: clamp(40px, 8vw, 96px); letter-spacing: .12em; color: #d9e2e5; text-shadow: 0 0 30px rgba(255,75,62,.35), 0 4px 0 #000; text-align: center; }
#death .lede { text-align: center; color: var(--frost-dim); letter-spacing: .12em; margin: 8px 0 26px; font-style: italic; }

/* ---------- HUD ---------- */
#hud { opacity: calc(var(--hud-a)); transition: opacity .2s; }
#hudBL { position: absolute; left: calc(24px + var(--safe-l)); bottom: calc(22px + var(--safe-b)); width: min(300px, 46vw); }
.hpRow { display: flex; align-items: flex-end; gap: 10px; }
.sig { display: flex; gap: 2px; align-items: flex-end; height: 16px; }
.sig i { display: block; width: 4px; background: var(--teal); box-shadow: 0 0 6px rgba(31,200,193,.6); border-radius: 1px; }
.sig i:nth-child(1){height:5px} .sig i:nth-child(2){height:8px} .sig i:nth-child(3){height:12px} .sig i:nth-child(4){height:16px}
.sig i.off { background: #23343b; box-shadow: none; }
.sig.flick i:not(.off) { animation: flick .5s steps(2) infinite; }
@keyframes flick { 50% { opacity: .2; } }
.bar { position: relative; height: 9px; flex: 1; background: rgba(5,10,12,.7); border: 1px solid #2a3d45; overflow: hidden; }
.bar > i { position: absolute; inset: 0; transform-origin: left; background: linear-gradient(180deg, #5ff2ea, #13a7a1); }
.bar > b { position: absolute; inset: 0; transform-origin: left; background: rgba(255,255,255,.55); }
.rage { height: 5px; margin-top: 5px; margin-left: 28px; }
.rage > i { background: linear-gradient(180deg, #ffe680, #e1a800); }
.rage.full { box-shadow: 0 0 12px rgba(255,207,31,.75); border-color: var(--yellow); }
.quiver { display: flex; gap: 5px; margin: 8px 0 0 28px; }
.quiver i { width: 12px; height: 14px; display: block; opacity: .9; background: currentColor; color: var(--c-chase);
  -webkit-mask: radial-gradient(circle at 35% 78%, #000 3.4px, transparent 3.8px), linear-gradient(#000,#000) 64% 0/2px 80% no-repeat;
  mask: radial-gradient(circle at 35% 78%, #000 3.4px, transparent 3.8px), linear-gradient(#000,#000) 64% 0/2px 80% no-repeat; }
.quiver i.off { color: #33444b; }
.quiver i.lit { color: #fff; filter: drop-shadow(0 0 4px var(--yellow)); }
#hudBR { position: absolute; right: calc(24px + var(--safe-r)); bottom: calc(22px + var(--safe-b)); display: flex; gap: 10px; align-items: flex-end; }
.ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; position: relative; font-family: var(--f-display); font-weight: 700; font-size: 11px; color: var(--frost); background: rgba(8,14,17,.8); border: 1px solid #2c3f47; }
.ico .cd { position: absolute; inset: -1px; border-radius: 50%; background: conic-gradient(rgba(0,0,0,.72) var(--p, 0%), transparent 0); }
.ico.ready { border-color: var(--teal); box-shadow: 0 0 10px rgba(31,200,193,.45); }
.ico.hide { display: none; }
#axeIco svg { width: 24px; height: 24px; }
#axeIco.out { opacity: .45; }
#toasts { position: absolute; top: calc(22px + var(--safe-t)); right: calc(24px + var(--safe-r)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.toast { font-size: 13px; letter-spacing: .06em; padding: 6px 12px; background: rgba(8,14,17,.75); border-right: 2px solid var(--teal); animation: toastIn .3s ease-out, toastOut .5s ease-in 2.6s forwards; }
.toast b { color: var(--yellow); font-weight: 600; }
.toast.trophy { border-color: var(--yellow); }
.toast.trophy b { color: var(--yellow); }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(10px); } }
#bossbar { position: absolute; top: calc(26px + var(--safe-t)); left: 50%; transform: translateX(-50%); width: min(620px, 82vw); text-align: center; opacity: 0; transition: opacity .8s; }
#bossbar.on { opacity: calc(var(--hud-a)); }
#bossbar .nm { font-family: var(--f-display); font-weight: 900; letter-spacing: .24em; font-size: 15px; text-transform: uppercase; text-shadow: 0 2px 0 #000; }
#bossbar .rl { font-size: 11px; letter-spacing: .2em; color: var(--frost-dim); text-transform: uppercase; margin: 2px 0 6px; }
#bossbar .bar { height: 8px; }
#bossbar .bar > i { background: linear-gradient(180deg, #ff8a6a, #c22d1f); }
#bossbar .stun { height: 3px; margin-top: 3px; }
#bossbar .stun > i { background: var(--yellow); }
#reticle { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; transition: opacity .15s; }
#reticle.on { opacity: 1; }
#reticle::before, #reticle::after { content: ""; position: absolute; background: var(--frost); box-shadow: 0 0 4px rgba(0,0,0,.8); }
#reticle::before { left: 12px; top: 0; width: 2px; height: 26px; clip-path: polygon(0 0,100% 0,100% 35%,0 35%,0 65%,100% 65%,100% 100%,0 100%); }
#reticle::after { top: 12px; left: 0; height: 2px; width: 26px; clip-path: polygon(0 0,35% 0,35% 100%,0 100%,0 0,65% 0,100% 0,100% 100%,65% 100%); }
#reticle.hot::before, #reticle.hot::after { background: var(--teal); }

/* ---------- prompts ---------- */
#prompts { position: absolute; left: 0; right: 0; bottom: calc(118px + var(--safe-b)); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.prompt { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; background: rgba(8,13,16,.78); border: 1px solid #2a3c44; border-radius: 3px; font-size: 14px; letter-spacing: .06em; animation: pIn .35s ease-out; transition: opacity .4s; }
.prompt.out { opacity: 0; }
.cap { min-width: 26px; height: 26px; padding: 0 7px; display: inline-grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 12px; color: #e9f3f5;
  background: linear-gradient(180deg, #34464f, #1b262c); border: 1px solid #4c626c; border-radius: 4px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.45), 0 0 10px rgba(31,200,193,.25); text-shadow: 0 0 6px rgba(31,200,193,.8); }
@keyframes pIn { from { opacity: 0; transform: translateY(6px); } }

/* ---------- subtitles ---------- */
#subs { position: absolute; left: 0; right: 0; bottom: calc(52px + var(--safe-b)); display: flex; justify-content: center; padding: 0 max(16px, var(--safe-l)); pointer-events: none; z-index: 20; }
#subs .ln { max-width: min(46ch, 92vw); text-align: center; font-size: calc(19px * var(--sub-scale)); line-height: 1.35; font-weight: 500; text-shadow: 0 1px 2px #000, 0 0 10px rgba(0,0,0,.75); opacity: 0; transition: opacity .15s; padding: 4px 12px; border-radius: 3px; }
#subs .ln.on { opacity: 1; }
#subs.box .ln { background: rgba(0,0,0,.6); text-shadow: none; }
#subs .who { font-weight: 700; letter-spacing: .06em; margin-right: .35em; }
#subs .ln.caps { font-family: var(--f-display); font-weight: 900; letter-spacing: .08em; }
#subs .ln.tiny { font-size: calc(15px * var(--sub-scale)); font-style: italic; text-transform: lowercase; }
#subs .dir { color: var(--frost-dim); font-style: italic; font-weight: 400; }

/* ---------- name card ---------- */
#namecard { position: absolute; left: calc(7vw + var(--safe-l)); bottom: calc(23vh + var(--safe-b)); z-index: 19; opacity: 0; transform: translateY(8px); transition: opacity 1s, transform 1.2s; pointer-events: none; }
#namecard.on { opacity: 1; transform: none; }
#namecard .stone { padding: 12px 22px 12px 18px; position: relative;
  background: linear-gradient(100deg, rgba(20,28,32,.92), rgba(20,28,32,.65) 70%, transparent);
  border-left: 2px solid var(--nc-light, var(--teal)); }
#namecard .nm { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 3.4vw, 40px); letter-spacing: .2em; line-height: 1;
  color: #d9e3e6; text-shadow: 0 -1px 0 rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.18), 0 0 18px var(--nc-glow, rgba(31,200,193,.25)); }
#namecard .rl { margin-top: 6px; font-size: 13px; letter-spacing: .26em; text-transform: uppercase; color: var(--frost-dim); }
#namecard .rl.upd { animation: updFlash 1.4s; }
@keyframes updFlash { 0% { color: var(--yellow); } 100% { color: var(--frost-dim); } }

/* ---------- kiosk ---------- */
#kiosk .panel { width: min(640px, 100%); }
.shop { display: flex; flex-direction: column; gap: 6px; }
.item { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; padding: 10px 12px; background: rgba(10,16,19,.7); border: 1px solid #23333b; cursor: pointer; text-align: left; }
.item:hover, .item.sel { border-color: var(--yellow); }
.item.owned { opacity: .55; cursor: default; }
.item.cant { opacity: .7; }
.item .n { font-family: var(--f-display); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 14px; }
.item .c { font-variant-numeric: tabular-nums; color: var(--yellow); font-size: 13px; }
.item .d { grid-column: 1 / -1; font-size: 12.5px; color: var(--frost-dim); }
.wallet { display: flex; gap: 18px; justify-content: center; font-size: 13px; color: var(--frost-dim); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.wallet b { color: var(--yellow); font-weight: 600; }

/* ---------- end card ---------- */
#endcard { background: rgba(4,7,9,.55); }
#endcard .panel { width: min(640px, 100%); text-align: center; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 22px; margin: 18px 0 6px; text-align: left; font-size: 14px; }
.stats div { display: flex; justify-content: space-between; border-bottom: 1px solid #1f2c33; padding: 5px 0; }
.stats span { color: var(--frost-dim); }
.stats b { font-variant-numeric: tabular-nums; font-weight: 600; }
#credits { position: absolute; inset: 0; z-index: 41; overflow: hidden; pointer-events: none; display: none; }
#credits.on { display: block; }
#credits .roll { position: absolute; left: 0; right: 0; top: 100%; text-align: center; padding: 0 16px; }
#credits h4 { font-family: var(--f-display); letter-spacing: .3em; color: var(--frost-dim); font-size: 12px; margin: 34px 0 6px; text-transform: uppercase; font-weight: 500; }
#credits p { margin: 2px 0; font-size: 16px; }
#credits .disc { max-width: 560px; margin: 40px auto 0; font-size: 12px; color: var(--frost-dim); line-height: 1.6; }

/* ---------- touch ---------- */
#touch { position: absolute; inset: 0; z-index: 25; display: none; }
/* with the touch controls up, the vitals and quick slots move above the stick and the button cluster */
body.touchUI #hudBL { bottom: calc(186px + var(--safe-b)); }
body.touchUI #hudBR { bottom: calc(260px + var(--safe-b)); }
#lockHint { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); z-index: 22; padding: 6px 14px; border-radius: 3px; background: rgba(0,0,0,.45); color: var(--frost-dim); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; pointer-events: none; opacity: 0; transition: opacity .4s; }
#lockHint.on { opacity: 1; transition-delay: .6s; }
#touch.on { display: block; }
#tStick { position: absolute; left: calc(20px + var(--safe-l)); bottom: calc(20px + var(--safe-b)); width: 150px; height: 150px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.18); }
#tStick i { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); }
#tBtns { position: absolute; right: calc(16px + var(--safe-r)); bottom: calc(16px + var(--safe-b)); width: 230px; height: 230px; }
.tb { position: absolute; width: 62px; height: 62px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(8,14,17,.55); font-family: var(--f-display); font-weight: 700; font-size: 10px; letter-spacing: .08em; color: #e8f2f4; display: grid; place-items: center; text-transform: uppercase; touch-action: none; }

    if (t2 < 0) n2 = 0; else { const gi = permMod12[ii + i2 + perm[jj + j2 + perm[kk + k2]]] * 3; t2 *= t2; n2 = t2 * t2 * (grad3[gi] * x2 + grad3[gi + 1] * y2 + grad3[gi + 2] * z2); }
    let t3 = 0.6 - x3 * x3 - y3 * y3 - z3 * z3;
    if (t3 < 0) n3 = 0; else { const gi = permMod12[ii + 1 + perm[jj + 1 + perm[kk + 1]]] * 3; t3 *= t3; n3 = t3 * t3 * (grad3[gi] * x3 + grad3[gi + 1] * y3 + grad3[gi + 2] * z3); }
    return 32 * (n0 + n1 + n2 + n3);
  }
  function fbm2(x, y, oct = 4) { let a = 0, f = 1, amp = 0.5, n = 0; for (let i = 0; i < oct; i++) { a += amp * n2(x * f, y * f); n += amp; f *= 2.03; amp *= 0.5; } return a / n; }

// --- Springs: a = -2ζω·v - ω²·(x - target), semi-implicit, substepped ---
class Spring1 {
  constructor({ omega = 4, zeta = 1, x = 0 } = {}) { this.omega = omega; this.zeta = zeta; this.x = x; this.v = 0; this.target = x; }
  step(dt) {
    const n = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / n, w = this.omega, z = this.zeta;
    for (let i = 0; i < n; i++) { const a = -2 * z * w * this.v - w * w * (this.x - this.target); this.v += a * h; this.x += this.v * h; }
    return this.x;
  }
  snap(x) { this.x = this.target = x; this.v = 0; }
}
class Spring3 {
  constructor({ omega = 4, zeta = 1 } = {}) { this.omega = omega; this.zeta = zeta; this.x = new THREE.Vector3(); this.v = new THREE.Vector3(); this.target = new THREE.Vector3(); }
  step(dt) {
    const n = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / n, w = this.omega, z = this.zeta, x = this.x, v = this.v, t = this.target;
    for (let i = 0; i < n; i++) {
      v.x += (-2 * z * w * v.x - w * w * (x.x - t.x)) * h; v.y += (-2 * z * w * v.y - w * w * (x.y - t.y)) * h; v.z += (-2 * z * w * v.z - w * w * (x.z - t.z)) * h;
      x.x += v.x * h; x.y += v.y * h; x.z += v.z * h;
    }
    return x;
  }
  snap(p) { this.x.copy(p); this.target.copy(p); this.v.set(0, 0, 0); }
}

// --- temp vector pools (no allocation in the loop) ---

// ================= RENDER =================
// Renderer, render targets and the lens post stack (§10.8):
// scene → CoC (half) → bokeh gather (half) → DOF composite + haze + whip blur → bloom chain → final grade.

const GLSL_COMMON = /* glsl */`
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), u.x), mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ float a = 0., w = .5; for (int i = 0; i < 5; i++){ a += w * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); w *= .5; } return a; }
`;

const FSQ_VERT = /* glsl */`
varying vec2 vUv;
void main(){ vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

const R = {
  renderer: null, canvas: null, scene: null, camera: null,
  displayW: 1, displayH: 1, w: 1, h: 1, scale: 1, dpr: 1,
  rtScene: null, rtHalf: null, rtDof: null, rtComp: null, bloomRTs: [],
  quadScene: null, quadCam: null, quad: null, mats: {},
  preRenders: [],
  frameMs: 16, dynTimer: 0,
  grade: null, post: null,
  stats: { calls: 0, tris: 0 },

function makeQuadMat(frag, uniforms) {
  return new THREE.ShaderMaterial({ vertexShader: FSQ_VERT, fragmentShader: frag, uniforms, depthTest: false, depthWrite: false });
}

function buildPostMaterials() {
  const P = R.post;
  // 1. CoC + downsample to half res. rgb = colour, a = signed CoC in half-res pixels (negative = near field)
  R.mats.coc = makeQuadMat(/* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tColor, tDepth;
    uniform float near, far, focal, fstop, focus, imgH, maxCoc, strength;
    uniform vec2 texel;
    float linDepth(float d){ float z = d * 2.0 - 1.0; return (2.0 * near * far) / (far + near - z * (far - near)); }
    float coc(float D){ float f = focal * 0.001; float S = max(focus, f * 1.5);
      float c = (f * f / (fstop * (S - f))) * (D - S) / D; return clamp(c * (imgH / 0.024) * 0.5 * strength, -maxCoc, maxCoc); }
    void main(){
      vec2 o = texel * 0.5;
      vec3 c = texture2D(tColor, vUv + vec2(-o.x, -o.y)).rgb + texture2D(tColor, vUv + vec2(o.x, -o.y)).rgb
             + texture2D(tColor, vUv + vec2(-o.x, o.y)).rgb + texture2D(tColor, vUv + vec2(o.x, o.y)).rgb;
      float d0 = linDepth(texture2D(tDepth, vUv + vec2(-o.x, -o.y)).r), d1 = linDepth(texture2D(tDepth, vUv + vec2(o.x, -o.y)).r);
      float d2 = linDepth(texture2D(tDepth, vUv + vec2(-o.x, o.y)).r), d3 = linDepth(texture2D(tDepth, vUv + vec2(o.x, o.y)).r);
      float dn = min(min(d0, d1), min(d2, d3));
      float cn = coc(dn), cf = coc((d0 + d1 + d2 + d3) * 0.25);
      gl_FragColor = vec4(min(c * 0.25, vec3(64.0)), cn < 0.0 ? cn : cf);
    }`, {
    tColor: { value: null }, tDepth: { value: null }, near: { value: 0.08 }, far: { value: 2600 }, focal: { value: 35 }, fstop: { value: 4 }, focus: { value: 3 },
    imgH: { value: 1080 }, maxCoc: { value: 6 }, strength: { value: 1 }, texel: { value: new THREE.Vector2() },
  });
  // 2. Bokeh gather (Vogel disc, scatter-as-gather). a = near-field coverage
  R.mats.gather = makeQuadMat(/* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tHalf;
    uniform vec2 texel;
    uniform float maxCoc;
    #define TAPS __TAPS__
    void main(){
      vec4 c0 = texture2D(tHalf, vUv);
      float cs = abs(c0.a);
      vec3 col = c0.rgb; float tot = 1.0; float nearCov = 0.0;
      if (maxCoc < 0.5) { gl_FragColor = vec4(col, 0.0); return; }
      for (int i = 0; i < TAPS; i++) {
        float fi = float(i) + 0.5;
        float r = sqrt(fi / float(TAPS)) * maxCoc;
        float a = fi * 2.39996323;
        vec4 s = texture2D(tHalf, vUv + vec2(cos(a), sin(a)) * r * texel);
        float ss = abs(s.a);
        if (s.a > c0.a) ss = min(ss, cs * 2.0);         // a farther sample can't bleed over a nearer one
        float m = smoothstep(r - 0.5, r + 0.5, ss);
        col += mix(col / tot, s.rgb, m); tot += 1.0;
        if (s.a < -0.6 && s.a < c0.a) nearCov = max(nearCov, m * smoothstep(0.6, 2.2, -s.a));
      }
      gl_FragColor = vec4(col / tot, nearCov);
    }`.replace('__TAPS__', '32'), { tHalf: { value: null }, texel: { value: new THREE.Vector2() }, maxCoc: { value: 6 } });
  // 3. Composite sharp/blurred + heat haze + directional (whip) blur
  R.mats.comp = makeQuadMat(/* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tColor, tDof, tHalf;
    uniform vec2 whip; uniform vec3 haze; uniform float hazeR, time, aspect, dofOn;
    ${GLSL_COMMON}
    void main(){
      vec2 uv = vUv;
      if (haze.z > 0.001) {
        vec2 d = (uv - haze.xy) * vec2(aspect, 1.0);
        float m = smoothstep(hazeR, hazeR * 0.25, length(d * vec2(1.0, 0.6))) * smoothstep(-0.05, 0.12, uv.y - haze.y + hazeR * 0.4);
        vec2 n = vec2(vnoise(uv * 38.0 + vec2(0.0, -time * 3.1)), vnoise(uv * 41.0 + vec2(5.2, -time * 2.7))) - 0.5;
        uv += n * 0.012 * m * haze.z;
      }
      vec4 sharp = texture2D(tColor, uv);
      vec4 bl = texture2D(tDof, uv);
      float cocC = abs(texture2D(tHalf, uv).a);
      float f = max(smoothstep(0.35, 1.4, cocC), bl.a) * dofOn;
      vec3 col = mix(sharp.rgb, bl.rgb, f);
      float wl = length(whip);
      if (wl > 0.0005) {
        vec3 acc = col; float n = 1.0;
        for (int i = 1; i <= 8; i++) { float t = float(i) / 8.0 - 0.5; acc += texture2D(tColor, uv + whip * t).rgb; n += 1.0; }
        col = mix(col, acc / n, smoothstep(0.0005, 0.004, wl));
      }
      gl_FragColor = vec4(col, 1.0);
    }`, {
    tColor: { value: null }, tDof: { value: null }, tHalf: { value: null }, whip: { value: P.whip }, haze: { value: P.haze }, hazeR: { value: 0.1 },
    time: { value: 0 }, aspect: { value: 1.7 }, dofOn: { value: 1 },
  });
  // 4. Bloom chain (dual filter)
  R.mats.bloomPre = makeQuadMat(/* glsl */`
    precision highp float; varying vec2 vUv; uniform sampler2D tSrc; uniform vec2 texel; uniform float threshold;
    void main(){
      vec3 c = texture2D(tSrc, vUv).rgb * 4.0 + texture2D(tSrc, vUv + texel * vec2(-1,-1)).rgb + texture2D(tSrc, vUv + texel * vec2(1,-1)).rgb
             + texture2D(tSrc, vUv + texel * vec2(-1,1)).rgb + texture2D(tSrc, vUv + texel * vec2(1,1)).rgb;
      c /= 8.0;
      float br = max(c.r, max(c.g, c.b));
      float knee = threshold * 0.5;
      float soft = clamp(br - threshold + knee, 0.0, 2.0 * knee); soft = soft * soft / (4.0 * knee + 1e-4);
      float contrib = max(soft, br - threshold) / max(br, 1e-4);
      gl_FragColor = vec4(min(c * contrib, vec3(32.0)), 1.0);
    }`, { tSrc: { value: null }, texel: { value: new THREE.Vector2() }, threshold: { value: 0.9 } });
  R.mats.down = makeQuadMat(/* glsl */`
    precision highp float; varying vec2 vUv; uniform sampler2D tSrc; uniform vec2 texel;
    void main(){ vec2 o = texel * 0.5;
      vec3 c = texture2D(tSrc, vUv).rgb * 4.0 + texture2D(tSrc, vUv - o).rgb + texture2D(tSrc, vUv + o).rgb
             + texture2D(tSrc, vUv + vec2(o.x, -o.y)).rgb + texture2D(tSrc, vUv - vec2(o.x, -o.y)).rgb;
      gl_FragColor = vec4(c / 8.0, 1.0); }`, { tSrc: { value: null }, texel: { value: new THREE.Vector2() } });
  R.mats.up = makeQuadMat(/* glsl */`
    precision highp float; varying vec2 vUv; uniform sampler2D tSrc, tAdd; uniform vec2 texel; uniform float mixAmt;
    void main(){ vec2 o = texel * 0.5;
      vec3 c = texture2D(tSrc, vUv + vec2(-o.x * 2.0, 0.0)).rgb + texture2D(tSrc, vUv + vec2(-o.x, o.y)).rgb * 2.0
             + texture2D(tSrc, vUv + vec2(0.0, o.y * 2.0)).rgb + texture2D(tSrc, vUv + vec2(o.x, o.y)).rgb * 2.0
             + texture2D(tSrc, vUv + vec2(o.x * 2.0, 0.0)).rgb + texture2D(tSrc, vUv + vec2(o.x, -o.y)).rgb * 2.0
             + texture2D(tSrc, vUv + vec2(0.0, -o.y * 2.0)).rgb + texture2D(tSrc, vUv + vec2(-o.x, -o.y)).rgb * 2.0;
      gl_FragColor = vec4(c / 12.0 + texture2D(tAdd, vUv).rgb * mixAmt, 1.0); }`, { tSrc: { value: null }, tAdd: { value: null }, texel: { value: new THREE.Vector2() }, mixAmt: { value: 1 } });
  // 5. Final: tonemap → grade → CA → vignette → grain → dither → wipes and fades
  R.mats.final = makeQuadMat(/* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tComp, tBloom;
    uniform vec2 res; uniform float time, exposure, bloomStr, sat, contrast, vignette, grain, ca;
    uniform vec3 lift, gamma, gain, tint;
    uniform float wipe, wipeType, fade, desat, rage, hold, flash, lowHealth;
    ${GLSL_COMMON}
    vec3 aces(vec3 x){ const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14; return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0); }
    vec3 toSRGB(vec3 c){ c = clamp(c, 0.0, 1.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
    float luma(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
    void main(){
      vec2 uv = vUv;
      vec2 d = uv - 0.5;
      float r2 = dot(d, d);
      vec2 off = d * r2 * ca * 4.0 / res;
      vec3 col;
      col.r = texture2D(tComp, uv + off).r; col.g = texture2D(tComp, uv).g; col.b = texture2D(tComp, uv - off).b;
      col += texture2D(tBloom, uv).rgb * bloomStr;
      col *= exposure;
      col = aces(col);
      col = toSRGB(col);
      // grade
      col = gain * (col + lift * (1.0 - col));
      col = pow(max(col, 0.0), 1.0 / gamma);
      col = (col - 0.5) * contrast + 0.5;
      float l = luma(col);
      col = mix(vec3(l), col, sat);
      col *= tint;
      // Rage: red-gold push
      if (rage > 0.0) { float lr = luma(col); col = mix(col, vec3(lr * 1.35, lr * 0.82, lr * 0.32) + vec3(0.06, 0.0, -0.02), rage * 0.55); }
      // Hold Pattern: on-hold blue hush
      if (hold > 0.0) { col = mix(col, vec3(luma(col)) * vec3(0.78, 0.95, 1.08), hold * 0.5); }
      if (desat > 0.0) { col = mix(col, vec3(luma(col)) * 0.75, desat); }
      // vignette
      float vig = smoothstep(0.95, 0.18, length(d * vec2(1.0, 0.86)) * (1.0 + lowHealth * 0.35));
      col *= mix(1.0, vig, vignette + lowHealth * 0.35);
      if (lowHealth > 0.0) col = mix(col, col * vec3(1.0, 0.7, 0.7), lowHealth * 0.25 * (1.0 - vig));
      // grain (animated, luminance weighted)
      float gn = hash12(uv * res + fract(time * 13.37) * 400.0) - 0.5;
      col += gn * grain * (1.0 - luma(col) * 0.6);
      col += flash;
      // wipes: smoke (1), canopy (2), cloak (3). Coverage reaches 100% at wipe = 1
      if (wipe > 0.0) {
        vec2 p = uv * vec2(res.x / res.y, 1.0);
        float n = fbm(p * 3.0 + vec2(time * 0.05, -time * 0.11));
        float n2 = fbm(p * 7.0 - vec2(time * 0.08, time * 0.21));
        float cover = smoothstep(0.0, 0.25, wipe * 1.35 - (1.0 - n) * 0.6 + n2 * 0.1);
        vec3 wc;
        if (wipeType < 1.5) {
          wc = mix(vec3(0.62, 0.62, 0.64), vec3(0.93, 0.92, 0.9), n);
          float em = smoothstep(0.92, 0.99, hash12(floor(p * 90.0 + vec2(0.0, time * 4.0))));
          wc += vec3(1.0, 0.55, 0.2) * em * 0.8 * n2;
        } else if (wipeType < 2.5) {
          float needles = fbm(vec2(p.x * 40.0, p.y * 6.0) + n * 3.0);
          wc = mix(vec3(0.02, 0.05, 0.035), vec3(0.08, 0.15, 0.1), needles);
          wc = mix(wc, vec3(0.86, 0.9, 0.95), smoothstep(0.62, 0.8, n2) * 0.9);
        } else {
          float weave = sin(uv.y * res.y * 0.9) * 0.5 + 0.5;
          wc = mix(vec3(0.07, 0.1, 0.11), vec3(0.17, 0.22, 0.23), n * 0.8 + weave * 0.08);
        }
        col = mix(col, wc, cover);
      }
      col = mix(col, vec3(0.0), fade);
      // ordered dither to kill banding in fog
      col += (hash12(gl_FragCoord.xy) - 0.5) / 255.0;
      gl_FragColor = vec4(col, 1.0);
    }`, {
    tComp: { value: null }, tBloom: { value: null }, res: { value: new THREE.Vector2() }, time: { value: 0 }, exposure: { value: 1 }, bloomStr: { value: 0.5 },
    sat: { value: 1 }, contrast: { value: 1 }, vignette: { value: 0.35 }, grain: { value: 0.05 }, ca: { value: 0.6 },
    lift: { value: R.grade.lift }, gamma: { value: R.grade.gamma }, gain: { value: R.grade.gain }, tint: { value: R.grade.tint },
    wipe: { value: 0 }, wipeType: { value: 1 }, fade: { value: 0 }, desat: { value: 0 }, rage: { value: 0 }, hold: { value: 0 }, flash: { value: 0 }, lowHealth: { value: 0 },
  });
}

function setDofTaps(n) {

function makeRT(w, h, opts = {}) {
  const rt = new THREE.WebGLRenderTarget(Math.max(1, w | 0), Math.max(1, h | 0), {
    type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    depthBuffer: !!opts.depth, stencilBuffer: false, samples: opts.samples || 0, generateMipmaps: false,
  });
  rt.texture.colorSpace = THREE.LinearSRGBColorSpace;
  if (opts.depth) { rt.depthTexture = new THREE.DepthTexture(rt.width, rt.height, THREE.FloatType); rt.depthTexture.minFilter = THREE.NearestFilter; rt.depthTexture.magFilter = THREE.NearestFilter; }
  return rt;
}

function resizeRenderer(force) {
  const q = QUALITY[SETTINGS.quality] || QUALITY.balanced;
  const dw = Math.max(320, window.innerWidth), dh = Math.max(200, window.innerHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, q.pixelRatioCap);
  R.displayW = dw; R.displayH = dh; R.dpr = dpr;
  R.renderer.setPixelRatio(dpr);
  R.renderer.setSize(dw, dh, false);
  R.camera.aspect = dw / dh; R.camera.updateProjectionMatrix();
  let iw = Math.round(dw * dpr * R.scale * q.res * SETTINGS.resScale), ih = Math.round(dh * dpr * R.scale * q.res * SETTINGS.resScale);
  if (SETTINGS.retro480) { ih = 480; iw = Math.round(480 * dw / dh); }
  iw = Math.max(160, iw); ih = Math.max(90, ih);
  if (!force && iw === R.w && ih === R.h) return;
  R.w = iw; R.h = ih;
  [R.rtScene, R.rtHalf, R.rtDof, R.rtComp, ...R.bloomRTs].forEach(rt => rt && rt.dispose());
  R.rtScene = makeRT(iw, ih, { depth: true, samples: q.msaa });
  R.rtHalf = makeRT(iw / 2, ih / 2);
  R.rtDof = makeRT(iw / 2, ih / 2);
  R.rtComp = makeRT(iw, ih);
  const nearest = SETTINGS.retro480 ? THREE.NearestFilter : THREE.LinearFilter;
  R.rtComp.texture.minFilter = R.rtComp.texture.magFilter = nearest;
  (R.bloomUp || []).forEach(rt => rt.dispose());
  R.bloomRTs = []; R.bloomUp = [];
  let bw = iw / 2, bh = ih / 2;
  for (let i = 0; i < q.bloom; i++) { R.bloomRTs.push(makeRT(bw, bh)); R.bloomUp.push(makeRT(bw, bh)); bw /= 2; bh /= 2; }
  const fc = $('fx2d'); fc.width = Math.round(dw * Math.min(dpr, 1.5)); fc.height = Math.round(dh * Math.min(dpr, 1.5));
  if (typeof UI !== 'undefined' && UI.fxScale !== undefined) UI.fxScale = fc.width / dw;
}

function blit(mat, target) { R.quad.material = mat; R.renderer.setRenderTarget(target); R.renderer.render(R.quadScene, R.quadCam); }

function renderFrame(dt, realDt) {

  for (const f of R.preRenders) f(dt);

  r.setRenderTarget(R.rtScene);
  r.render(R.scene, cam);
  R.stats.calls = r.info.render.calls; R.stats.tris = r.info.render.triangles;
  const q = QUALITY[SETTINGS.quality] || QUALITY.balanced;
  const dofOn = SETTINGS.dof ? P.dof : 0;
  const maxCoc = 12 * (R.h / 1080) * 0.5 * (q.dofTaps >= 32 ? 1 : 0.8);
  // CoC
  const mc = R.mats.coc.uniforms;
  mc.tColor.value = R.rtScene.texture; mc.tDepth.value = R.rtScene.depthTexture;
  mc.near.value = cam.near; mc.far.value = cam.far; mc.focal.value = P.focal; mc.fstop.value = P.fStop; mc.focus.value = P.focusDist;
  mc.imgH.value = R.h; mc.maxCoc.value = Math.max(0.01, maxCoc); mc.strength.value = dofOn; mc.texel.value.set(1 / R.w, 1 / R.h);

  blit(R.mats.gather, R.rtDof);

  const mp = R.mats.comp.uniforms;
  mp.tColor.value = R.rtScene.texture; mp.tDof.value = R.rtDof.texture; mp.tHalf.value = R.rtHalf.texture;
  mp.time.value = P.time; mp.aspect.value = R.w / R.h; mp.hazeR.value = P.hazeR; mp.dofOn.value = dofOn > 0.01 ? 1 : 0;
  if (!SETTINGS.motionBlur || q.motionBlur === 0) P.whip.set(0, 0);
  blit(R.mats.comp, R.rtComp);
  // bloom
  const B = R.bloomRTs;
  if (B.length && SETTINGS.bloom) {
    const bp = R.mats.bloomPre.uniforms; bp.tSrc.value = R.rtComp.texture; bp.texel.value.set(1 / R.w, 1 / R.h); bp.threshold.value = P.bloomThreshold;
    blit(R.mats.bloomPre, B[0]);
    const md = R.mats.down.uniforms;
    for (let i = 1; i < B.length; i++) { md.tSrc.value = B[i - 1].texture; md.texel.value.set(1 / B[i - 1].width, 1 / B[i - 1].height); blit(R.mats.down, B[i]); }
    const mu = R.mats.up.uniforms, UP2 = R.bloomUp;
    let src = B[B.length - 1];
    for (let i = B.length - 2; i >= 0; i--) { mu.tSrc.value = src.texture; mu.tAdd.value = B[i].texture; mu.texel.value.set(1 / src.width, 1 / src.height); mu.mixAmt.value = 1; blit(R.mats.up, UP2[i]); src = UP2[i]; }
    R.bloomOut = src;
  }
  // final
  const mf = R.mats.final.uniforms;
  mf.tComp.value = R.rtComp.texture; mf.tBloom.value = B.length && R.bloomOut ? R.bloomOut.texture : R.rtComp.texture;
  mf.res.value.set(r.domElement.width, r.domElement.height);
  mf.time.value = P.time; mf.exposure.value = R.grade.exposure; mf.bloomStr.value = SETTINGS.bloom && B.length ? P.bloom : 0;
  mf.sat.value = R.grade.sat; mf.contrast.value = R.grade.contrast; mf.vignette.value = P.vignette;
  mf.grain.value = SETTINGS.grain ? P.grain : 0; mf.ca.value = SETTINGS.ca ? P.ca : 0;
  mf.wipe.value = P.wipe; mf.wipeType.value = P.wipeType; mf.fade.value = P.fade; mf.desat.value = P.desat; mf.rage.value = P.rage; mf.hold.value = P.hold;
  mf.flash.value = P.flash; mf.lowHealth.value = P.lowHealth;
  blit(R.mats.final, null);

  // dynamic resolution (frame-time driven, 5% steps, 50–100%)
  if (q.dynRes && !SETTINGS.retro480) {
    R.frameMs = lerp(R.frameMs, realDt * 1000, 0.05);
    R.dynTimer += realDt;
    if (R.dynTimer > 1.5) {
      R.dynTimer = 0;
      const target = 1000 / 60;
      let s = R.scale;
      if (R.frameMs > target * 1.18) s -= 0.05; else if (R.frameMs < target * 0.85) s += 0.05;
      s = clamp(s, 0.5, 1);
      if (Math.abs(s - R.scale) > 0.001) { R.scale = s; resizeRenderer(false); }
    }
  }
}

// Compile every material while everything is visible, so the take never hitches (§12.4)
async function warmShaders(extraRoots = []) {
  const hidden = [];
  const reveal = o => o.traverse(c => { if (!c.visible) { hidden.push(c); c.visible = true; } });
  reveal(R.scene); extraRoots.forEach(reveal);
  try {
    if (R.renderer.compileAsync) await R.renderer.compileAsync(R.scene, R.camera);
    else R.renderer.compile(R.scene, R.camera);
    for (const root of extraRoots) R.renderer.compile(root, R.camera);
  } catch (e) { console.warn('warm-up', e); }
  // one real frame through the whole stack
  R.renderer.setRenderTarget(R.rtScene); R.renderer.render(R.scene, R.camera);
  hidden.forEach(c => { c.visible = false; });
  for (const k in R.mats) { R.quad.material = R.mats[k]; R.renderer.compile(R.quadScene, R.quadCam); }
}

// ---------- canvas textures ----------
function canvasTex(w, h, draw, { repeat = false, nearest = true, srgb = true } = {}) {

const TEX = {};

    for (let i = 0; i < 10; i++) { g.fillStyle = 'rgba(20,14,10,.6)'; g.fillRect(r() * w, r() * h, 3 + r() * 5, 1); }
  }, { repeat: true });
  TEX.birch = canvasTex(32, 64, (g, w, h) => {
    noiseFill(g, w, h, [222, 220, 212], 18);
    const r = mulberry32(8);

    for (let x = 0; x < w; x += 32) { g.fillStyle = 'rgba(25,16,10,.5)'; g.fillRect(x + (r() * 6 | 0), 0, 1, h); }
  }, { repeat: true });

    for (let i = 0; i < 30; i++) { g.fillStyle = 'rgba(40,25,14,.35)'; g.fillRect(r() * w, r() * h, 1, 4 + r() * 10); }
  }, { repeat: true });
  TEX.concrete = canvasTex(64, 64, (g, w, h) => {
    noiseFill(g, w, h, [128, 132, 134], 30);
    const r = mulberry32(13);
    for (let i = 0; i < 12; i++) { g.strokeStyle = 'rgba(50,52,54,.6)'; g.beginPath(); let x = r() * w, y = r() * h; g.moveTo(x, y); for (let k = 0; k < 4; k++) { x += (r() - .5) * 14; y += (r() - .5) * 14; g.lineTo(x, y); } g.stroke(); }
    for (let i = 0; i < 6; i++) { g.fillStyle = 'rgba(110,70,40,.35)'; g.fillRect(r() * w, r() * h, 2 + r() * 6, 8 + r() * 20); }
  }, { repeat: true });
  TEX.stone = canvasTex(64, 64, (g, w, h) => { noiseFill(g, w, h, [104, 108, 112], 36); }, { repeat: true });
  TEX.snow = canvasTex(64, 64, (g, w, h) => {
    noiseFill(g, w, h, [236, 240, 246], 14);
    const r = mulberry32(14);
    for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(190,205,225,${r() * .35})`; g.beginPath(); g.arc(r() * w, r() * h, 1 + r() * 4, 0, TAU); g.fill(); }
  }, { repeat: true });
  TEX.ice = canvasTex(128, 128, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, w, h); grd.addColorStop(0, '#6f9fb3'); grd.addColorStop(1, '#4f7f95'); g.fillStyle = grd; g.fillRect(0, 0, w, h);
    const r = mulberry32(15);
    for (let i = 0; i < 80; i++) { g.fillStyle = `rgba(230,245,255,${r() * .25})`; g.fillRect(r() * w, r() * h, 1 + r() * 18, 1); }

  }, { repeat: true });
  TEX.wool = canvasTex(32, 32, (g, w, h) => {
    noiseFill(g, w, h, [200, 200, 200], 40);
    for (let y = 0; y < h; y += 2) { g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(0, y, w, 1); }
  }, { repeat: true });
  TEX.fur = canvasTex(32, 32, (g, w, h) => {
    noiseFill(g, w, h, [200, 196, 186], 70);
    const r = mulberry32(21);
    for (let i = 0; i < 60; i++) { g.fillStyle = `rgba(255,255,255,${r() * .3})`; g.fillRect(r() * w, r() * h, 1, 3 + r() * 4); }
  }, { repeat: true });
  TEX.fleece = canvasTex(64, 64, (g, w, h) => { // shroud stitched from navy and teal staff fleeces
    const r = mulberry32(22), cols = ['#1d2b4a', '#16244a', '#0f6f73', '#13878a', '#22325a', '#0c5b60'];
    for (let y = 0; y < h; y += 16) for (let x = 0; x < w; x += 16) { g.fillStyle = cols[(r() * cols.length) | 0]; g.fillRect(x, y, 16, 16); }
    g.strokeStyle = 'rgba(230,230,210,.55)'; g.setLineDash([2, 2]);
    for (let y = 0; y <= h; y += 16) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(w, y + .5); g.stroke(); }
    for (let x = 0; x <= w; x += 16) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, h); g.stroke(); }
    g.fillStyle = 'rgba(255,207,31,.75)'; g.font = 'bold 7px sans-serif'; g.fillText('yes', 20, 27);
  }, { repeat: true });
  TEX.cardboard = canvasTex(32, 32, (g, w, h) => { noiseFill(g, w, h, [176, 134, 88], 22); g.fillStyle = 'rgba(90,60,30,.4)'; g.fillRect(0, 14, w, 3); }, { repeat: true });
  TEX.rock = canvasTex(64, 64, (g, w, h) => {
    const r = mulberry32(31);
    for (let y = 0; y < h; y++) { const band = Math.sin(y * 0.45 + Math.sin(y * 0.13) * 2) * 0.5 + 0.5; const c = [168 + band * 40, 74 + band * 30, 44 + band * 16]; g.fillStyle = `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`; g.fillRect(0, y, w, 1); }
    for (let i = 0; i < 200; i++) { g.fillStyle = `rgba(${r() < .5 ? '60,24,14' : '230,170,120'},${r() * .3})`; g.fillRect(r() * w, r() * h, 1 + r() * 3, 1); }
  }, { repeat: true });
}

const MATS = {};
function patchWorld(mat, { snow = 0, sway = 0, swayH = 10, sparkle = false, wobble = false } = {}) {
  mat.userData.snow = { value: snow };

  mat.customProgramCacheKey = () => key + mat.type;
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.time; sh.uniforms.uWind = U.wind; sh.uniforms.uGust = U.gust; sh.uniforms.uSnowColor = U.snowColor;
    sh.uniforms.uSnow = mat.userData.snow; sh.uniforms.uSwayAmt = mat.userData.swayAmt; sh.uniforms.uSparkle = U.sparkle; sh.uniforms.uWobble = U.wobble;

      .replace('#include <common>', `#include <common>
        uniform float uTime, uGust, uSwayAmt, uWobble; uniform vec2 uWind; varying vec3 vSnowN; varying vec3 vSnowW;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        ${sway > 0 ? `{
          float hh = max(position.y, 0.0) / ${swayH.toFixed(1)};
          vec2 ip = vec2(0.0);
          #ifdef USE_INSTANCING
            ip = instanceMatrix[3].xz;
          #endif
          float ph = dot(ip, vec2(0.13, 0.17));
          float s = sin(uTime * 1.3 + ph) * 0.6 + sin(uTime * 2.9 + ph * 1.7) * 0.22;
          transformed.xz += uWind * (s * 0.5 + uGust * 1.4) * hh * hh * uSwayAmt;

      .replace('#include <defaultnormal_vertex>', `#include <defaultnormal_vertex>
        vSnowN = inverseTransformDirection(transformedNormal, viewMatrix);`)

        { vec4 swp = vec4(transformed, 1.0);
          #ifdef USE_INSTANCING
            swp = instanceMatrix * swp;
          #endif
          vSnowW = (modelMatrix * swp).xyz; }
        ${wobble ? 'if (uWobble > 0.5) { gl_Position.xy = floor(gl_Position.xy / gl_Position.w * 120.0) / 120.0 * gl_Position.w; }' : ''}`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform vec3 uSnowColor; uniform float uSnow, uSparkle, uTime; varying vec3 vSnowN; varying vec3 vSnowW;
        float sHash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

        ${sparkle ? `{ float g = sHash(floor(vSnowW.xz * 26.0) + floor(cameraPosition.xz * 1.7 + vSnowW.y));

    for (const key of ENV_KEYS_COLOR) c[key].copy(a[key]).lerp(b[key], k);
    for (const key of ENV_KEYS_NUM) c[key] = lerp(a[key], b[key], k);
    for (const key of ENV_KEYS_VEC) c[key].copy(a[key]).lerp(b[key], k);
    c.sunDir.normalize();
  }
  applyEnv();
  // rage push (§7.9) layered on top of any grade
  if (ENV.rageMix > 0) { R.grade.contrast += ENV.rageMix * 0.1; R.grade.sat += ENV.rageMix * 0.1; }
  // sky follows the camera
  ENV.sky.position.copy(R.camera.position);
  // shadow box follows what the camera looks at, snapped to texels to stop shimmer
  const f = ENV.focus.copy(CAM.final.aim).lerp(CAM.final.pos, 0.55);
  const sun = ENV.sun, sc = sun.shadow.camera, ts = (sc.right - sc.left) / sun.shadow.mapSize.x;
  f.x = Math.round(f.x / ts) * ts; f.z = Math.round(f.z / ts) * ts; f.y = Math.round(f.y / ts) * ts;
  sun.position.copy(f).addScaledVector(ENV.cur.sunDir, 70);
  sun.target.position.copy(f);
  sun.target.updateMatrixWorld();
  // practical lights flicker
  const t = U.time.value;
  for (let i = 0; i < ENV.lights.length; i++) {
    const l = ENV.lights[i], ud = l.userData;
    let k = 1;
    if (ud.flicker) k = 1 - ud.flicker * (0.5 + 0.5 * Noise.n2(t * 7.3, i * 5.1)) * 0.6 - ud.flicker * 0.2 * Math.max(0, Noise.n2(t * 19, i * 3.3));
    l.intensity = ud.base * k;
    l.visible = true;
  }
}

const PINE_GREENS = [0x1f3a2c, 0x24402f, 0x1b3327, 0x2a4634, 0x203b30];
function pineGeo(h, r, layers, seed, { trunkH = 0.36 } = {}) {
  const gb = new GB(), rr = mulberry32(seed);
  gb.cyl(r * 0.07, r * 0.12, h * trunkH, 5, { pos: [0, h * trunkH / 2, 0], color: 0x4a3526, ao: 0.4 });
  for (let i = 0; i < layers; i++) {
    const t = i / (layers - 1);
    const y0 = h * (0.16 + t * 0.6), lr = r * (1 - t * 0.8) * (0.9 + rr() * 0.2), lh = h * (0.36 - t * 0.12);
    gb.cone(lr, lh, 7, { pos: [rr() * 0.1, y0 + lh / 2, rr() * 0.1], rot: [0, rr() * TAU, 0], color: PINE_GREENS[i % PINE_GREENS.length], ao: 0.5, aoY0: y0, aoY1: y0 + lh * 0.9, jitter: 0.12 });
  }
  return gb.build();
}
function birchGeo(h, seed) {
  const gb = new GB(), r = mulberry32(seed);
  gb.cyl(0.07, 0.13, h, 6, { pos: [0, h / 2, 0], color: 0xe6e3da, uvScale: [1, 3] });
  for (let i = 0; i < 6; i++) {
    const y = h * (0.45 + r() * 0.45), a = r() * TAU, l = 0.8 + r() * 1.3;
    gb.strut([0, y, 0], [Math.cos(a) * l, y + l * 0.7, Math.sin(a) * l], 0.05, { color: 0x5a524a, round: true });
  }
  // a few sparse leafy clumps (autumn gold, frosted)
  for (let i = 0; i < 4; i++) gb.ico(0.6 + r() * 0.5, 0, { pos: [(r() - .5) * 1.8, h * (0.7 + r() * 0.3), (r() - .5) * 1.8], color: r() < .5 ? 0xb69a4c : 0x8c8a5a, jitter: 0.2 });
  return gb.build();
}
function deadTreeGeo(h, seed) {
  const gb = new GB(), r = mulberry32(seed);
  gb.cyl(0.12, 0.25, h, 6, { pos: [0, h / 2, 0], color: 0x5b5047 });
  const branch = (p, dir, len, th, depth) => {
    const e = [p[0] + dir[0] * len, p[1] + dir[1] * len, p[2] + dir[2] * len];
    gb.strut(p, e, th, { color: 0x5b5047, round: true, seg: 4 });
    if (depth > 0) for (let k = 0; k < 2; k++) {
      const nd = [dir[0] + (r() - .5) * 1.2, dir[1] + r() * 0.3, dir[2] + (r() - .5) * 1.2], l = Math.hypot(...nd);
      branch(e, nd.map(v => v / l), len * 0.65, th * 0.6, depth - 1);
    }
  };
  for (let i = 0; i < 4; i++) { const a = i * 1.7 + r(); branch([0, h * (0.55 + i * 0.1), 0], [Math.cos(a) * 0.8, 0.6, Math.sin(a) * 0.8], h * 0.3, 0.12, 2); }
  return gb.build();
}
function rockGeo(seed, s = 1) {
  const g = new THREE.IcosahedronGeometry(1, 1), r = mulberry32(seed), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const k = 0.75 + r() * 0.45; p.setXYZ(i, p.getX(i) * k * 1.2, p.getY(i) * k * 0.7, p.getZ(i) * k); }
  g.computeVertexNormals();
  const gb = new GB(); gb.add(g, { scale: s, color: 0x707a80, jitter: 0.25 });
  return gb.build();
}

const VEG = { pines: [], birch: null, rocks: null };
function buildVegetation() {
  const variants = [pineGeo(12, 2.6, 5, 11), pineGeo(15, 3.0, 6, 23), pineGeo(9, 2.2, 4, 37), pineGeo(18, 3.4, 6, 41)];
  const spots = [[], [], [], []];
  const r = mulberry32(2024);
  const tryTree = (x, z, minWalk) => {
    const wd = walkDist(x, z);
    if (wd < minWalk) return false;
    if (x > cliffX(z) - 3) return false;
    if (Math.hypot(x - LOC.longhouse.x, z - LOC.longhouse.z) < 16) return false;
    const y = terrainHeight(x, z); if (y < 1) return false;
    const v = (r() * 4) | 0, s = 0.75 + r() * 0.55;
    spots[v].push([x, y - 0.2, z, r() * TAU, s]);
    if (wd < 6) addCollider({ x, z, r: 0.35 * s, h: 14, tag: 'tree' });
    return true;
  };
  // dense near the paths, sparser far away
  for (let x = TER.x0 + 4; x < TER.x0 + TER.w - 4; x += 5.2) for (let z = TER.z0 + 4; z < TER.z0 + TER.d - 4; z += 5.2) {
    const jx = x + (r() - .5) * 4.6, jz = z + (r() - .5) * 4.6;
    const wd = walkDist(jx, jz);
    const p = wd < 30 ? 0.86 : wd < 70 ? 0.6 : 0.42;
    if (r() < p) tryTree(jx, jz, 1.6 + r() * 1.5);
  }
  // the treeline frames the Zee shot: a few big boughs near the yard edge
  variants.forEach((g, i) => {
    const list = spots[i]; if (!list.length) return;
    const im = new THREE.InstancedMesh(g, MATS.pine, list.length);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = V3(), p = V3(), c = new THREE.Color();
    list.forEach((t, k) => { p.set(t[0], t[1], t[2]); q.setFromAxisAngle(UP, t[3]); s.set(t[4], t[4] * (0.9 + (k % 5) * 0.05), t[4]); m.compose(p, q, s); im.setMatrixAt(k, m); c.setScalar(0.85 + ((k * 7919) % 100) / 100 * 0.3); im.setColorAt(k, c); });
    im.castShadow = true; im.receiveShadow = true; im.name = 'pines' + i; im.userData.spots = list;
    R.scene.add(im); VEG.pines.push(im);
  });
  VEG.treeCount = spots.reduce((a, l) => a + l.length, 0);

  // birches: Zee's clearing, the yard door, the grove
  const bg = [birchGeo(9, 3), birchGeo(11, 5), birchGeo(7.5, 9)];
  const bl = [[], [], []];
  const birchAt = (x, z) => { const y = terrainHeight(x, z); bl[(bl[0].length + bl[1].length + bl[2].length) % 3].push([x, y - 0.1, z, r() * TAU, 0.85 + r() * 0.3]); addCollider({ x, z, r: 0.18, h: 10, tag: 'tree' }); };
  for (let i = 0; i < 26; i++) { const a = r() * TAU, d = 10 + r() * 9; birchAt(LOC.zee.x + Math.cos(a) * d, LOC.zee.z + Math.sin(a) * d * 0.8); }
  for (let i = 0; i < 6; i++) { const a = r() * TAU, d = 9 + r() * 5; birchAt(LOC.grove.x + Math.cos(a) * d, LOC.grove.z + Math.sin(a) * d); }
  birchAt(-4.2, -95.8); // the wind-chime birch by the door
  bg.forEach((g, i) => {
    if (!bl[i].length) return;
    const im = new THREE.InstancedMesh(g, MATS.birch, bl[i].length), m = new THREE.Matrix4(), q = new THREE.Quaternion();
    bl[i].forEach((t, k) => { q.setFromAxisAngle(UP, t[3]); m.compose(V3(t[0], t[1], t[2]), q, V3(t[4], t[4], t[4])); im.setMatrixAt(k, m); });
    im.castShadow = true; im.receiveShadow = true; R.scene.add(im);
  });

  // boulders with moss on their north sides
  const rg = rockGeo(5, 1);
  const rocks = [];
  for (let i = 0; i < 140; i++) {
    const x = TER.x0 + 20 + r() * (TER.w - 40), z = TER.z0 + 20 + r() * (TER.d - 40), wd = walkDist(x, z);
    if (wd < -1 || wd > 26 || x > cliffX(z) - 2) continue;
    const s = 0.4 + r() * 1.3; rocks.push([x, terrainHeight(x, z) - s * 0.25, z, r() * TAU, s]);
    if (wd < 2) addCollider({ x, z, r: s * 1.0, h: s * 1.2, tag: 'rock' });
  }
  const rim = new THREE.InstancedMesh(rg, MATS.stone, rocks.length), m = new THREE.Matrix4(), q = new THREE.Quaternion();
  rocks.forEach((t, k) => { q.setFromAxisAngle(UP, t[3]); m.compose(V3(t[0], t[1], t[2]), q, V3(t[4], t[4], t[4])); rim.setMatrixAt(k, m); });
  rim.castShadow = true; rim.receiveShadow = true; R.scene.add(rim);
}

// hide the pines that stand in a long-lens sightline (a→b, plus the lens itself); returns the undo
function clearSightline(segs, r = 2.2) {
  const hidden = [], m = new THREE.Matrix4(), zero = new THREE.Matrix4().makeScale(0, 0, 0);
  const segD = (x, z, a, b) => { const dx = b.x - a.x, dz = b.z - a.z, L2 = dx * dx + dz * dz || 1, t = clamp01(((x - a.x) * dx + (z - a.z) * dz) / L2); return Math.hypot(x - a.x - dx * t, z - a.z - dz * t); };
  VEG.pines.forEach(im => {
    im.userData.spots.forEach((t, k) => {
      if (!segs.some(([a, b]) => segD(t[0], t[2], a, b) < r + t[4] * 1.6)) return;
      im.getMatrixAt(k, m); hidden.push([im, k, m.clone()]); im.setMatrixAt(k, zero); im.instanceMatrix.needsUpdate = true;
    });
  });
  return (VEG.undo = () => { VEG.undo = null; for (const [im, k, mm] of hidden) { im.setMatrixAt(k, mm); im.instanceMatrix.needsUpdate = true; } });
}

function buildLonghouse() {
  const X0 = -22, X1 = -6, Z0 = -96, Z1 = -88, CX = (X0 + X1) / 2, CZ = (Z0 + Z1) / 2;
  const G = groundHeight(CX, CZ), FY = G + 0.8, WH = 2.9, RIDGE = FY + WH + 2.15, T = 0.3;
  OBJ.house = { X0, X1, Z0, Z1, G, FY, RIDGE, CX, CZ };
  const shell = new GB();
  // foundation stones, with a gap on the south side (the final pull-out leaves through it)
  const r = mulberry32(55);
  const stoneRow = (ax, az, bx, bz, skip) => {
    const len = Math.hypot(bx - ax, bz - az), n = Math.ceil(len / 0.7);
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n, x = lerp(ax, bx, t), z = lerp(az, bz, t);
      if (skip && skip(x, z)) continue;
      shell.box(0.68, FY - G - 0.1 + r() * 0.06, 0.42, { pos: [x, G + (FY - G) / 2 - 0.08, z], rot: [0, Math.atan2(bx - ax, bz - az), 0], color: 0x6c6f72, jitter: 0.25 });
    }
  };
  stoneRow(X0, Z0, X1, Z0); stoneRow(X0, Z1, X1, Z1, (x) => x > -12.9 && x < -11.4); stoneRow(X0, Z0, X0, Z1); stoneRow(X1, Z0, X1, Z1);
  // log walls

  const DZ0 = -92.9, DZ1 = -91.1, DH = 2.25;
  wall(X1 - T / 2, X1 + T / 2, DZ1, Z1, FY - 0.12, FY + WH);  // east, south of the door
  wall(X1 - T / 2, X1 + T / 2, Z0, DZ0, FY - 0.12, FY + WH);  // east, north of the door
  wall(X1 - T / 2, X1 + T / 2, DZ0, DZ1, FY + DH, FY + WH);   // lintel
  const wallMesh = shell.mesh(MATS.logs); R.scene.add(wallMesh);
  // gables and roof

  const gg = new THREE.ExtrudeGeometry(gable, { depth: T, bevelEnabled: false }); gg.rotateY(PI / 2);

  roofB.add(gg, { pos: [X1 - T / 2, FY + WH, CZ], color: 0x8a6143, uvScale: [0.3, 0.3] });
  const slope = Math.atan2(2.15, 4.4), sl = Math.hypot(4.4, 2.15) + 0.55;

  roofB.box(X1 - X0 + 1.2, 0.26, sl, { pos: [CX, RIDGE - 1.08 - 0.12, CZ - 2.2 - 0.22], rot: [-slope, 0, 0], color: 0x5d4330 });

  // steps
  front.box(1.3, 0.38, 2.4, { pos: [X1 + 0.85, G + 0.19, CZ], color: 0x707478, jitter: 0.15 });

function farMaterial(haze, opts = {}) {
  const m = new THREE.MeshLambertMaterial({ vertexColors: true, fog: false, ...opts });
  m.userData.haze = { value: haze };
  m.customProgramCacheKey = () => 'far';
  m.onBeforeCompile = sh => {
    sh.uniforms.uFarFog = { value: R.scene.fog.color }; sh.uniforms.uHaze = m.userData.haze;
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform vec3 uFarFog; uniform float uHaze;')
      .replace('#include <dithering_fragment>', '#include <dithering_fragment>\ngl_FragColor.rgb = mix(gl_FragColor.rgb, uFarFog, uHaze);');
  };
  return m;
}

function buildBay() {
  // the ice
  TEX.ice.repeat.set(220, 220);
  const ice = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000, 1, 1), MATS.ice);
  ice.rotation.x = -PI / 2; ice.position.set(1500, 0.02, 0); ice.receiveShadow = true; ice.name = 'ice';
  R.scene.add(ice);
  // floes, snow-capped
  const fl = new GB(), r = mulberry32(404);
  for (let i = 0; i < 90; i++) {
    const x = 70 + r() * 900, z = -500 + r() * 1100; if (x < 120 && z > 120 && z < 175) continue;
    const g = new THREE.CylinderGeometry(1, 1, 1, 7, 1); const p = g.attributes.position;
    for (let k = 0; k < p.count; k++) { const a = Math.atan2(p.getZ(k), p.getX(k)), j = 0.65 + 0.35 * Noise.n2(Math.cos(a) * 2 + i, Math.sin(a) * 2); p.setX(k, p.getX(k) * j); p.setZ(k, p.getZ(k) * j); }
    const s = 3 + r() * 11; fl.add(g, { pos: [x, 0.15, z], scale: [s, 0.35 + r() * 0.4, s * (0.6 + r() * 0.6)], rot: [0, r() * 3, 0], color: 0xdbe5ec });
  }
  // islands, far shore
  for (const [x, z, s] of [[720, -260, 70], [980, 120, 110], [640, 420, 60], [1300, -500, 160], [1500, 300, 220]]) fl.add(new THREE.SphereGeometry(1, 14, 8, 0, TAU, 0, PI / 2), { pos: [x, -2, z], scale: [s, s * 0.32, s * 0.8], color: 0xcfd9e2 });
  const floes = new THREE.Mesh(fl.build(), patchWorld(new THREE.MeshLambertMaterial({ vertexColors: true }), { snow: 1 }));
  floes.receiveShadow = true; R.scene.add(floes);

  // the hill ring around the play area (west, north, south)
  const ring = new THREE.RingGeometry(360, 1100, 160, 6);
  ring.rotateX(-PI / 2);
  const rp = ring.attributes.position, rc = new Float32Array(rp.count * 3), col = new THREE.Color();
  for (let k = 0; k < rp.count; k++) {
    const x = rp.getX(k), z = rp.getZ(k) - 20, d = Math.hypot(x, z), a = Math.atan2(z, x);
    const east = smoothstep(-0.2, 0.6, Math.cos(a)); // the bay side stays low
    let h = (Noise.fbm2(x * 0.004, z * 0.004, 4) * 0.5 + 0.6) * smoothstep(360, 600, d) * 170 * (1 - east * 0.9) + 18 * (1 - east);
    rp.setY(k, h - 4); rp.setZ(k, z + 20);
    col.setHex(0x1d2f2c).lerp(new THREE.Color(0xe8eef3), smoothstep(70, 140, h) * 0.9);
    rc.set([col.r, col.g, col.b], k * 3);
  }
  ring.setAttribute('color', new THREE.BufferAttribute(rc, 3)); ring.computeVertexNormals();
  const hills = new THREE.Mesh(ring, farMaterial(0.55, { side: THREE.DoubleSide })); hills.position.set(20, 0, -20); R.scene.add(hills);

  // the Mountain, far south-west, bristling with ancient transmission towers
  const M = LOC.mountain;
  const mg = new THREE.ConeGeometry(420, 470, 48, 14), mp = mg.attributes.position, mc = new Float32Array(mp.count * 3);
  for (let k = 0; k < mp.count; k++) {
    const x = mp.getX(k), y = mp.getY(k), z = mp.getZ(k), t = (y + 235) / 470;
    const n = Noise.fbm2(x * 0.01, z * 0.01 + y * 0.005, 4);
    const j = 1 + n * 0.28 * (1 - t);
    mp.setXYZ(k, x * j, y + n * 40 * (1 - t * 0.5), z * j);
    col.setHex(0x55626e).lerp(new THREE.Color(0xf2f6fa), smoothstep(0.35, 0.55, t + n * 0.2));

// interactable prompt + use
let currentInteract = null;
function updateInteract() {
  currentInteract = null;
  if (!PLAYER || !PLAYER.control || G.combat || PLAYER.state !== 'free' || G.inputLock || DIR.busyInteract) { promptHide('interact'); return; }
  let best = null, bd = 1e9;
  for (const it of INTERACT) {
    if (it.done || !it.enabled()) continue;
    const p = it.pos; if (!p) continue;
    const d = dist2D(p, PLAYER.pos); if (d > it.r) continue;
    if (d < bd) { bd = d; best = it; }
  }
  currentInteract = best;
  if (best) prompt('interact', best.label, { key: 'interact', sticky: true }); else promptHide('interact');
  if (best && (wasPressed('interact')) && !DLG.line) {
    if (best.once) best.done = true;
    DIR.busyInteract = true; promptHide('interact');
    PLAYER.vel.set(0, 0, 0);
    Promise.resolve(best.use()).catch(e => { if (!e.isAbort) console.warn(e); }).finally(() => { DIR.busyInteract = false; });
  }
}

const TWEENS = [];

}
function updateTweens(dt) {
  for (let i = TWEENS.length - 1; i >= 0; i--) {

      g.restore();
    }
  }

    project(BOSS.headPos(_v[0]).add(_v[1].set(0, 1, 0)), sp);

  }

  const cbCols = SETTINGS.cbPalette === 'cb' ? { white: '#ffffff', teal: '#5aa0ff', red: '#ffb000' } : cols;
  for (const e of ENEMIES) {
    if (!e.alive || !e.telegraph) continue;
    const kind = e.telegraph(); if (!kind) continue;
    project(e.hitPoint(_v[2]), sp);

    if (on && e.kind !== 'hamarr') { g.save(); g.translate(sp.x, sp.y - 40); g.fillStyle = cbCols[kind]; g.globalAlpha = UI.hudA * (0.6 + Math.sin(G.realTime * 18) * 0.4); g.beginPath(); g.arc(0, 0, kind === 'red' ? 6 : 4, 0, TAU); g.fill(); g.restore(); continue; }
    if (on) continue;
    const rel = _v[3].copy(e.pos).sub(R.camera.position), right = _v[4].set(1, 0, 0).applyQuaternion(R.camera.quaternion), fwd = _v[5].copy(CAM.final.fwd).setY(0).normalize();
    const ang = Math.atan2(rel.dot(right), rel.dot(fwd));

  letters.forEach((s, i) => { s.style.transition = 'none'; s.style.transform = `translate(${(frand() - 0.5) * 600}px, ${-200 - frand() * 300}px) scale(0.3)`; s.style.opacity = 0; s.style.filter = 'blur(8px)'; });
  requestAnimationFrame(() => { t.style.transition = 'opacity 2s'; t.style.opacity = 1; letters.forEach((s, i) => { s.style.transition = `transform ${3 + frand()}s cubic-bezier(.2,.7,.2,1) ${i * 0.08}s, opacity 2.5s ${i * 0.08}s, filter 3s ${i * 0.08}s`; s.style.transform = ''; s.style.opacity = 1; s.style.filter = ''; }); });
};
UI.showEnd = () => {
  const p = $('endPanel'), S = G.stats, mins = Math.max(0, (G.realTime - S.startT) / 60);
  $('title').style.display = 'none';
  p.innerHTML = `<h2 style="font-size:20px">Thanks for playing</h2><p class="lede">the God of Warranty demo</p>
    <div class="stats">

      <div><span>Calls Dropped</span><b>${S.deaths}</b></div>
      <div><span>Mystery Shoppers</span><b>${G.shoppers.size}/5</b></div>

      <div><span>SIMsilver earned</span><b>${S.silverEarned}</b></div>

  openScreen('endcard');

  $('endCredits').onclick = () => { sfx('ui'); closeScreen('endcard'); rollCredits(); };
};
function rollCredits() {

  setTimeout(() => { c.classList.remove('on'); UI.showEnd(); }, 39000);
}

// ---------- keyboard navigation for menus ----------
UI.onKey = (e) => {
  if (G.mode === 'title' && !UI.menuStack.length) {
    const n = UI.titleItems ? UI.titleItems.length : 0;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { UI.titleSel = (UI.titleSel + 1) % n; renderTitleMenu(); sfx('ui', null, 0.5); }
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') { UI.titleSel = (UI.titleSel - 1 + n) % n; renderTitleMenu(); sfx('ui', null, 0.5); }
    else if (e.code === 'Enter' || e.code === 'Space') { const it = UI.titleItems[UI.titleSel]; if (it) { sfx('ui'); it[1](); } }
    return;
  }
  // Escape backs out of the top menu only: it must not also reach the pause toggle in tick()
  if (e.code === 'Escape' && UI.menuStack.includes('settings')) { INPUT.pressed.delete('pause'); closeScreen('settings'); return; }
  if (e.code === 'Escape' && UI.menuStack.includes('kiosk')) { INPUT.pressed.delete('pause'); closeScreen('kiosk'); UI.kioskRes && UI.kioskRes('done'); return; }
};
function updateSkipHint(realDt) {
  const sh = $('skipHint');
  const can = G.mode === 'cine' && DIR.skippable && !DIR.skipping;
  // held for one second of wall-clock time (not frame time), counted from the press or the start of the cutscene
  if (can && INPUT.held.pause) { DIR.holdSkip = (performance.now() - Math.max(INPUT.pausePressT, DIR.cineT || 0)) / 1000; sh.classList.add('on'); sh.querySelector('.ring').style.setProperty('--p', Math.min(100, DIR.holdSkip * 100) + '%'); if (DIR.holdSkip >= 1) { DIR.skipping = true; DIR.holdSkip = 0; sh.classList.remove('on'); hideSub(); } }
  else { DIR.holdSkip = 0; if (!can || !INPUT.held.pause) sh.classList.remove('on'); }
}

// ===== 50-main.js =====
// ================= MAIN =================
const SETTINGS = { ...DEFAULT_SETTINGS, ...Store.get('settings', {}) };
if (!QUALITY[SETTINGS.quality]) SETTINGS.quality = DEFAULT_SETTINGS.quality;
if (URLQ.get('q') && QUALITY[URLQ.get('q')]) SETTINGS.quality = URLQ.get('q');
if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };

const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
async function bootStep(pct, fn) { $('bootBar').style.width = pct + '%'; await nextFrame(); fn(); }

let lastT = 0;
async function boot() {
  try {
    await bootStep(4, () => { initRenderer(); setDofTaps((QUALITY[SETTINGS.quality] || QUALITY.balanced).dofTaps); });
    await bootStep(10, () => { buildTextures(); buildMaterials(); buildClips(); buildBossClips(); buildEnv(); });
    await bootStep(22, () => buildTerrain());
    await bootStep(34, () => buildVegetation());
    await bootStep(44, () => { buildMarkedTree(); buildLonghouse(); buildYard(); });
    await bootStep(52, () => { buildKiosk(); buildClearing(); buildCliffPath(); buildHornibrook(); });
    await bootStep(58, () => { buildBay(); buildSnow(); buildFX(); });
    await bootStep(66, () => { buildLuka(); buildChase(); buildLuke(); buildZane(); buildZee(); buildJarrad(); buildFayeBody(); buildWombat(); buildRueFeed(); buildSlateProp(); });
    await bootStep(74, () => { makePlayer(); buildStoryProps(); buildInteractables(); setupChimePuzzle(); OBJ.shoppers = []; });
    await bootStep(82, () => {
      for (let i = 0; i < 14; i++) POOL.churned.push(new Enemy('churned'));
      for (let i = 0; i < 2; i++) { POOL.brute.push(new Enemy('brute')); POOL.holdmusic.push(new Enemy('holdmusic')); POOL.reviewer.push(new Enemy('reviewer')); }
      BOSS = new Boss();
    });
    await bootStep(88, () => { initInput(); buildHUD(); buildTitle(); applySettings(); wrapBeats(); });
    $('bootBar').style.width = '94%'; await nextFrame();
    // warm up every shader behind the title, so the take never stutters (§12.4)
    for (const e of ENEMIES) e.actor.setVisible(true);
    ACTORS.jarrad.setVisible(true); ACTORS.zee.setVisible(true); OBJ.wombat.root.visible = true;
    await warmShaders([RUE.scene]);
    for (const e of ENEMIES) e.actor.setVisible(false);
    window.__GOW_BOOTED = true;
    enterTitle();
    $('bootBar').style.width = '100%';
    $('boot').style.opacity = 0; setTimeout(() => $('boot').style.display = 'none', 900);
    if (DEBUG) { $('app').appendChild(el('div', '', '')).id = 'dbg'; }
    const cp = URLQ.get('cp');
    if (cp && CHECKPOINTS.includes(cp)) { setTimeout(() => continueGame(cp), 100); }
    if (URLQ.get('autoplay')) { G.flags.autoplay = true; G.flags.god = true; }
    if (URLQ.get('ff')) DIR.ff = +URLQ.get('ff');
    if (URLQ.get('begin')) setTimeout(() => startGame(), 100);
    lastT = performance.now();
    requestAnimationFrame(frame);
  } catch (e) {
    console.error(e);
    $('bootErr').textContent = 'The game could not start: ' + (e && e.message ? e.message : e);
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  let realDt = Math.min(0.1, Math.max(0, (now - lastT) / 1000)); lastT = now;
  G.realTime += realDt;
  try { tick(realDt); } catch (e) { console.error(e); }
  window.__frames = (window.__frames || 0) + 1;
}
function tick(realDt) {
  updateInput(realDt);
  autopilot(realDt);
  // pause (tap) vs skip (hold) during cinematics
  // (the Escape that released the mouse has already paused the game; it must not unpause it again — compared by event
  // time, since at a low frame rate the tick that reads the press can come long after both events)
  const lockEsc = G.mode === 'pause' && Math.abs(INPUT.pausePressT - INPUT.lockLostT) < 400;
  if (wasPressed('pause') && !lockEsc) { if (G.mode === 'cine' && DIR.skippable) INPUT.pauseDownT = G.realTime; else if (G.mode !== 'title' && !UI.menuStack.includes('settings') && !UI.menuStack.includes('kiosk')) UI.togglePause(); }
  // tap vs hold in a cutscene, by wall-clock event times (frame time is capped, so slow machines would misread a hold)
  if (INPUT.released.has('pause') && INPUT.pauseDownT && INPUT.pauseReleaseT - INPUT.pausePressT < 300 && G.mode === 'cine') { UI.pause(); }
  if (INPUT.released.has('pause')) INPUT.pauseDownT = 0;
  if (G.mode === 'title' && INPUT.anyKey) { initAudio(); $('soundHint').style.display = 'none'; }
  const paused = G.mode === 'pause' || G.mode === 'menu';
  if (G.slowT > 0) { G.slowT -= realDt; G.timeScale = G.slowK; if (G.slowT <= 0) { G.timeScale = 1; G.slowK = 1; } }
  let dt = paused ? 0 : realDt * DIR.ff * G.timeScale;
  if (DIR.skipping) dt = Math.min(0.1, realDt * 3);
  G.time += dt; G.lastDt = dt;
  U.time.value += dt; R.post.time += realDt;
  INPUT.weight = INPUT.weightTarget == null ? 1 : damp(INPUT.weight, INPUT.weightTarget, (INPUT.weightRate || 2.5) * 2.5, realDt);
  if (!paused) {
    updateTimers(); updateTweens(dt);
    const hs = G.hitstop > 0; G.hitstop = Math.max(0, G.hitstop - realDt);
    const cdt = hs ? 0 : dt;
    if (G.mode === 'dead') { R.post.desat = damp(R.post.desat, 1, 2, realDt); }
    if (PLAYER && PLAYER.control && wasPressed('chase') && G.combat) chaseCommand();
    if (PLAYER && PLAYER.control && wasPressed('chase') && !G.combat && throwTargets().some(t => t.chase && dist2D(t.pos, PLAYER.pos) < 25)) { CHASE.ai = true; chaseCommand(); }
    updatePlayer(cdt);
    updateChase(cdt);
    for (const e of ENEMIES) { if (!e.alive) continue; if (G.enemyHold && e.state !== 'rise') continue; try { e.update(cdt * (e.kind === 'hamarr' ? G.enemyScale : 1)); } catch (err) { console.error(err); } }
    updateStars(cdt); updatePickups(dt); updateSpikes(dt); updateCarry(dt);
    for (const a of ACTOR_LIST) {
      if (!a.active) continue;
      const k = a.kind !== 'human' ? cdt * G.enemyScale : (a.id === 'luka' || a.id === 'chase') ? cdt : dt;
      try { a.update(k); } catch (err) { console.error(err); }
    }
    // the volleyball spins on one finger
    if (ACTORS.jarrad && ACTORS.jarrad.props.ball.userData.spin) ACTORS.jarrad.props.ball.rotation.y += dt * 14;
    if (PLAYER && PLAYER.axe && ACTORS.luka.props.axe.userData.tag) ACTORS.luka.props.axe.userData.tag.rotation.x = Math.sin(G.time * 3) * 0.25 - ACTORS.luka.speed * 0.05;
    updateWombat(dt); updateRavens(dt); updateDialogue(dt); updateInteract(); updateWorldLife(dt);
    updateFX(dt);
    if (G.title) updateTitleWorld(dt);
    if (CABLE.active || CABLE.rise > 0 || G.title) setCable(G.time);
    // combat music layers follow the fight
    if (G.combat && AUDIO.ok) { const attackers = ENEMIES.filter(e => e.alive && (e.state === 'windup' || e.state === 'active' || e.kind === 'hamarr')).length; setMusicLayers(1, clamp01(attackers / 2 + (PLAYER.hp / PLAYER.maxHp < 0.4 ? 0.5 : 0)), PLAYER.rageActive ? 1 : 0); }
    // the gameplay camera: look input, framing assist, combat/aim modes
    if (PLAYER && PLAYER.control && CAM.gameW > 0.01) {
      CAM.yaw -= INPUT.look.x; CAM.pitch += INPUT.look.y;
      if (G.combat && CAM.gMode !== 'boss') CAM.setGameMode(PLAYER.aiming ? 'aim' : PLAYER.rageActive ? 'rage' : 'combat');
      else if (!G.combat && CAM.gMode !== 'boss') CAM.setGameMode(PLAYER.aiming ? 'aim' : 'explore');
      else if (CAM.gMode === 'boss' && PLAYER.aiming) { CAM.gp.dist = damp(CAM.gp.dist, 2.2, 6, realDt); }
      CAM.assistYaw = 0;
      if (G.combat) { const atk = ENEMIES.find(e => e.alive && e.state === 'windup' && dist2D(e.pos, PLAYER.pos) < 6); if (atk) { const a = angleTo(CAM.yaw, yawTo(PLAYER.pos, atk.pos)); if (Math.abs(a) > 1.7) CAM.assistYaw = Math.sign(a) * 8 * DEG; } }
    }
  }
  updateCamera(paused ? 0 : dt, realDt);
  updateEnv(paused ? 0 : dt);
  updateAudio(realDt);
  renderFrame(dt, realDt);
  updateHUD(realDt); updatePrompts(realDt); drawOverlay(realDt); updateSkipHint(realDt);
  if (DEBUG) updateDebug(realDt);
  endInputFrame();
}

// ---------- debug build (?debug=1) ----------
let dbgT = 0, dbgFps = 60;
function updateDebug(dt) {
  dbgT += dt; dbgFps = lerp(dbgFps, 1 / Math.max(dt, 1e-3), 0.05);
  if (dbgT < 0.25) return; dbgT = 0;
  const d = $('dbg'); if (!d) return;
  const P = PLAYER;
  d.textContent = `fps ${dbgFps.toFixed(0)}  res ${R.w}x${R.h} (${(R.scale * 100) | 0}%)\ncalls ${R.stats.calls}  tris ${(R.stats.tris / 1000).toFixed(0)}k\nmode ${G.mode}  scene ${DIR.scene}  cp ${G.checkpoint}\npos ${P ? P.pos.x.toFixed(1) + ',' + P.pos.y.toFixed(1) + ',' + P.pos.z.toFixed(1) : ''}  state ${P ? P.state : ''}\nenemies ${aliveEnemies().length}  hp ${P ? P.hp.toFixed(0) : ''}  lens ${R.post.focal.toFixed(0)}mm f/${R.post.fStop.toFixed(1)} @${R.post.focusDist.toFixed(1)}m`;
}

// ---------- autopilot for automated play-throughs (?autoplay=1) ----------
const ROUTE = [[-22, -168], [-17, -142], [-9, -116], [-1, -103], [3, -85], [6, -62], [-1, -44], [-8, -32], [-8, -21], [-6, 0], [0, 12], [2, 22], [11, 30], [22, 44], [33, 62], [38, 80], [42, 98], [45, 116], [47, 136], [48, 146], [60, 146], [72, 146]];
const AUTO = { t: 0, swing: 0, stuckT: 0, dodgeT: 0, last: null };
function autopilot(dt) {
  if (!G.flags.autoplay || !PLAYER) return;
  AUTO.t += dt;
  const P = PLAYER;
  if (G.mode === 'cine' && DIR.skippable && !DIR.skipping && URLQ.get('skip')) DIR.skipping = true;
  if (!P.control) return;
  // fight: instantly finish nearby enemies; whittle the boss down so every scripted beat triggers
  if (G.combat) {
    const e = nearestEnemy(P.pos, 60);
    if (e && AUTO.t > 0.6) {
      AUTO.t = 0;
      if (e.kind === 'hamarr') { if (e.state === 'down') { e.closeTheDeal(); } else if (e.finisherReady) e.closeTheDeal(); else if (!e.scripted && e.state !== 'scripted' && e.state !== 'intro') e.hurt({ dmg: 140, stun: 0 }); }
      else e.hurt({ dmg: 999, stun: 0, react: 'stagger', src: 'melee' });
    }
    if (BOSS && BOSS.alive && BOSS.state === 'down') BOSS.closeTheDeal();
    return;
  }
  // walk the route toward whatever the current beat is waiting for
  let target = null;
  const sc = DIR.scene;
  if (sc === 'grove') target = OBJ.tree.base;
  else if (sc === 'walk_home') target = P.pos.x > 50 ? V3(48, 0, 147) : MARKS.ladder.pos;
  else if (sc === 'knock') target = MARKS.door_out.pos;
  else {
    // monotonic progress along the route
    if (AUTO.idx == null || AUTO.scene !== sc) { let bi = 0, bd = 1e9; ROUTE.forEach((r, i) => { const d = Math.hypot(P.pos.x - r[0], P.pos.z - r[1]); if (d < bd) { bd = d; bi = i; } }); AUTO.idx = bi; AUTO.scene = sc; }
    while (AUTO.idx < ROUTE.length - 1 && Math.hypot(P.pos.x - ROUTE[AUTO.idx][0], P.pos.z - ROUTE[AUTO.idx][1]) < 3) AUTO.idx++;
    const nx = ROUTE[AUTO.idx]; target = V3(nx[0], 0, nx[1]);
  }
  if (sc === 'grove' && dist2D(P.pos, target) < 2.0) { P.actor.yaw = yawTo(P.pos, target); if (P.state === 'free' && (AUTO.swing -= dt) <= 0) { AUTO.swing = 0.8; press('light'); setTimeout(() => release('light'), 30); } INPUT.move.x = INPUT.move.y = 0; return; }
  if (!target) return;
  camBasis();
  const d = _v[0].copy(target).sub(P.pos).setY(0); if (d.length() < 0.5) return; d.normalize();
  // snagged on a prop: sidestep for a moment, then try the straight line again
  if (!AUTO.last) AUTO.last = P.pos.clone();
  AUTO.stuckT = dist2D(P.pos, AUTO.last) < 0.04 ? AUTO.stuckT + dt : 0; AUTO.last.copy(P.pos);
  if (AUTO.stuckT > 1.2) { AUTO.dodgeT = 1.0; AUTO.dodgeSide = -(AUTO.dodgeSide || 1); AUTO.stuckT = 0; }
  if (AUTO.dodgeT > 0) { AUTO.dodgeT -= dt; d.set(-d.z * AUTO.dodgeSide, 0, d.x * AUTO.dodgeSide).addScaledVector(d, 0.3).normalize(); }
  INPUT.move.y = d.dot(_pv.f); INPUT.move.x = d.dot(_pv.r);
}

window.__GOW = {
  G, R, CAM, PLAYER: () => PLAYER, ACTORS, ACTOR_LIST, ENEMIES, DIR, OBJ, PROPS, RUE, CABLE, LOC, groundHeight, setEnv, continueGame, startGame, callBack,
  skip: () => { DIR.skipping = true; }, killAll: () => ENEMIES.forEach(e => e.alive && e.kind !== 'hamarr' && e.hurt({ dmg: 9999 })),
  tp: (x, z) => { PLAYER.pos.set(x, groundHeight(x, z), z); }, god: (v = true) => { G.flags.god = v; },
};
// scenes abandoned by a checkpoint reload reject with Abort; that's expected, not an error
window.addEventListener('unhandledrejection', e => { if (e.reason && e.reason.isAbort) e.preventDefault(); });
boot();

</script>
